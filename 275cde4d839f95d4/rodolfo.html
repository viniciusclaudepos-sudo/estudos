help with reading."}, {"tipo": "escolha", "pergunta": "I'm ___ father.", "opcoes": ["Sofia's", "Sofia", "of Sofia"], "certa": 0, "explica": "O 's marca o dono: Sofia's father."}, {"tipo": "escolha", "pergunta": "She ___ in third grade.", "opcoes": ["is", "are", "am"], "certa": 0, "explica": "She, uma pessoa, pede is."}, {"tipo": "montar", "pergunta": "Eu sou o pai da Sofia.", "resposta": "I am Sofia's father", "extras": ["is", "the", "daughter"]}, {"tipo": "montar", "pergunta": "Ela precisa de ajuda com leitura.", "resposta": "She needs help with reading", "extras": ["need", "to", "read"]}, {"tipo": "pares", "pares": [["father", "pai"], ["daughter", "filha"], ["third grade", "terceiro ano"], ["reading", "leitura"], ["homework", "lição de casa"], ["conference", "reunião"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "She is in third grade."}, {"tipo": "falar", "texto": "Hi, I'm Sofia's father. How is she doing?", "traducao": "Oi, sou o pai da Sofia. Como ela está indo?"}], "semana": 3}, {"id": "RO-19", "titulo": "Emergência", "missao": "Fora do app: escreva num papel o seu endereço completo em inglês (número, rua, apartamento) e treine dizê-lo em voz alta cinco vezes, devagar e claro.", "itens": [{"tipo": "dica", "rotulo": "Lição 19 · 1/2", "titulo": "As três frases que resolvem", "html": "<p>Numa emergência você não precisa de inglês perfeito. Precisa de três frases decoradas.<\/p><table><tr><td>Help!<\/td><td>Socorro!<\/td><\/tr><tr><td>Call 911!<\/td><td>Chame o 911!<\/td><\/tr><tr><td>I need an ambulance.<\/td><td>Preciso de uma ambulância.<\/td><\/tr><\/table><p><b>911<\/b> se diz <i>nine-one-one<\/i> — /ˌnaɪn wʌn ˈwʌn/, “nain-uân-uân”, dígito por dígito. Nos Estados Unidos ninguém fala “nine eleven” para o telefone de emergência.<\/p><p>Se outra pessoa estiver com você, aponte e diga: <b>My wife is sick.<\/b> (minha mulher está doente) ou <b>My daughter is hurt.<\/b> (minha filha está machucada).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 19 · 2/2", "titulo": "O endereço e a linha", "html": "<p>Quem atende pergunta o endereço primeiro. Tenha essa frase pronta:<\/p><table><tr><td>I'm at 123 Main Street.<\/td><td>Estou na 123 Main Street.<\/td><\/tr><tr><td>Apartment 4B.<\/td><td>Apartamento 4B.<\/td><\/tr><tr><td>I don't speak English well.<\/td><td>Eu não falo inglês bem.<\/td><\/tr><tr><td>Please speak slowly.<\/td><td>Por favor, fale devagar.<\/td><\/tr><\/table><p>Depois o atendente pede <b>Stay on the line<\/b> (“fique na linha”) ou <b>Don't hang up<\/b> (“não desligue”), e avisa <b>Help is coming<\/b> (“a ajuda está indo”). Responda <span class='ex'>OK. I'm here.<\/span> e fique na linha até chegar alguém. <b>Não desligue<\/b> — é isso que garante que a ajuda chega.<\/p><p>Se não entender o número, repita o seu endereço dígito por dígito: <span class='ex'>one-two-three<\/span>, devagar.<\/p><p>Essas frases são para uma emergência de verdade. No dia a dia, continue com o <i>excuse me<\/i> e o <i>please<\/i>.<\/p>"}, {"tipo": "leitura", "titulo": "Calling 911", "texto": "911. What is your emergency? — I need an ambulance. My wife is sick. — What is your address? — 123 Main Street, apartment 4B. — OK. I'm sending help. Stay on the line. — I don't speak English well. — That's OK. Help is coming. Don't hang up.", "glossario": [["What is your emergency?", "Qual é a emergência?"], ["ambulance", "ambulância"], ["address", "endereço"], ["I'm sending help", "estou mandando ajuda"], ["Stay on the line", "fique na linha"], ["Help is coming", "a ajuda está chegando"], ["Don't hang up", "não desligue"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele precisa?", "opcoes": ["Uma ambulância", "Um táxi", "Um policial"], "certa": 0, "explica": "Ele diz “I need an ambulance”: uma ambulância.", "audio": "I need an ambulance."}, {"tipo": "escolha", "pergunta": "Ouça: qual é o endereço?", "opcoes": ["123 Main Street", "132 Main Street", "123 Pine Street"], "certa": 0, "explica": "Ele diz “123 Main Street”: um-dois-três, Main Street.", "audio": "I'm at 123 Main Street."}, {"tipo": "escolha", "pergunta": "I need ___ ambulance.", "opcoes": ["an", "a", "of"], "certa": 0, "explica": "Ambulance começa com som de vogal: an ambulance."}, {"tipo": "escolha", "pergunta": "Don't ___ up! (não desligue)", "opcoes": ["hang", "hangs", "hanging"], "certa": 0, "explica": "Depois de don't o verbo fica na forma pura: don't hang up."}, {"tipo": "montar", "pergunta": "Eu preciso de uma ambulância.", "resposta": "I need an ambulance", "extras": ["a", "call", "help"]}, {"tipo": "montar", "pergunta": "Eu não falo inglês bem.", "resposta": "I don't speak English well", "extras": ["not", "good", "am"]}, {"tipo": "pares", "pares": [["ambulance", "ambulância"], ["Help!", "Socorro!"], ["address", "endereço"], ["sick", "doente"], ["Stay on the line", "fique na linha"], ["Don't hang up", "não desligue"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "Please don't hang up."}, {"tipo": "falar", "texto": "Help! Call 911. I need an ambulance.", "traducao": "Socorro! Chame o 911. Preciso de uma ambulância."}], "semana": 3}, {"id": "RO-20", "titulo": "Revisão da semana 3", "missao": "Fora do app: crie agora um alarme diário no celular, sempre no mesmo horário, com o nome “English 15 min”. É o alarme que resolve o esquecimento.", "itens": [{"tipo": "dica", "rotulo": "Lição 20 · 1/2", "titulo": "O mapa da semana", "html": "<p>Nove frases. Uma por situação. Se você só lembrar destas, a semana valeu.<\/p><table><tr><td>Farmácia<\/td><td>I have a headache.<\/td><\/tr><tr><td>Farmácia<\/td><td>How often do I take it?<\/td><\/tr><tr><td>Banco<\/td><td>I want to open an account.<\/td><\/tr><tr><td>Banco<\/td><td>How much is the fee?<\/td><\/tr><tr><td>Casa<\/td><td>The sink is leaking.<\/td><\/tr><tr><td>Casa<\/td><td>Can you come tomorrow?<\/td><\/tr><tr><td>Escola<\/td><td>I'm Sofia's father. She is in third grade.<\/td><\/tr><tr><td>Emergência<\/td><td>I need an ambulance.<\/td><\/tr><tr><td>Vizinhos<\/td><td>Let me know if you need anything.<\/td><\/tr><\/table><p>Leia a coluna do inglês em voz alta, de cima para baixo, sem olhar a tradução.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 20 · 2/2", "titulo": "Quando você não entende", "html": "<p>Toda situação desta semana tem a mesma saída quando o inglês não vem:<\/p><table><tr><td>Sorry, I don't understand.<\/td><td>Desculpe, não entendi.<\/td><\/tr><tr><td>Can you repeat that, please?<\/td><td>Pode repetir, por favor?<\/td><\/tr><tr><td>Slowly, please.<\/td><td>Devagar, por favor.<\/td><\/tr><tr><td>I'm learning.<\/td><td>Estou aprendendo.<\/td><\/tr><\/table><p>Nenhuma dessas frases faz você parecer menos — elas fazem a conversa continuar.<\/p><p>E a regra do estudo: <b>15 minutos no mesmo horário valem mais que duas horas no domingo<\/b>. Se você esquecer, o problema não é a memória, é a falta de gatilho. Marque o alarme hoje, na mesma hora todos os dias.<\/p>"}, {"tipo": "leitura", "titulo": "One week in the US", "texto": "Monday. At the pharmacy. — I have a headache. — How often do I take it? — Twice a day. Tuesday. At the bank. — I want to open an account. — How much is the fee? — Five dollars a month. Wednesday. At home. — The sink is leaking. — Can you come tomorrow? Thursday. At school. — I'm Sofia's father. — How is she doing? Friday. At the door. — Hi, I'm your neighbor. Let me know if you need anything.", "glossario": [["pharmacy", "farmácia"], ["headache", "dor de cabeça"], ["twice a day", "duas vezes ao dia"], ["open an account", "abrir uma conta"], ["fee", "taxa"], ["leaking", "vazando"], ["neighbor", "vizinho"], ["Let me know", "me avise"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que está acontecendo?", "opcoes": ["A pia está vazando", "A conta está fechada", "A escola está aberta"], "certa": 0, "explica": "Ele diz “the sink is leaking”: a pia está vazando.", "audio": "The sink is leaking."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele oferece?", "opcoes": ["Ajuda, se você precisar", "Um jantar", "Uma carona"], "certa": 0, "explica": "“Let me know if you need anything”: me avise se precisar de algo.", "audio": "Let me know if you need anything."}, {"tipo": "escolha", "pergunta": "I ___ a headache.", "opcoes": ["have", "has", "am"], "certa": 0, "explica": "Sintoma vai com have; com I, have."}, {"tipo": "escolha", "pergunta": "I want ___ open an account.", "opcoes": ["to", "for", "at"], "certa": 0, "explica": "Want pede to antes do verbo: want to open."}, {"tipo": "montar", "pergunta": "Eu tenho dor de cabeça.", "resposta": "I have a headache", "extras": ["has", "the", "need"]}, {"tipo": "montar", "pergunta": "Eu moro na casa ao lado.", "resposta": "I live next door", "extras": ["am", "the", "neighbor"]}, {"tipo": "pares", "pares": [["headache", "dor de cabeça"], ["fee", "taxa"], ["leaking", "vazando"], ["third grade", "terceiro ano"], ["neighbor", "vizinho"], ["ambulance", "ambulância"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "How much is the fee?"}, {"tipo": "falar", "texto": "I don't speak English well. Please speak slowly.", "traducao": "Eu não falo inglês bem. Por favor, fale devagar."}], "semana": 3}, {"id": "RO-21", "titulo": "Vizinhos", "missao": "Fora do app: hoje, ao sair ou voltar para casa, diga “Hi, I'm Rodolfo. I live next door” para um vizinho de verdade — mesmo que ele só responda “hi”.", "itens": [{"tipo": "dica", "rotulo": "Lição 21 · 1/2", "titulo": "Hi, I'm your neighbor", "html": "<p>A primeira conversa com o vizinho é a mais fácil do curso: ele também quer conhecer você.<\/p><table><tr><td>Hi, I'm your neighbor.<\/td><td>Oi, sou seu vizinho.<\/td><\/tr><tr><td>I live next door.<\/td><td>Moro na casa ao lado.<\/td><\/tr><tr><td>We just moved in.<\/td><td>Nós acabamos de nos mudar.<\/td><\/tr><tr><td>This is my wife, Bruna.<\/td><td>Esta é minha esposa, Bruna.<\/td><\/tr><\/table><p>Pronúncia: <b>neighbor<\/b> é /ˈneɪbər/ — “nêi-bor”. O <i>gh<\/i> não soa. Igual em <span class='ex'>eight<\/span> (oito) e <span class='ex'>night<\/span> (noite).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 21 · 2/2", "titulo": "Let me know", "html": "<p><b>Let me know if you need anything.<\/b> = “Me avise se precisar de qualquer coisa.” É a frase mais útil da vizinhança: serve para oferecer e para agradecer.<\/p><table><tr><td>Let me know if you need anything.<\/td><td>Me avise se precisar de algo.<\/td><\/tr><tr><td>Welcome to the neighborhood!<\/td><td>Bem-vindo ao bairro!<\/td><\/tr><tr><td>Thank you. Same to you.<\/td><td>Obrigado. Igual para você.<\/td><\/tr><tr><td>Have a good one!<\/td><td>Tenha um bom dia! (despedida informal)<\/td><\/tr><\/table><p>Se você pegar só o começo, <span class='ex'>Let me know<\/span>, já pegou tudo: é “me avise”.<\/p>"}, {"tipo": "leitura", "titulo": "The new neighbor", "texto": "Hi! I'm Mark. I live next door. — Hi, Mark. I'm Rodolfo. We just moved in. — Welcome to the neighborhood! — Thank you. This is my wife, Bruna. — Nice to meet you. Let me know if you need anything. — Thanks. Same to you.", "glossario": [["next door", "na casa ao lado"], ["We just moved in", "acabamos de nos mudar"], ["Welcome", "bem-vindo, bem-vinda"], ["neighborhood", "bairro, vizinhança"], ["Let me know", "me avise"], ["anything", "qualquer coisa"], ["Same to you", "igual para você"]]}, {"tipo": "escolha", "pergunta": "Ouça: onde ele mora?", "opcoes": ["Na casa ao lado", "Na esquina", "Longe daqui"], "certa": 0, "explica": "Ele diz “next door”: na casa ao lado.", "audio": "I live next door."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele oferece?", "opcoes": ["Ajuda, se precisar", "Um jantar", "Uma carona"], "certa": 0, "explica": "“Let me know if you need anything”: me avise se precisar de algo.", "audio": "Let me know if you need anything."}, {"tipo": "escolha", "pergunta": "I live ___ door.", "opcoes": ["next", "near", "side"], "certa": 0, "explica": "A expressão fixa é next door: na casa ao lado."}, {"tipo": "escolha", "pergunta": "Let me ___ if you need anything.", "opcoes": ["know", "knows", "knowing"], "certa": 0, "explica": "Depois de let me o verbo vem na forma pura: let me know."}, {"tipo": "montar", "pergunta": "Eu moro na casa ao lado.", "resposta": "I live next door", "extras": ["am", "the", "neighbors"]}, {"tipo": "montar", "pergunta": "Me avise se precisar de algo.", "resposta": "Let me know if you need anything", "extras": ["to", "what", "knows"]}, {"tipo": "pares", "pares": [["neighbor", "vizinho"], ["next door", "ao lado"], ["moved in", "nos mudamos"], ["neighborhood", "bairro"], ["Let me know", "me avise"], ["anything", "qualquer coisa"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "We just moved in."}, {"tipo": "falar", "texto": "Hi, I'm your neighbor. Let me know if you need anything.", "traducao": "Oi, sou seu vizinho. Me avise se precisar de qualquer coisa."}], "semana": 3}, {"id": "RO-22", "titulo": "Trabalho: I work as a lawyer in Brazil, I work remotely", "missao": "Fora do app: escreva num papel três frases sobre o seu trabalho (o que você faz, para quem e de onde) e diga cada uma em voz alta cinco vezes.", "itens": [{"tipo": "dica", "rotulo": "Lição 22 · 1/2", "titulo": "Três frases que explicam seu trabalho", "html": "<p>Toda conversa sobre trabalho começa com três informações, e cada uma pede uma palavra de ligação diferente:<\/p><table><tr><td>I work <b>as<\/b> a lawyer.<\/td><td>Eu trabalho <i>como<\/i> advogado.<\/td><\/tr><tr><td>I work <b>for<\/b> a law firm.<\/td><td>Eu trabalho <i>para<\/i> um escritório.<\/td><\/tr><tr><td>I work <b>with<\/b> a team.<\/td><td>Eu trabalho <i>com<\/i> uma equipe.<\/td><\/tr><\/table><p><b>as<\/b> = a profissão · <b>for<\/b> = a empresa · <b>with<\/b> = as pessoas. Trocar essas três é o erro número um do brasileiro nessa frase.<\/p><p>O seu caso, em três pedaços: <span class='ex'>I work as a lawyer.<\/span> <span class='ex'>I work for a law firm.<\/span> <span class='ex'>I work in Brazil.<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 22 · 2/2", "titulo": "Remoto, mas presente", "html": "<p>Para dizer que você não está no prédio há dois jeitos. O curto: <span class='ex'>I work remotely.<\/span> O mais comum na fala: <span class='ex'>I work from home.<\/span><\/p><p><b>from home<\/b>, nunca <i>in home<\/i>. Parece pequeno, mas é o que separa o certo do errado na boca do nativo.<\/p><p>Som: <b>remotely<\/b> = /ri-MOU-tli/ — o acento cai no MOU e o fim é tli, não têli. <span class='ex'>I work remotely.<\/span> <span class='ex'>She works remotely.<\/span><\/p><p>Se perguntarem se você trabalha ali: <span class='ex'>No, I work remotely.<\/span> Uma frase, e a conversa segue.<\/p>"}, {"tipo": "leitura", "titulo": "Do you work here?", "texto": "Hi, I'm Anna. Do you work here? — Hi, Anna. I'm Rodolfo. No, I don't. I work for a law firm in Brazil. — Nice. What do you do? — I work as a lawyer. — Do you work here in New York? — No. I work remotely. I work from home. — That's great. — Yeah, I like it.", "glossario": [["Do you work here?", "Você trabalha aqui?"], ["What do you do?", "O que você faz (de profissão)?"], ["law firm", "escritório de advocacia"], ["remotely", "remotamente, à distância"], ["from home", "de casa"], ["don't", "não (forma curta de do not)"], ["That's great", "Que ótimo"]]}, {"tipo": "escolha", "pergunta": "Ouça: onde ele trabalha?", "opcoes": ["Num escritório de advocacia no Brasil", "Num banco no Brasil", "Num escritório em Nova York"], "certa": 0, "explica": "law firm é escritório de advocacia, e in Brazil fecha o lugar.", "audio": "I work for a law firm in Brazil."}, {"tipo": "escolha", "pergunta": "Ouça: como ele trabalha?", "opcoes": ["De casa, à distância", "No escritório, todo dia", "De carro"], "certa": 0, "explica": "remotely quer dizer à distância, de casa.", "audio": "I work remotely."}, {"tipo": "escolha", "pergunta": "I work ___ a lawyer.", "opcoes": ["as", "for", "in"], "certa": 0, "explica": "A profissão pede as: work as a lawyer."}, {"tipo": "escolha", "pergunta": "I work ___ a law firm.", "opcoes": ["for", "as", "with"], "certa": 0, "explica": "A empresa pede for: work for a law firm."}, {"tipo": "montar", "pergunta": "Eu trabalho como advogado.", "resposta": "I work as a lawyer", "extras": ["for", "in", "am"]}, {"tipo": "montar", "pergunta": "Eu trabalho de casa.", "resposta": "I work from home", "extras": ["in", "of", "as"], "aceitas": ["I work at home"]}, {"tipo": "pares", "pergunta": "Ligue o inglês ao português", "pares": [["lawyer", "advogado"], ["law firm", "escritório de advocacia"], ["remotely", "remotamente"], ["from home", "de casa"], ["team", "equipe"]]}, {"tipo": "ouvir", "texto": "I work from home."}, {"tipo": "falar", "texto": "I work as a lawyer. I work from home.", "traducao": "Eu trabalho como advogado. Eu trabalho de casa."}], "semana": 4}, {"id": "RO-23", "titulo": "Reunião: Can you speak slower, please?, Let me check and get back to you", "missao": "Fora do app: grave um áudio de 30 segundos fingindo uma reunião, com as duas frases da lição dentro: pedir para falar devagar e pedir tempo para conferir.", "itens": [{"tipo": "dica", "rotulo": "Lição 23 · 1/2", "titulo": "Quando você não entende nada", "html": "<p>Numa reunião em inglês, o silêncio assusta mais que o erro. Três frases seguram a conversa sozinhas:<\/p><table><tr><td>Can you speak slower, please?<\/td><td>Você pode falar mais devagar, por favor?<\/td><\/tr><tr><td>Can you repeat that, please?<\/td><td>Você pode repetir isso, por favor?<\/td><\/tr><tr><td>I'm learning English.<\/td><td>Estou aprendendo inglês.<\/td><\/tr><\/table><p>Todas terminam com <b>please<\/b> — sem ele a frase vira ordem. E o pedido abre com <b>Can<\/b>: não é <i>Do<\/i> nem <i>Are<\/i>.<\/p><p>Som: <b>slower<\/b> = /SLÔ-uer/ · <b>repeat<\/b> = /ri-PÍT/, com o acento no fim.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 23 · 2/2", "titulo": "Ganhar tempo sem mentir", "html": "<p>Quando a pergunta é técnica e você precisa pensar, não invente resposta. Peça tempo:<\/p><p><span class='ex'>One minute, please.<\/span> (um minuto, por favor)<\/p><p><span class='ex'>Let me check.<\/span> (deixa eu conferir)<\/p><p><span class='ex'>I'll get back to you.<\/span> (eu te retorno)<\/p><p><b>Let me<\/b> = deixa eu. É o que abre uma ação que você mesmo vai fazer.<\/p><p><b>get back to you<\/b> = voltar a falar com você. Nunca diga <i>return to you<\/i>: ninguém fala assim.<\/p><p>Juntando as duas ideias: <span class='ex'>Let me check and get back to you.<\/span> É a frase mais útil da sua semana.<\/p>"}, {"tipo": "leitura", "titulo": "In the meeting", "texto": "Good morning, everyone. Let's start. — Hi, Anna. This is Rodolfo. — Hi, Rodolfo. Sorry, can you speak slower, please? — Sure, no problem. — Thank you. I'm learning English. — OK. Do you have the numbers? — One minute, please. Let me check. … OK, I have them. — Great. Can you send an email? — Yes. I'll get back to you today.", "glossario": [["everyone", "todo mundo"], ["Let's start", "vamos começar"], ["Sorry", "desculpe"], ["no problem", "sem problema"], ["the numbers", "os números, os dados"], ["I have them", "eu tenho (eles)"], ["send", "enviar"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele pede?", "opcoes": ["Para falar mais devagar", "Para falar mais alto", "Para repetir o nome dele"], "certa": 0, "explica": "slower é mais devagar; a frase não pede volume.", "audio": "Can you speak slower, please?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ele vai fazer?", "opcoes": ["Conferir e retornar depois", "Enviar o e-mail agora", "Cancelar a reunião"], "certa": 0, "explica": "check é conferir e get back to you é retornar depois.", "audio": "Let me check and get back to you."}, {"tipo": "escolha", "pergunta": "___ you speak slower, please?", "opcoes": ["Can", "Do", "Are"], "certa": 0, "explica": "Pedido abre com Can; Do e Are pedem outro tipo de frase."}, {"tipo": "escolha", "pergunta": "I'll get back ___ you.", "opcoes": ["to", "for", "with"], "certa": 0, "explica": "A expressão é fixa: get back to you."}, {"tipo": "montar", "pergunta": "Você pode falar mais devagar, por favor?", "resposta": "Can you speak slower please", "extras": ["Do", "for", "to"]}, {"tipo": "montar", "pergunta": "Deixa eu conferir e te retorno.", "resposta": "Let me check and get back to you", "extras": ["for", "my", "am"]}, {"tipo": "pares", "pergunta": "Ligue o inglês ao português", "pares": [["slower", "mais devagar"], ["repeat", "repetir"], ["check", "conferir"], ["get back to you", "te retorno"], ["one minute", "um minuto"]]}, {"tipo": "ouvir", "texto": "Can you repeat that, please?"}, {"tipo": "falar", "texto": "Let me check and get back to you.", "traducao": "Deixa eu conferir e te retorno."}], "semana": 4}, {"id": "RO-24", "titulo": "E-mail e mensagem curta: Best regards, Thanks for your message", "missao": "Fora do app: escreva de verdade um e-mail de quatro linhas para um colega — saudação, agradecimento, uma informação e o fecho Best regards.", "itens": [{"tipo": "dica", "rotulo": "Lição 24 · 1/2", "titulo": "O e-mail de quatro linhas", "html": "<p>E-mail de trabalho em inglês é curto por educação, não por pressa. A estrutura é sempre a mesma:<\/p><table><tr><td>Hi Anna,<\/td><td>saudação, com vírgula<\/td><\/tr><tr><td>Thanks for your message.<\/td><td>abertura<\/td><\/tr><tr><td>I'll send the report today.<\/td><td>a informação<\/td><\/tr><tr><td>Best regards, Rodolfo<\/td><td>fecho e nome<\/td><\/tr><\/table><p><b>Best regards<\/b> = atenciosamente, o fecho padrão. <b>Dear Anna<\/b> só para cliente ou primeira vez; com colega, <b>Hi Anna<\/b>.<\/p><p>Depois do fecho, o nome na linha de baixo. Nada de <i>Bye<\/i> nem <i>Kisses<\/i> em e-mail de trabalho.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 24 · 2/2", "titulo": "Mensagem curta: o tom americano", "html": "<p>No chat do trabalho o americano escreve ainda mais curto:<\/p><p><span class='ex'>Hi, Anna. Are you free today?<\/span><\/p><p><span class='ex'>OK, thanks!<\/span><\/p><p><span class='ex'>I'll send it today.<\/span><\/p><p><span class='ex'>See you tomorrow.<\/span><\/p><p><b>Thanks!<\/b> com exclamação é normal e simpático; não é exagero de brasileiro. E <b>I'll<\/b> = I will, o <i>vou<\/i> que promete alguma coisa.<\/p><p>Cuidado com uma mania nossa: <span class='ex'>I'll send it today<\/span> já é resposta completa. Não precisa de <i>OK?<\/i> no fim.<\/p>"}, {"tipo": "leitura", "titulo": "A short email", "texto": "Hi Anna, Thanks for your message. The report is ready. I'll send it today. Best regards, Rodolfo. — Hi Rodolfo, Great, thanks! I need it tomorrow. See you. — Anna", "glossario": [["Thanks for your message", "Obrigado pela sua mensagem"], ["report", "relatório"], ["ready", "pronto"], ["I'll send", "vou enviar"], ["Best regards", "Atenciosamente"], ["I need it", "eu preciso dele"], ["Great", "ótimo"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele vai enviar?", "opcoes": ["O relatório", "O contrato", "O e-mail"], "certa": 0, "explica": "send the report é enviar o relatório.", "audio": "I'll send the report today."}, {"tipo": "escolha", "pergunta": "Ouça: de que ela precisa?", "opcoes": ["Do relatório, amanhã", "Do e-mail, hoje", "Do contrato, semana que vem"], "certa": 0, "explica": "it é o relatório e tomorrow é amanhã.", "audio": "I need it tomorrow."}, {"tipo": "escolha", "pergunta": "Thanks ___ your message.", "opcoes": ["for", "to", "of"], "certa": 0, "explica": "Agradecer usa for: thanks for."}, {"tipo": "escolha", "pergunta": "___ regards,", "opcoes": ["Best", "Better", "Good"], "certa": 0, "explica": "O fecho fixo é Best regards."}, {"tipo": "montar", "pergunta": "Obrigado pela sua mensagem.", "resposta": "Thanks for your message", "extras": ["to", "my", "of"]}, {"tipo": "montar", "pergunta": "Até amanhã.", "resposta": "See you tomorrow", "extras": ["meet", "good", "day"]}, {"tipo": "pares", "pergunta": "Ligue o inglês ao português", "pares": [["Best regards", "Atenciosamente"], ["Thanks for your message", "Obrigado pela sua mensagem"], ["report", "relatório"], ["ready", "pronto"], ["See you tomorrow", "Até amanhã"]]}, {"tipo": "ouvir", "texto": "Thanks for your message."}, {"tipo": "falar", "texto": "I'll send the report today. Best regards.", "traducao": "Vou enviar o relatório hoje. Atenciosamente."}], "semana": 4}, {"id": "RO-25", "titulo": "Small talk de elevador: tempo, fim de semana, Have a good one!", "missao": "Fora do app: no elevador ou na portaria, cumprimente alguém com How's it going? e responda com Good, thanks. And you? — sem traduzir na cabeça.", "itens": [{"tipo": "dica", "rotulo": "Lição 25 · 1/2", "titulo": "As três aberturas", "html": "<p><b>small talk<\/b> é a conversa fiada, o papo de elevador. Ela não quer história: quer dois segundos de simpatia. Três frases abrem quase tudo:<\/p><table><tr><td>How's it going?<\/td><td>Como vai?<\/td><\/tr><tr><td>How was your weekend?<\/td><td>Como foi seu fim de semana?<\/td><\/tr><tr><td>Nice weather today, right?<\/td><td>Tempo bom hoje, né?<\/td><\/tr><\/table><p><b>How's<\/b> = how is. Na fala sai tudo grudado: /RAU-zi-GOU-in/. <span class='ex'>How's it going?<\/span> <span class='ex'>How's your day?<\/span><\/p><p>A terceira é a mais segura: fala do tempo, ninguém discorda.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 25 · 2/2", "titulo": "A resposta e a saída", "html": "<p>A resposta é curta e devolve a pergunta:<\/p><table><tr><td>Good, thanks. And you?<\/td><td>bem, obrigado. E você?<\/td><\/tr><tr><td>Not bad.<\/td><td>nada mal<\/td><\/tr><tr><td>Busy week.<\/td><td>semana cheia<\/td><\/tr><\/table><p>Quando o elevador chega, você sai com:<\/p><table><tr><td>Have a good one!<\/td><td>tenha um bom dia<\/td><\/tr><tr><td>You too!<\/td><td>você também<\/td><\/tr><\/table><p><b>one<\/b> aqui não é <i>um<\/i>: é o dia. É a despedida mais comum do americano e a que mais faz você soar natural.<\/p><p>Responda sempre com <b>You too<\/b>, curto. Explicar por que também é bom dia estraga o encanto.<\/p>"}, {"tipo": "leitura", "titulo": "In the elevator", "texto": "Morning, Rodolfo! — Morning, Anna! How's it going? — Good, thanks. And you? — Not bad. Busy week. — Yeah, me too. Nice weather today, right? — Yeah, beautiful. How was your weekend? — Good. I was at home. — Nice. This is my floor. Have a good one! — You too! See you.", "glossario": [["How's it going?", "Como vai?"], ["Not bad", "Nada mal"], ["Busy week", "Semana cheia"], ["me too", "eu também"], ["beautiful", "lindo, ótimo"], ["weekend", "fim de semana"], ["my floor", "meu andar"]]}, {"tipo": "escolha", "pergunta": "Ouça: como ele está?", "opcoes": ["Bem, obrigado", "Cansado", "Doente"], "certa": 0, "explica": "Good, thanks é a resposta padrão de como vai.", "audio": "Good, thanks. And you?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ela deseja?", "opcoes": ["Um bom dia", "Boa sorte", "Bom apetite"], "certa": 0, "explica": "Have a good one é a despedida: tenha um bom dia.", "audio": "Have a good one!"}, {"tipo": "escolha", "pergunta": "How's it ___?", "opcoes": ["going", "go", "gone"], "certa": 0, "explica": "A expressão é fixa: how's it going."}, {"tipo": "escolha", "pergunta": "Nice weather today, ___?", "opcoes": ["right", "no", "yes"], "certa": 0, "explica": "A pergunta curta no fim é right, o nosso né."}, {"tipo": "montar", "pergunta": "Como vai?", "resposta": "How's it going", "extras": ["are", "do", "you"], "aceitas": ["How is it going"]}, {"tipo": "montar", "pergunta": "Tenha um bom dia!", "resposta": "Have a good one", "extras": ["nice", "week", "day"]}, {"tipo": "pares", "pergunta": "Ligue o inglês ao português", "pares": [["How's it going?", "Como vai?"], ["Not bad", "Nada mal"], ["Busy week", "Semana cheia"], ["Have a good one!", "Tenha um bom dia!"], ["You too", "Você também"], ["weekend", "fim de semana"]]}, {"tipo": "ouvir", "texto": "Good, thanks. And you?"}, {"tipo": "falar", "texto": "How's it going? Good, thanks. And you?", "traducao": "Como vai? Bem, obrigado. E você?"}], "semana": 4}, {"id": "RO-26", "titulo": "Passado básico: I went, I did, yesterday, last week", "missao": "Fora do app: à noite, escreva no celular três frases com yesterday sobre o seu dia e leia em voz alta cada uma.", "itens": [{"tipo": "dica", "rotulo": "Lição 26 · 1/2", "titulo": "Ontem, o verbo muda", "html": "<p>Cinco verbos, cinco formas. São os únicos que você decora agora; o resto espera.<\/p><table><tr><td>hoje<\/td><td>ontem<\/td><\/tr><tr><td>I go<\/td><td>I <b>went<\/b><\/td><\/tr><tr><td>I see<\/td><td>I <b>saw<\/b><\/td><\/tr><tr><td>I have<\/td><td>I <b>had<\/b><\/td><\/tr><tr><td>I do<\/td><td>I <b>did<\/b><\/td><\/tr><tr><td>I am<\/td><td>I <b>was<\/b><\/td><\/tr><\/table><p>E o verbo não muda com a pessoa: <span class='ex'>I went<\/span>, <span class='ex'>he went<\/span>, <span class='ex'>we went<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 26 · 2/2", "titulo": "O marcador manda", "html": "<p>Quem avisa que é passado é a palavra de tempo. Se ela aparece, o verbo muda:<\/p><p><span class='ex'>I went to the office yesterday.<\/span> (nunca I go)<\/p><p><span class='ex'>I saw Anna yesterday.<\/span><\/p><p><span class='ex'>I had a meeting yesterday.<\/span><\/p><p><span class='ex'>I was at home last week.<\/span><\/p><p><b>yesterday<\/b> = ontem · <b>last week<\/b> = semana passada. As duas vão no fim da frase.<\/p><p>Som: <b>went<\/b> = /uênt/ · <b>saw<\/b> = /só/, como o só português · <b>was<\/b> = /uóz/ · <b>had<\/b> = /réd/, com um r fraco no começo.<\/p>"}, {"tipo": "leitura", "titulo": "Yesterday was busy", "texto": "Yesterday was a busy day. I went to the office. I saw Anna there. We had a meeting at nine. I did the report. Then I went home. Last week I was at home. I work remotely, but yesterday I went to the office.", "glossario": [["Yesterday", "ontem"], ["busy", "cheio, ocupado"], ["I went", "eu fui"], ["I saw", "eu vi"], ["We had", "nós tivemos"], ["I did", "eu fiz"], ["at home", "em casa"]]}, {"tipo": "escolha", "pergunta": "Ouça: quando ele foi ao escritório?", "opcoes": ["Ontem", "Semana passada", "Hoje"], "certa": 0, "explica": "yesterday é ontem, e went já marca o passado.", "audio": "I went to the office yesterday."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele fez?", "opcoes": ["Fez o relatório", "Viu o relatório", "Enviou o relatório"], "certa": 0, "explica": "did é o passado de do: fez o relatório.", "audio": "I did the report."}, {"tipo": "escolha", "pergunta": "Yesterday I ___ to the office.", "opcoes": ["went", "go", "goes"], "certa": 0, "explica": "yesterday pede passado, e o passado de go é went."}, {"tipo": "escolha", "pergunta": "Last week I ___ at home.", "opcoes": ["was", "were", "am"], "certa": 0, "explica": "Com I, o passado de be é was; e last week já diz que é passado."}, {"tipo": "montar", "pergunta": "Eu tive uma reunião ontem.", "resposta": "I had a meeting yesterday", "extras": ["have", "go", "was"]}, {"tipo": "montar", "pergunta": "Eu vi a Anna ontem.", "resposta": "I saw Anna yesterday", "extras": ["see", "went", "do"]}, {"tipo": "pares", "pergunta": "Ligue o inglês ao português", "pares": [["went", "fui, foi"], ["saw", "vi, viu"], ["had", "tive, teve"], ["did", "fiz, fez"], ["was", "estava, era"], ["yesterday", "ontem"]]}, {"tipo": "ouvir", "texto": "I went to the office yesterday."}, {"tipo": "falar", "texto": "Yesterday I went to the office. I had a meeting.", "traducao": "Ontem eu fui ao escritório. Eu tive uma reunião."}], "semana": 4}, {"id": "RO-27", "titulo": "Revisão da semana 4", "missao": "Fora do app: sem olhar, diga em voz alta as cinco frases da semana 4 — trabalho, reunião, e-mail, small talk e passado. O que travar, volte à lição dele.", "itens": [{"tipo": "dica", "rotulo": "Lição 27 · 1/2", "titulo": "O que você já tem", "html": "<p>A semana 4 fechou a sua vida de trabalho. Cinco situações:<\/p><table><tr><td>Trabalho<\/td><td>I work as a lawyer. I work remotely.<\/td><\/tr><tr><td>Reunião<\/td><td>Can you speak slower, please? Let me check and get back to you.<\/td><\/tr><tr><td>E-mail<\/td><td>Thanks for your message. Best regards.<\/td><\/tr><tr><td>Small talk<\/td><td>How's it going? Have a good one!<\/td><\/tr><tr><td>Passado<\/td><td>I went. I saw. I had. I did. I was.<\/td><\/tr><\/table><p>Se você disser essas e nada mais, você já trabalha em inglês.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 27 · 2/2", "titulo": "Duas confusões para separar de vez", "html": "<p><b>1. work as / work for.<\/b> <span class='ex'>I work as a lawyer.<\/span> é a profissão · <span class='ex'>I work for a law firm.<\/span> é a empresa.<\/p><p><b>2. was / went.<\/b> <span class='ex'>I was at home.<\/span> é onde você estava · <span class='ex'>I went home.<\/span> é para onde você foi. Em inglês, <b>go home<\/b> não leva <i>to<\/i>.<\/p><p>A regra do passado continua uma só: verbo no passado com <b>yesterday<\/b> ou <b>last week<\/b> na frase.<\/p><p>Pronúncia para conferir em voz alta: <span class='ex'>I work remotely.<\/span> <span class='ex'>Have a good one.<\/span> <span class='ex'>I went home.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "Monday, 9 a.m.", "texto": "Hi, Anna. Good morning. — Morning, Rodolfo! How's it going? — Good, thanks. And you? — Not bad. How was your weekend? — Good. I was at home. I saw my kids. — Nice. Are you free today? — Yes, after lunch. — Great. Can you send the report? — One minute, please. Let me check. … OK, I'll send it today. — Thanks a lot! — No problem. Have a good one!", "glossario": [["Good morning", "Bom dia"], ["after lunch", "depois do almoço"], ["my kids", "minhas filhas"], ["Are you free?", "Você está livre?"], ["One minute, please", "Um minuto, por favor"], ["I'll send it", "vou enviar"], ["No problem", "Sem problema"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele fez no fim de semana?", "opcoes": ["Ficou em casa com as filhas", "Foi ao escritório", "Viajou"], "certa": 0, "explica": "was at home e saw my kids: ficou em casa e viu as filhas.", "audio": "I was at home. I saw my kids."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele vai fazer?", "opcoes": ["Enviar o relatório hoje", "Conferir o relatório", "Ler o relatório"], "certa": 0, "explica": "I'll send it today é a promessa de enviar hoje.", "audio": "I'll send it today."}, {"tipo": "escolha", "pergunta": "I work ___ a law firm.", "opcoes": ["for", "as", "with"], "certa": 0, "explica": "Empresa pede for; as é para a profissão."}, {"tipo": "escolha", "pergunta": "I ___ at home last week.", "opcoes": ["was", "went", "were"], "certa": 0, "explica": "Estar em casa é was at home; went é ir."}, {"tipo": "montar", "pergunta": "Como foi seu fim de semana?", "resposta": "How was your weekend", "extras": ["is", "do", "my"]}, {"tipo": "montar", "pergunta": "Eu estava em casa ontem.", "resposta": "I was at home yesterday", "extras": ["went", "am", "in"]}, {"tipo": "pares", "pergunta": "Ligue o inglês ao português", "pares": [["How's it going?", "Como vai?"], ["get back to you", "te retorno"], ["Best regards", "Atenciosamente"], ["went", "fui, foi"], ["yesterday", "ontem"], ["Last week", "Semana passada"]]}, {"tipo": "ouvir", "texto": "I had a meeting yesterday."}, {"tipo": "falar", "texto": "Good morning. How's it going? Have a good one!", "traducao": "Bom dia. Como vai? Tenha um bom dia!"}], "semana": 4}, {"id": "RO-28", "titulo": "Checkpoint do bloco: as 10 frases de sobrevivência", "missao": "Fora do app: grave um áudio de 90 segundos com as 10 frases em sequência, sem ler. Guarde e compare com o áudio de daqui a 30 dias.", "itens": [{"tipo": "dica", "rotulo": "Lição 28 · 1/2", "titulo": "As 10 frases — de cor", "html": "<p>Estas dez são o seu kit. Não são para ler: são para sair da boca sem pensar.<\/p><table><tr><td>1<\/td><td>Hello, my name is Rodolfo.<\/td><td>apresentar-se<\/td><\/tr><tr><td>2<\/td><td>Nice to meet you.<\/td><td>conhecer alguém<\/td><\/tr><tr><td>3<\/td><td>I don't understand.<\/td><td>não entendeu<\/td><\/tr><tr><td>4<\/td><td>Can you repeat that, please?<\/td><td>pedir repetição<\/td><\/tr><tr><t
