<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Inglês do Rodolfo</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#e6e1d6;--acc:#0f766e;--acc2:#5eead4;
--ok:#2f9e5b;--okbg:#e7f6ec;--err:#d64545;--errbg:#fdeaea;--tile:#fff;--sh:0 2px 0 var(--line)}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eef0f4;--mut:#9aa3b2;--line:#2c3340;
--okbg:#163323;--errbg:#3a1b1b;--tile:#222835}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px 0}
.wrap{padding:0 0 40px}
header.topo{padding:16px 0 6px;display:flex;align-items:center;gap:12px}
header.topo .nome{font-weight:800;letter-spacing:.01em}
header.topo .volta{margin-left:auto;border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
.tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
h1{font-size:26px;line-height:1.25;margin:6px 0 10px}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:17px;margin:18px 0 6px}
p{margin:0 0 12px}
.lead{font-size:18px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);margin:0 0 14px}
.card b{color:var(--acc)}
.grid{display:grid;gap:12px}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
.kv{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);min-width:96px}
.kv .v{font-weight:600}
ul.lista{margin:0 0 12px;padding-left:20px}
ul.lista li{margin:5px 0}
table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0 12px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border-top:0}
.ex{color:var(--mut);font-style:italic}
.prog{display:flex;align-items:center;gap:12px;margin:8px 0 2px}
.anel{--p:0;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
 background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);position:relative}
.anel::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.anel span{position:relative;z-index:1;font-weight:800;font-size:14px}
.semana{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
.semana h2{margin:0;font-size:18px}
.semana .n{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.licao{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
 border-bottom-width:3px;border-radius:16px;padding:13px 14px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer}
.licao:active{transform:translateY(1px)}
.licao .bol{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;
 background:color-mix(in srgb,var(--acc) 12%,var(--tile));color:var(--acc)}
.licao.feita .bol{background:var(--okbg);color:var(--ok)}
.licao .t{font-weight:700;line-height:1.3;display:block}
.licao .s{font-size:13px;color:var(--mut);margin-top:2px;display:block}
.licao.feita .t{text-decoration:none}
.licoes{margin:0}
.aviso{border:1px solid color-mix(in srgb,var(--err) 45%,var(--line));background:var(--errbg);color:var(--err);border-radius:14px;padding:12px 14px;font-size:15px;margin:0 0 14px}
@media(min-width:900px){
 .app{max-width:780px}
 .licoes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
 .licao{margin-bottom:0;height:100%}
 h1{font-size:30px}
 .lead{font-size:19px}
 td,th{padding:9px 8px}
}
footer.rodape{margin:30px 0 10px;font-size:13px;color:var(--mut);text-align:center}
/* player */
header.pl{display:flex;align-items:center;gap:12px;padding:14px 0 8px}
.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.xp{font-weight:700;color:var(--acc);min-width:58px;text-align:right}
main#main{flex:1;padding:12px 0 24px}
.dica{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;box-shadow:var(--sh)}
.dica p,.dica li{margin:0 0 10px}.dica b{color:var(--acc)}
.dica table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:15px}
.dica td{padding:7px 6px;border-top:1px solid var(--line)}.dica td:first-child{font-weight:600}
.opts{display:grid;gap:10px}
.opt,.tile,.pair{background:var(--tile);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;
font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .05s}
.opt:active,.tile:active,.pair:active{transform:translateY(2px)}
.opt.sel,.pair.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--tile))}
.pair.done{opacity:.35;pointer-events:none;border-color:var(--ok)}
.pair.bad{border-color:var(--err);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.frase{font-size:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.som{border:0;background:var(--acc);color:#fff;border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer;flex:none}
.som.lento{background:var(--acc2);font-size:15px}
.linha{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:18px}
.banco{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 13px}.tile.usado{visibility:hidden}
textarea{width:100%;min-height:96px;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--tile);color:var(--ink);resize:vertical}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pares div{display:grid;gap:10px;align-content:start}
.mic{display:block;margin:18px auto;width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--acc) 25%,transparent)}}
.ouvi{text-align:center;color:var(--mut);min-height:24px}
footer#foot{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));margin:0 -16px;background:var(--bg);border-top:1px solid var(--line)}
footer#foot.ok{background:var(--okbg);border-color:transparent}footer#foot.err{background:var(--errbg);border-color:transparent}
.fb{display:none;margin-bottom:12px}.fb b{font-size:18px}.fb p{margin:4px 0 0;font-size:15px}
footer#foot.ok .fb,footer#foot.err .fb{display:block}footer#foot.ok .fb b{color:var(--ok)}footer#foot.err .fb b{color:var(--err)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:700 17px/1 inherit;letter-spacing:.04em;text-transform:uppercase;color:#fff;
background:var(--acc);box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 60%,#000);cursor:pointer}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default}
footer#foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 #1f6e3f}footer#foot.err .btn{background:var(--err);box-shadow:0 4px 0 #9b2c2c}
.sec{background:none;border:0;color:var(--mut);width:100%;margin-top:10px;font:inherit;cursor:pointer;text-decoration:underline}
.fim{text-align:center;padding-top:12px}.fim .big{font-size:64px;margin:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px}
.stats b{display:block;font-size:24px;color:var(--acc)}.stats span{font-size:13px;color:var(--mut)}
.erros{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15px}
.erros li{margin:6px 0}
.missao{text-align:left;background:color-mix(in srgb,var(--acc) 8%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:16px;padding:14px 16px;margin-top:16px;font-size:15px}
#semjs{padding:30px;text-align:center}
[hidden]{display:none!important}
</style></head><body>
<div id="semjs">Abra este arquivo no navegador (Safari ou Chrome) para fazer as lições.</div>
<div class="app" id="app" hidden>
  <div id="home" class="wrap"></div>
  <div id="player" hidden>
    <header class="pl"><button class="x" id="sair" aria-label="Voltar">✕</button><div class="bar"><i id="prog"></i></div><div class="xp" id="xp">0 XP</div></header>
    <main id="main"></main>
    <footer id="foot">
      <div class="fb" id="fb"></div>
      <button class="btn" id="go" disabled>Verificar</button>
      <button class="sec" id="pular" hidden>Não posso falar agora</button>
    </footer>
  </div>
</div>
<script>
const CURSO = {"aluno": {"nome": "Rodolfo", "subtitulo": "Plano de inglês · 12 semanas", "voz": "en-US", "chave": "rodolfo", "assinatura": "Santana Melo · outubro de 2026"}, "plano": {"titulo": "Poucas frases, muita vida", "lead": "Você marcou que depende da Bruna ou do tradutor para quase tudo. A saída não é estudar inglês como se estuda matéria: é decorar poucas frases que resolvem muita coisa e usá-las na mesma semana em que aprende. Quinze minutos por dia, com lembrete, valem mais que duas horas de domingo.", "secoes": [{"titulo": "Onde você está hoje", "html": "\n<table>\n<tr><th>O que você respondeu<\/th><th>O que isso significa<\/th><\/tr>\n<tr><td>Estudou inglês só na escola<\/td><td>Você tem base de leitura e quase nenhuma de fala — e isso é normal para quem aprendeu inglês de prova.<\/td><\/tr>\n<tr><td>Consegue cumprimentar, dizer o nome, pedir comida, entender preço e ler placa<\/td><td>Isso não é pouco: é o <b>nível de sobrevivência<\/b>, e é dele que o curso parte.<\/td><\/tr>\n<tr><td>“Pego algumas palavras soltas”<\/td><td>O ouvido ainda não separa as palavras dentro da frase. O curso trabalha isso desde a primeira lição.<\/td><\/tr>\n<tr><td>Depende da Bruna ou do tradutor para quase tudo<\/td><td>É o que o plano ataca: cada lição tira uma situação da lista de dependências.<\/td><\/tr>\n<tr><td>“Esqueço de fazer” é o que mais te faz desistir<\/td><td>O plano é desenhado em cima disso: lição curta, horário fixo e alarme.<\/td><\/tr>\n<tr><td>1 hora ou mais por dia, à noite<\/td><td>Você tem tempo de sobra. O problema nunca foi tempo — foi começar.<\/td><\/tr>\n<\/table>"}, {"titulo": "A tese do plano", "html": "\n<p>Você não vai aprender inglês inteiro em três meses, e não precisa. Precisa de <b>poucas frases que abrem muita porta<\/b>:<\/p>\n<ul class=\"lista\">\n<li><span class=\"ex\">I don't understand. Can you repeat that, please?<\/span> — resolve a vergonha de não entender.<\/li>\n<li><span class=\"ex\">How much is it?<\/span> — resolve o mercado, a loja, o drive-thru.<\/li>\n<li><span class=\"ex\">I'd like this one, please.<\/span> — resolve o pedido.<\/li>\n<li><span class=\"ex\">I have an appointment.<\/span> — resolve o guichê.<\/li>\n<li><span class=\"ex\">Sorry, my English is not good. Slowly, please.<\/span> — desarma qualquer pressa do outro.<\/li>\n<\/ul>\n<p>Cada lição entrega de 5 a 7 frases assim e uma situação real. A repetição é o método: as mesmas frases voltam em contextos novos, e a missão do dia obriga você a usá-las fora do app.<\/p>"}, {"titulo": "Sua hora da noite", "html": "\n<table>\n<tr><th>Momento<\/th><th>Tempo<\/th><th>O que fazer<\/th><\/tr>\n<tr><td><b>21h<\/b>, depois que elas dormem<\/td><td>15 a 20 min<\/td><td>A lição do dia no app. É curta de propósito: cansado, você aprende menos, e a lição foi cortada para caber.<\/td><\/tr>\n<tr><td>Na sequência, ainda sentado<\/td><td>10 min<\/td><td>Ler em voz alta as frases do dia — para a Bruna ou para a IA por voz, que corrige no fim.<\/td><\/tr>\n<tr><td>No <b>carro<\/b> ou na <b>academia<\/b><\/td><td>15 min<\/td><td>Ouvir o áudio da lição de ontem. Sem tela, sem legenda.<\/td><\/tr>\n<tr><td><b>Fim de semana<\/b><\/td><td>30 min<\/td><td>A lição de revisão atrasada e as notícias em inglês simples.<\/td><\/tr>\n<\/table>\n<p><b>O alarme é parte do método.<\/b> Às 21h, com o nome da lição na tela do celular. Você mesmo disse que o que te faz desistir é esquecer — então o plano não confia na memória.<\/p>"}, {"titulo": "As quatro semanas", "html": "\n<table>\n<tr><th>Semana<\/th><th>Foco<\/th><th>O que você já resolve sozinho no fim dela<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>As palavras que resolvem<\/td><td>Apresentar-se, pedir por favor, entender preço, pedir para repetir, comprar no mercado e pedir comida.<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>Na rua e no carro<\/td><td>Pedir direção, abastecer, falar horas e dias, guichê do DMV, telefonema simples, manchete de notícia.<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td>Saúde, casa e escola<\/td><td>Dizer o que sente na farmácia, abrir conta, pedir conserto em casa, apresentar-se como pai na escola, emergência e vizinho.<\/td><\/tr>\n<tr><td><b>4<\/b><\/td><td>Trabalho e conversa<\/td><td>Falar do seu trabalho, pedir para falarem devagar numa reunião, escrever e-mail curto, small talk e contar o que fez ontem.<\/td><\/tr>\n<\/table>"}, {"titulo": "O que ouvir fora do app", "html": "\n<ul class=\"lista\">\n<li><b>VOA Learning English<\/b> — notícia em inglês lento e claro. É o que você gosta (notícias) no formato que você consegue acompanhar agora.<\/li>\n<li><b>Duolingo<\/b> — só como aquecimento de 5 minutos antes da lição, nunca como curso. Ele ensina a reconhecer; não ensina a falar.<\/li>\n<li><b>Celular em inglês<\/b> — mude o idioma do sistema por quatro semanas. É imersão de graça em vocabulário que você já conhece.<\/li>\n<\/ul>"}, {"titulo": "Professor: a partir da semana 5", "html": "\n<p>Uma aula de 50 minutos por semana, a partir da semana 5, quando você já tiver as frases de sobrevivência na boca:<\/p>\n<ul class=\"lista\">\n<li><b>Critério:<\/b> professor que fale devagar e aceite conduzir por situação (pedir, perguntar, responder), não por livro.<\/li>\n<li><b>O que levar:<\/b> as frases que você errou no app na semana.<\/li>\n<li><b>Onde:<\/b> plataformas de aula particular (iTalki, Preply); confira a faixa de preço na própria plataforma.<\/li>\n<\/ul>\n<p>Enquanto não começar, a IA por voz cumpre o papel: peça a ela para simular o mercado, o guichê e a escola, falando devagar.<\/p>"}, {"titulo": "Como você sabe que está funcionando", "html": "\n<ul class=\"lista\">\n<li><b>Semana 2:<\/b> você pede um café sozinho, sem tradutor.<\/li>\n<li><b>Semana 3:<\/b> você resolve uma coisa na farmácia ou na escola sem chamar a Bruna.<\/li>\n<li><b>Semana 4 (checkpoint):<\/b> diga de cor as dez frases de sobrevivência do curso.<\/li>\n<li><b>Meta de 3 meses:<\/b> resolver sozinho mercado, restaurante, posto e escola — e pedir para repetir sem vergonha quando não entender.<\/li>\n<\/ul>"}, {"titulo": "Quando atrasar", "html": "\n<ul class=\"lista\">\n<li><b>Cinco minutos contam.<\/b> Abriu o app, fez três exercícios, fechou: o dia está salvo.<\/li>\n<li><b>A lição não se acumula:<\/b> siga pelo dia do calendário; a atrasada fica para o fim de semana.<\/li>\n<li><b>Nunca dois dias seguidos sem abrir.<\/b> É assim que o inglês de escola se perdeu da primeira vez.<\/li>\n<\/ul>"}]}, "semanas": [{"titulo": "As palavras que resolvem", "foco": "Apresentar-se, pedir, agradecer, preço e mercado."}, {"titulo": "Na rua e no carro", "foco": "Direção, posto, horas, documentos, telefone e notícia."}, {"titulo": "Saúde, casa e escola", "foco": "Farmácia, banco, conserto, escola das meninas, emergência e vizinho."}, {"titulo": "Trabalho e conversa", "foco": "Trabalho, reunião, e-mail, small talk, passado e checkpoint."}], "licoes": [{"id": "RO-01", "titulo": "Hello, I'm… e I'm from Brazil", "missao": "Antes de dormir, diga três vezes em voz alta para a Bruna: \"Hi, I'm Rodolfo. I'm from Brazil. Nice to meet you.\"", "itens": [{"tipo": "dica", "rotulo": "Lição 1 · 1/2", "titulo": "As cinco frases que abrem qualquer porta", "html": "<table><tr><td>Hello.<\/td><td>Oi.<\/td><\/tr><tr><td>My name is Rodolfo.<\/td><td>Meu nome é Rodolfo.<\/td><\/tr><tr><td>I'm Rodolfo.<\/td><td>Eu sou o Rodolfo.<\/td><\/tr><tr><td>I'm from Brazil.<\/td><td>Eu sou do Brasil.<\/td><\/tr><tr><td>Nice to meet you.<\/td><td>Prazer em conhecer você.<\/td><\/tr><\/table><p><b>My name is<\/b> é mais devagar e mais formal. <b>I'm<\/b> é o do dia a dia: <span class='ex'>I'm Rodolfo<\/span>.<\/p><p>Som de <b>I'm<\/b>: /aɪm/ — soa <i>áim<\/i>. Em <span class='ex'>I'm from Brazil<\/span> sai quase <i>áim frôm<\/i>. Ouça duas vezes antes de repetir.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 1 · 2/2", "titulo": "De onde você é, e quem é a Bruna", "html": "<p>Para dizer de onde você é, use sempre o mesmo molde: <b>I'm from…<\/b><\/p><table><tr><td>I'm from Brazil.<\/td><td>Eu sou do Brasil.<\/td><\/tr><tr><td>Are you from Brazil?<\/td><td>Você é do Brasil?<\/td><\/tr><tr><td>Where are you from?<\/td><td>De onde você é?<\/td><\/tr><\/table><p>Para responder ao cumprimento, acrescente <b>too<\/b> no fim: <span class='ex'>Nice to meet you too.<\/span><\/p><p>Para apresentar a Bruna, use <b>This is my wife.<\/b> — e não <i>She is my wife<\/i>, que soa como se ela estivesse longe.<\/p><p>Ouça primeiro sem ler. Se não pegar, toque na tartaruga 🐢.<\/p>"}, {"tipo": "leitura", "titulo": "At the school door", "texto": "Hi, I'm Rodolfo. — Hello, Rodolfo. I'm Karen. — Nice to meet you. — Nice to meet you too. Are you from Brazil? — Yes, I'm from Brazil. This is my wife, Bruna. — Hi, Bruna. Welcome! — Thank you.", "glossario": [["Nice to meet you.", "Prazer em conhecer você."], ["Nice to meet you too.", "O prazer é meu."], ["wife", "esposa"], ["Welcome!", "Bem-vindo(a)!"], ["Are you from…?", "Você é de…?"], ["This is…", "Este é…, esta é…"], ["Yes", "Sim"]]}, {"tipo": "escolha", "pergunta": "Ouça: de onde ele é?", "opcoes": ["Do Brasil", "Dos Estados Unidos", "Do Canadá"], "certa": 0, "explica": "A frase é I'm from Brazil: o que vem depois de from é o lugar de origem.", "audio": "I'm from Brazil."}, {"tipo": "escolha", "pergunta": "Ouça: quem é a esposa?", "opcoes": ["Bruna", "Karen", "Ana"], "certa": 0, "explica": "This is my wife, Bruna: o nome vem logo depois de wife.", "audio": "This is my wife, Bruna."}, {"tipo": "escolha", "pergunta": "___ name is Rodolfo.", "opcoes": ["My", "I", "Me"], "certa": 0, "explica": "Quem tem nome é my (meu). I só entra com verbo: I'm."}, {"tipo": "escolha", "pergunta": "Eu sou do Brasil. → I ___ from Brazil.", "opcoes": ["'m", "'s", "'re"], "certa": 0, "explica": "I anda sempre com am, que na fala vira 'm: I'm."}, {"tipo": "montar", "pergunta": "Meu nome é Rodolfo.", "resposta": "My name is Rodolfo", "extras": ["your", "am", "Hi"]}, {"tipo": "montar", "pergunta": "Prazer em conhecer você.", "resposta": "Nice to meet you", "extras": ["too", "thank", "my"]}, {"tipo": "pares", "pergunta": "Ligue cada frase ao sentido", "pares": [["Hello.", "Oi."], ["Nice to meet you.", "Prazer em conhecer você."], ["I'm from Brazil.", "Eu sou do Brasil."], ["my wife", "minha esposa"], ["Welcome!", "Bem-vindo!"]]}, {"tipo": "ouvir", "texto": "I'm from Brazil."}, {"tipo": "falar", "texto": "Hi, I'm Rodolfo. I'm from Brazil. Nice to meet you.", "traducao": "Oi, eu sou o Rodolfo. Sou do Brasil. Prazer em conhecer você."}], "semana": 1}, {"id": "RO-02", "titulo": "Please, thank you, sorry", "missao": "Hoje, na primeira vez que alguém falar inglês com você, responda \"Sorry, I don't understand\" em vez de ficar calado — uma vez só.", "itens": [{"tipo": "dica", "rotulo": "Lição 2 · 1/2", "titulo": "As palavras que abrem porta", "html": "<table><tr><td>Please.<\/td><td>Por favor.<\/td><\/tr><tr><td>Thank you.<\/td><td>Obrigado.<\/td><\/tr><tr><td>You're welcome.<\/td><td>De nada.<\/td><\/tr><tr><td>Sorry.<\/td><td>Desculpe.<\/td><\/tr><tr><td>Excuse me.<\/td><td>Com licença.<\/td><\/tr><tr><td>I don't understand.<\/td><td>Eu não entendo.<\/td><\/tr><\/table><p>Seis palavras e você já não fica travado no meio de uma frase.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 2 · 2/2", "titulo": "Sorry ou excuse me?", "html": "<p><b>Sorry<\/b> é para o seu erro: você esbarra, chega atrasado, não entendeu. <b>Excuse me<\/b> é para chamar a atenção ou passar no meio das pessoas.<\/p><table><tr><td>Sorry, I don't understand.<\/td><td>Desculpe, eu não entendo.<\/td><\/tr><tr><td>Excuse me, sir.<\/td><td>Com licença, senhor.<\/td><\/tr><tr><td>Excuse me, please.<\/td><td>Com licença, por favor.<\/td><\/tr><\/table><p>Som de <b>Excuse me<\/b>: /ɪkˈskjuːz mi/ — soa <i>isquiús mi<\/i>.<\/p><p><b>Thank you<\/b> soa <i>thénk iu<\/i>, com a ponta da língua entre os dentes no começo. Treine <span class='ex'>thank you<\/span> e <span class='ex'>thanks<\/span>.<\/p>"}, {"tipo": "leitura", "titulo": "At the coffee shop", "texto": "Excuse me. — Yes? — Coffee, please. — Small or large? — Small, please. — Two dollars. — Here you are. Thank you. — You're welcome. — Sorry, I don't understand. — Small coffee. One sugar. — OK. Thank you!", "glossario": [["Excuse me.", "Com licença."], ["small", "pequeno"], ["large", "grande"], ["Here you are.", "Aqui está."], ["You're welcome.", "De nada."], ["Sorry, I don't understand.", "Desculpe, eu não entendo."], ["sugar", "açúcar"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele pede?", "opcoes": ["Um café", "Uma água", "Um leite"], "certa": 0, "explica": "Coffee é café; o please no fim só deixa o pedido educado.", "audio": "A coffee, please."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele está dizendo?", "opcoes": ["Que não entendeu", "Que está com pressa", "Que quer pagar"], "certa": 0, "explica": "I don't understand é a frase de quem não entendeu.", "audio": "Sorry, I don't understand."}, {"tipo": "escolha", "pergunta": "Coffee, ___.", "opcoes": ["please", "thanks", "sorry"], "certa": 0, "explica": "O please fecha o pedido; thank you vem só depois de receber."}, {"tipo": "escolha", "pergunta": "Você esbarra em alguém sem querer. Você diz: ___", "opcoes": ["Sorry.", "Please.", "Thank you."], "certa": 0, "explica": "Erro seu pede sorry; excuse me é para chamar atenção."}, {"tipo": "montar", "pergunta": "Um café, por favor.", "resposta": "A coffee please", "extras": ["thank", "sorry", "you"]}, {"tipo": "montar", "pergunta": "Desculpe, eu não entendo.", "resposta": "Sorry, I don't understand", "extras": ["please", "not", "you"]}, {"tipo": "pares", "pergunta": "Ligue a palavra ao sentido", "pares": [["Please.", "Por favor."], ["Thank you.", "Obrigado."], ["You're welcome.", "De nada."], ["Sorry.", "Desculpe."], ["Excuse me.", "Com licença."]]}, {"tipo": "ouvir", "texto": "Sorry, I don't understand."}, {"tipo": "falar", "texto": "Excuse me. A coffee, please. Sorry, I don't understand.", "traducao": "Com licença. Um café, por favor. Desculpe, eu não entendo."}], "semana": 1}, {"id": "RO-03", "titulo": "Números, preços e How much is it?", "missao": "Na próxima compra, olhe três preços e diga cada um em voz alta em inglês antes de pagar.", "itens": [{"tipo": "dica", "rotulo": "Lição 3 · 1/2", "titulo": "De 1 a 20", "html": "<table><tr><td>1 one<\/td><td>2 two<\/td><td>3 three<\/td><td>4 four<\/td><td>5 five<\/td><\/tr><tr><td>6 six<\/td><td>7 seven<\/td><td>8 eight<\/td><td>9 nine<\/td><td>10 ten<\/td><\/tr><\/table><table><tr><td>11 eleven<\/td><td>12 twelve<\/td><td>13 thirteen<\/td><td>14 fourteen<\/td><td>15 fifteen<\/td><\/tr><tr><td>16 sixteen<\/td><td>17 seventeen<\/td><td>18 eighteen<\/td><td>19 nineteen<\/td><td>20 twenty<\/td><\/tr><\/table><p>De 13 a 19, tudo termina em <b>-teen<\/b>. Cuidado com <b>thirteen<\/b> (13) e <b>thirty<\/b> (30): no 13 a força vai no fim.<\/p><p><b>three<\/b> soa <i>ssrí<\/i>, com a língua entre os dentes. Treine <span class='ex'>three<\/span> e <span class='ex'>thirteen<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 3 · 2/2", "titulo": "Preço: sempre How much", "html": "<table><tr><td>How much is it?<\/td><td>Quanto custa?<\/td><\/tr><tr><td>It's five dollars.<\/td><td>É cinco dólares.<\/td><\/tr><tr><td>It's twelve fifty.<\/td><td>É doze e cinquenta.<\/td><\/tr><tr><td>Two, please.<\/td><td>Dois, por favor.<\/td><\/tr><\/table><p>Em preço, os americanos dizem o dólar e depois os centavos: <span class='ex'>$12.50<\/span> sai como <span class='ex'>twelve fifty<\/span>.<\/p><p>Dinheiro é sempre <b>How much<\/b>. <i>How many<\/i> é para contar coisas: <span class='ex'>How many bags?<\/span><\/p>"}, {"tipo": "leitura", "titulo": "At the little store", "texto": "How much is it? — Five dollars. — And this one? — Twelve dollars. — OK. Two, please. — Seventeen dollars. — Here you are. — Thank you. Have a good day.", "glossario": [["How much is it?", "Quanto custa?"], ["dollar", "dólar"], ["this one", "este, essa"], ["And this one?", "E este?"], ["Two, please.", "Dois, por favor."], ["Here you are.", "Aqui está."], ["Have a good day.", "Tenha um bom dia."]]}, {"tipo": "escolha", "pergunta": "Ouça: quanto custa?", "opcoes": ["Cinco dólares", "Nove dólares", "Quinze dólares"], "certa": 0, "explica": "Five é cinco; dollars é dólares.", "audio": "It's five dollars."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele pergunta?", "opcoes": ["Quanto custa", "Onde fica", "Que horas são"], "certa": 0, "explica": "How much is it é a pergunta de preço.", "audio": "How much is it?"}, {"tipo": "escolha", "pergunta": "___ much is it?", "opcoes": ["How", "What", "Where"], "certa": 0, "explica": "Preço é sempre com How much."}, {"tipo": "escolha", "pergunta": "\"Treze\" em inglês é ___.", "opcoes": ["thirteen", "thirty", "thirdteen"], "certa": 0, "explica": "Thirteen é 13; thirty é 30."}, {"tipo": "montar", "pergunta": "Quanto custa?", "resposta": "How much is it", "extras": ["What", "are", "dollars"]}, {"tipo": "montar", "pergunta": "São cinco dólares.", "resposta": "It's five dollars", "extras": ["are", "much", "How"]}, {"tipo": "pares", "pergunta": "Ligue número e preço", "pares": [["five", "cinco"], ["seven", "sete"], ["twelve", "doze"], ["twenty", "vinte"], ["How much is it?", "Quanto custa?"], ["It's five dollars.", "São cinco dólares."]]}, {"tipo": "ouvir", "texto": "It's twelve dollars."}, {"tipo": "falar", "texto": "How much is it? It's five dollars.", "traducao": "Quanto custa? São cinco dólares."}], "semana": 1}, {"id": "RO-04", "titulo": "Can you repeat that, please?", "missao": "Amanhã, na primeira vez que alguém falar rápido com você, diga \"Can you repeat that, please?\" e depois \"Slowly, please.\" — só isso.", "itens": [{"tipo": "dica", "rotulo": "Lição 4 · 1/2", "titulo": "As frases que salvam a conversa", "html": "<table><tr><td>Can you repeat that, please?<\/td><td>Pode repetir, por favor?<\/td><\/tr><tr><td>Slowly, please.<\/td><td>Mais devagar, por favor.<\/td><\/tr><tr><td>I'm learning English.<\/td><td>Estou aprendendo inglês.<\/td><\/tr><tr><td>One more time, please.<\/td><td>Mais uma vez, por favor.<\/td><\/tr><\/table><p>Som de <b>repeat<\/b>: /rɪˈpiːt/ — soa <i>ripít<\/i>. Na fala rápida, <span class='ex'>Can you repeat that?<\/span> sai quase <i>cân iu ripít déte<\/i>.<\/p><p>Não é vergonha repetir. É a frase que mais vai te salvar nos primeiros meses.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 4 · 2/2", "titulo": "O molde do pedido educado", "html": "<p>Todo pedido educado tem a mesma forma: <b>Can you<\/b> + verbo + <b>please<\/b>.<\/p><table><tr><td>Can you repeat that?<\/td><td>Pode repetir?<\/td><\/tr><tr><td>Can you speak slowly?<\/td><td>Pode falar devagar?<\/td><\/tr><tr><td>Can you help me?<\/td><td>Pode me ajudar?<\/td><\/tr><\/table><p>Depois de <b>can<\/b>, o verbo fica na forma simples: <span class='ex'>Can you repeat<\/span>, nunca <i>repeats<\/i>.<\/p><p>E avise cedo que está aprendendo: <span class='ex'>Sorry, I'm learning English.<\/span> Quase todo mundo passa a falar mais devagar.<\/p>"}, {"tipo": "leitura", "titulo": "At the school office", "texto": "Excuse me. Can you repeat that, please? — Sure. Room twelve. — Slowly, please. — Room twelve. — Thank you. Sorry, I'm learning English. — No problem. — One more time, please. — Room twelve.", "glossario": [["Can you repeat that?", "Pode repetir isso?"], ["Sure.", "Claro."], ["room", "sala"], ["slowly", "devagar"], ["I'm learning English.", "Estou aprendendo inglês."], ["No problem.", "Sem problema."], ["One more time.", "Mais uma vez."]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele pede?", "opcoes": ["Para repetir", "Para pagar", "Para sair"], "certa": 0, "explica": "Repeat é repetir; o please só amacia o pedido.", "audio": "Can you repeat that, please?"}, {"tipo": "escolha", "pergunta": "Ouça: como ele quer que a pessoa fale?", "opcoes": ["Mais devagar", "Mais alto", "Mais rápido"], "certa": 0, "explica": "Slowly quer dizer devagar.", "audio": "Can you speak slowly, please?"}, {"tipo": "escolha", "pergunta": "Can you ___ that, please?", "opcoes": ["repeat", "repeats", "repeating"], "certa": 0, "explica": "Depois de can, o verbo fica simples: repeat."}, {"tipo": "escolha", "pergunta": "___ learning English.", "opcoes": ["I'm", "I", "Me"], "certa": 0, "explica": "A frase precisa do verbo: I'm learning."}, {"tipo": "montar", "pergunta": "Pode repetir, por favor?", "resposta": "Can you repeat that please", "extras": ["to", "am", "slowly"]}, {"tipo": "montar", "pergunta": "Estou aprendendo inglês.", "resposta": "I'm learning English", "extras": ["learn", "am", "you"]}, {"tipo": "pares", "pergunta": "Ligue a frase ao sentido", "pares": [["Can you repeat that?", "Pode repetir isso?"], ["Slowly, please.", "Mais devagar, por favor."], ["I'm learning English.", "Estou aprendendo inglês."], ["One more time.", "Mais uma vez."], ["No problem.", "Sem problema."]]}, {"tipo": "ouvir", "texto": "I'm learning English."}, {"tipo": "falar", "texto": "Sorry, I'm learning English. Can you repeat that, please?", "traducao": "Desculpe, estou aprendendo inglês. Pode repetir, por favor?"}], "semana": 1}, {"id": "RO-05", "titulo": "No mercado: Where is…? Do you have…?", "missao": "Na próxima ida ao mercado, ache uma coisa sozinho: pergunte \"Where is the milk?\" a um funcionário — uma pergunta só.", "itens": [{"tipo": "dica", "rotulo": "Lição 5 · 1/2", "titulo": "Achar as coisas dentro da loja", "html": "<table><tr><td>Where is the milk?<\/td><td>Onde fica o leite?<\/td><\/tr><tr><td>Where is the bathroom?<\/td><td>Onde fica o banheiro?<\/td><\/tr><tr><td>It's over there.<\/td><td>Fica ali.<\/td><\/tr><tr><td>Aisle five.<\/td><td>Corredor cinco.<\/td><\/tr><tr><td>Do you have apples?<\/td><td>Você tem maçãs?<\/td><\/tr><tr><td>Yes, we do.<\/td><td>Sim, temos.<\/td><\/tr><\/table><p>Na fala, <b>where is<\/b> vira <b>where's<\/b>: /werz/ — soa <i>uérz<\/i>. Dois exemplos: <span class='ex'>Where's the milk?<\/span> e <span class='ex'>Where's the bathroom?<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 5 · 2/2", "titulo": "Pegar e levar", "html": "<table><tr><td>This one, please.<\/td><td>Este, por favor.<\/td><\/tr><tr><td>A bag, please.<\/td><td>Uma sacola, por favor.<\/td><\/tr><tr><td>Card or cash?<\/td><td>Cartão ou dinheiro?<\/td><\/tr><tr><td>Card, please.<\/td><td>Cartão, por favor.<\/td><\/tr><tr><td>That's all, thanks.<\/td><td>É só isso, obrigado.<\/td><\/tr><\/table><p><b>This one<\/b> resolve quando você não sabe o nome da coisa: aponta e diz.<\/p><p>No caixa, o funcionário pergunta <span class='ex'>Card or cash?<\/span>. Responda em duas palavras: <span class='ex'>Card, please.<\/span><\/p><p>Se faltar palavra, junte com as da lição 4: <span class='ex'>Sorry, I'm learning English.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "At the supermarket", "texto": "Excuse me, where is the milk? — Aisle five. — Thank you. Do you have apples? — Yes. Over there. — This one, please. And a bag, please. — Two dollars. — Card, please. — Thank you. Have a good day.", "glossario": [["Where is…?", "Onde fica…?"], ["aisle", "corredor"], ["over there", "ali"], ["Do you have…?", "Você tem…?"], ["bag", "sacola"], ["card", "cartão"], ["cash", "dinheiro (em espécie)"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele procura?", "opcoes": ["Leite", "Pão", "Água"], "certa": 0, "explica": "Milk é leite; where is é onde fica.", "audio": "Where is the milk?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ele pergunta?", "opcoes": ["Se tem maçã", "Quanto custa", "Onde fica o banheiro"], "certa": 0, "explica": "Do you have é a pergunta de quem procura o produto.", "audio": "Do you have apples?"}, {"tipo": "escolha", "pergunta": "___ is the bathroom?", "opcoes": ["Where", "What", "How"], "certa": 0, "explica": "Lugar começa com Where."}, {"tipo": "escolha", "pergunta": "Do you ___ apples?", "opcoes": ["have", "has", "having"], "certa": 0, "explica": "Depois de Do you, o verbo fica simples: have."}, {"tipo": "montar", "pergunta": "Onde fica o banheiro?", "resposta": "Where is the bathroom", "extras": ["What", "are", "milk"]}, {"tipo": "montar", "pergunta": "Este, por favor.", "resposta": "This one please", "extras": ["that", "thank", "much"]}, {"tipo": "pares", "pergunta": "Ligue a frase ao sentido", "pares": [["Where is…?", "Onde fica…?"], ["Do you have…?", "Você tem…?"], ["This one, please.", "Este, por favor."], ["A bag, please.", "Uma sacola, por favor."], ["Card or cash?", "Cartão ou dinheiro?"], ["That's all, thanks.", "É só isso, obrigado."]]}, {"tipo": "ouvir", "texto": "Where is the milk?"}, {"tipo": "falar", "texto": "Excuse me, where is the milk? This one, please.", "traducao": "Com licença, onde fica o leite? Este, por favor."}], "semana": 1}, {"id": "RO-06", "titulo": "Revisão da semana 1", "missao": "Diga para a Bruna as três frases da semana que você mais vai usar e pergunte qual ela acha mais útil.", "itens": [{"tipo": "dica", "rotulo": "Lição 6 · 1/2", "titulo": "O que já é seu", "html": "<table><tr><td>Hi, I'm Rodolfo.<\/td><td>Oi, eu sou o Rodolfo.<\/td><\/tr><tr><td>I'm from Brazil.<\/td><td>Sou do Brasil.<\/td><\/tr><tr><td>Nice to meet you.<\/td><td>Prazer em conhecer você.<\/td><\/tr><tr><td>Sorry, I don't understand.<\/td><td>Desculpe, eu não entendo.<\/td><\/tr><tr><td>Can you repeat that, please?<\/td><td>Pode repetir, por favor?<\/td><\/tr><tr><td>How much is it?<\/td><td>Quanto custa?<\/td><\/tr><tr><td>Where is the milk?<\/td><td>Onde fica o leite?<\/td><\/tr><tr><td>This one, please.<\/td><td>Este, por favor.<\/td><\/tr><\/table><p>Oito frases em uma semana. Se você acertar seis, a semana valeu.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 6 · 2/2", "titulo": "As três situações da semana", "html": "<p>As frases mudam de lugar, não de forma:<\/p><table><tr><td>Na escola<\/td><td>Hi, I'm Rodolfo. Nice to meet you.<\/td><\/tr><tr><td>No mercado<\/td><td>Where is the milk? This one, please.<\/td><\/tr><tr><td>No restaurante<\/td><td>I'd like a coffee. To go, please.<\/td><\/tr><\/table><p>Se alguém falar rápido demais: <span class='ex'>Sorry, I don't understand. Can you repeat that, please?<\/span><\/p><p>A revisão não pede frase nova. Pede a mesma frase em lugar diferente.<\/p>"}, {"tipo": "leitura", "titulo": "One morning, three places", "texto": "Hi, I'm Rodolfo. I'm from Brazil. — Welcome! — Sorry, I don't understand. Can you repeat that, please? — Sure. Welcome! — Thank you. Do you have coffee? — Yes. Over there. — How much is it? — Two dollars. — A coffee, please. — For here or to go? — To go, please. — Here you are. — Thank you!", "glossario": [["Welcome!", "Bem-vindo!"], ["over there", "ali"], ["For here or to go?", "Para comer aqui ou para viagem?"], ["To go", "Para viagem"], ["Sure.", "Claro."], ["How much is it?", "Quanto custa?"], ["I'm learning English.", "Estou aprendendo inglês."]]}, {"tipo": "escolha", "pergunta": "Ouça: qual é o nome dele?", "opcoes": ["Rodolfo", "Roberto", "Rodrigo"], "certa": 0, "explica": "My name is Rodolfo: o nome vem logo depois de name is.", "audio": "Hello, my name is Rodolfo."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele vai fazer?", "opcoes": ["Levar a comida", "Comer no local", "Pagar depois"], "certa": 0, "explica": "To go é para viagem, para levar.", "audio": "To go, please."}, {"tipo": "escolha", "pergunta": "___ you have water?", "opcoes": ["Do", "Are", "Is"], "certa": 0, "explica": "Pergunta com verbo comum abre com Do: Do you have…?"}, {"tipo": "escolha", "pergunta": "Você não entendeu o que a pessoa falou. O que você diz?", "opcoes": ["Sorry, I don't understand.", "Nice to meet you.", "To go, please."], "certa": 0, "explica": "Quem não entendeu avisa: I don't understand."}, {"tipo": "montar", "pergunta": "Uma sacola, por favor.", "resposta": "A bag please", "extras": ["two", "thanks", "much"]}, {"tipo": "montar", "pergunta": "Para viagem, por favor.", "resposta": "To go please", "extras": ["here", "for", "card"]}, {"tipo": "pares", "pergunta": "Ligue a frase ao sentido", "pares": [["Nice to meet you.", "Prazer em conhecer você."], ["I don't understand.", "Eu não entendo."], ["How much is it?", "Quanto custa?"], ["This one, please.", "Este, por favor."], ["To go, please.", "Para viagem, por favor."], ["Can you repeat that?", "Pode repetir isso?"]]}, {"tipo": "ouvir", "texto": "This one, please."}, {"tipo": "falar", "texto": "A coffee, please. For here or to go? To go, please.", "traducao": "Um café, por favor. Para comer aqui ou para viagem? Para viagem, por favor."}], "semana": 1}, {"id": "RO-07", "titulo": "Restaurante: I'd like… e to go", "missao": "No próximo pedido de comida, mesmo em drive-thru, diga \"I'd like…, please\" e depois \"To go\" ou \"For here\" — sem apontar.", "itens": [{"tipo": "dica", "rotulo": "Lição 7 · 1/2", "titulo": "I'd like: o pedido educado", "html": "<table><tr><td>I'd like a coffee.<\/td><td>Eu queria um café.<\/td><\/tr><tr><td>I'd like a burger, please.<\/td><td>Eu queria um hambúrguer, por favor.<\/td><\/tr><tr><td>I'd like water.<\/td><td>Eu queria água.<\/td><\/tr><\/table><p><b>I'd like<\/b> é o jeito educado de pedir. <b>I want<\/b> também existe, mas soa seco, de criança pedindo.<\/p><p>Som de <b>I'd like<\/b>: /aɪd laɪk/ — soa <i>áid láik<\/i>. Dois exemplos: <span class='ex'>I'd like a coffee.<\/span> e <span class='ex'>I'd like water.<\/span><\/p><p>Depois de <b>like<\/b> vem direto a coisa, sem <i>to<\/i>: <span class='ex'>I'd like a burger<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 7 · 2/2", "titulo": "Aqui ou para viagem", "html": "<table><tr><td>For here or to go?<\/td><td>Para comer aqui ou para viagem?<\/td><\/tr><tr><td>For here, please.<\/td><td>Aqui, por favor.<\/td><\/tr><tr><td>To go, please.<\/td><td>Para viagem, por favor.<\/td><\/tr><tr><td>The check, please.<\/td><td>A conta, por favor.<\/td><\/tr><tr><td>No ice, please.<\/td><td>Sem gelo, por favor.<\/td><\/tr><\/table><p><b>For here or to go?<\/b> aparece em quase todo balcão americano. Duas palavras resolvem: <span class='ex'>To go.<\/span><\/p><p>No fim da refeição: <span class='ex'>The check, please.<\/span> Nos EUA o normal é <i>check<\/i>, não <i>bill<\/i>.<\/p>"}, {"tipo": "leitura", "titulo": "At the burger place", "texto": "Hi. I'd like a burger, please. — For here or to go? — To go, please. — Anything to drink? — Water, please. No ice. — Five fifty. — Card, please. — Here you are. Thank you. — Thank you. Have a good day.", "glossario": [["I'd like…", "Eu queria… (pedido educado)"], ["burger", "hambúrguer"], ["For here or to go?", "Para comer aqui ou para viagem?"], ["Anything to drink?", "Algo para beber?"], ["No ice, please.", "Sem gelo, por favor."], ["the check", "a conta"], ["Have a good day.", "Tenha um bom dia."]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele pede?", "opcoes": ["Um café", "Um hambúrguer", "Uma água"], "certa": 0, "explica": "Depois de I'd like vem a coisa: a coffee.", "audio": "I'd like a coffee, please."}, {"tipo": "escolha", "pergunta": "Ouça: o que o atendente pergunta?", "opcoes": ["Se vai comer no local ou levar", "Quanto vai pagar", "Que horas são"], "certa": 0, "explica": "For here or to go é a pergunta de quem atende no balcão.", "audio": "For here or to go?"}, {"tipo": "escolha", "pergunta": "I ___ like a coffee.", "opcoes": ["'d", "'m", "'s"], "certa": 0, "explica": "I'd like = I would like; o 'd é de would."}, {"tipo": "escolha", "pergunta": "O atendente pergunta \"For here or to go?\" e você vai comer ali. Você diz: ___", "opcoes": ["For here, please.", "To go, please.", "The check, please."], "certa": 0, "explica": "For here é aqui no local; to go é para levar."}, {"tipo": "montar", "pergunta": "Eu queria um café, por favor.", "resposta": "I'd like a coffee please", "extras": ["want", "am", "here"]}, {"tipo": "montar", "pergunta": "A conta, por favor.", "resposta": "The check please", "extras": ["card", "here", "go"]}, {"tipo": "pares", "pergunta": "Ligue a frase ao sentido", "pares": [["I'd like a coffee.", "Eu queria um café."], ["For here or to go?", "Para comer aqui ou para viagem?"], ["To go, please.", "Para viagem, por favor."], ["The check, please.", "A conta, por favor."], ["No ice, please.", "Sem gelo, por favor."]]}, {"tipo": "ouvir", "texto": "I'd like water, please."}, {"tipo": "falar", "texto": "I'd like a burger, please. To go.", "traducao": "Eu queria um hambúrguer, por favor. Para viagem."}], "semana": 1}, {"id": "RO-08", "titulo": "Direções: left, right, straight", "missao": "Fora do app: no caminho de hoje (carro ou a pé), diga em voz alta 'turn left', 'turn right' e 'go straight' em cada curva — 5 minutos.", "itens": [{"tipo": "dica", "rotulo": "Lição 8 · 1/2", "titulo": "As três palavras da rua", "html": "<p>Três palavras resolvem quase toda rua nos EUA:<\/p><table><tr><td>left<\/td><td>esquerda<\/td><\/tr><tr><td>right<\/td><td>direita<\/td><\/tr><tr><td>straight<\/td><td>em frente, reto<\/td><\/tr><\/table><p>Com <b>turn<\/b> (virar) elas viram ordem: <span class='ex'>Turn left<\/span> · <span class='ex'>Turn right<\/span>. Sem virar: <span class='ex'>Go straight<\/span>.<\/p><p>Som: <b>straight<\/b> soa /streit/ – o <i>gh<\/i> é mudo, como em <i>night<\/i> e <i>light<\/i>. A luz do semáforo também é <b>light<\/b>.<\/p><p>Junte tudo: <span class='ex'>Turn left at the light<\/span> · <span class='ex'>Go straight for two blocks<\/span> (duas quadras).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 8 · 2/2", "titulo": "Como pedir o caminho", "html": "<p>Uma frase abre a porta: <b>How do I get to…?<\/b> (como chego a…?). Depois é só colar o lugar:<\/p><p><span class='ex'>How do I get to the bank?<\/span> · <span class='ex'>How do I get to the school?<\/span><\/p><p>Para começar, sempre com <b>Excuse me<\/b> na frente. E para responder o que você ouve:<\/p><table><tr><td>It's on Main Street.<\/td><td>Fica na rua Main.<\/td><\/tr><tr><td>It's near the bank.<\/td><td>Fica perto do banco.<\/td><\/tr><tr><td>It's far.<\/td><td>É longe.<\/td><\/tr><tr><td>It's close.<\/td><td>É perto.<\/td><\/tr><\/table><p><b>block<\/b> = quadra. <span class='ex'>Two blocks<\/span> é a medida que americano usa para distância curta.<\/p>"}, {"tipo": "leitura", "titulo": "At the corner", "texto": "Excuse me. How do I get to the bank? — Go straight. Turn left at the light. — Is it far? — No. Two blocks. — Thank you. — You're welcome.", "glossario": [["get to", "chegar a"], ["go straight", "siga em frente"], ["turn left", "vire à esquerda"], ["block", "quadra"], ["far", "longe"], ["near", "perto"], ["You're welcome", "de nada"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que você faz no semáforo?", "opcoes": ["Viro à esquerda", "Viro à direita", "Sigo em frente"], "certa": 0, "explica": "Ele diz 'turn left' – virar à esquerda.", "audio": "Turn left at the light."}, {"tipo": "escolha", "pergunta": "Ouça: quantas quadras?", "opcoes": ["Duas", "Três", "Uma"], "certa": 0, "explica": "Ele diz 'two blocks' – duas quadras.", "audio": "Go straight for two blocks."}, {"tipo": "escolha", "pergunta": "How do I get ___ the bank?", "opcoes": ["to", "at", "in"], "certa": 0, "explica": "O pedaço é fixo: get to = chegar a."}, {"tipo": "escolha", "pergunta": "— Thank you. — ___ welcome.", "opcoes": ["You're", "Your", "You"], "certa": 0, "explica": "You're = you are; é o pedaço You're welcome."}, {"tipo": "montar", "pergunta": "Vire à direita no semáforo.", "resposta": "Turn right at the light", "extras": ["left", "go", "near"]}, {"tipo": "montar", "pergunta": "Como chego ao banco?", "resposta": "How do I get to the bank", "extras": ["where", "does", "at"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["left", "esquerda"], ["right", "direita"], ["straight", "em frente"], ["block", "quadra"], ["far", "longe"]]}, {"tipo": "ouvir", "texto": "Go straight for two blocks."}, {"tipo": "falar", "texto": "Excuse me. How do I get to the bank?", "traducao": "Com licença. Como chego ao banco?"}], "semana": 2}, {"id": "RO-09", "titulo": "No posto: fill it up, regular, cash or card", "missao": "Fora do app: no carro, antes de sair, diga em voz alta 'fill it up, please' e 'cash or card?' — 5 minutos.", "itens": [{"tipo": "dica", "rotulo": "Lição 9 · 1/2", "titulo": "A conversa do posto, em quatro frases", "html": "<p>Nos EUA, em geral quem abastece é você. A conversa com o caixa é curta e sempre igual:<\/p><table><tr><td>I need gas.<\/td><td>Preciso de gasolina.<\/td><\/tr><tr><td>Fill it up, please.<\/td><td>Encha o tanque, por favor.<\/td><\/tr><tr><td>Regular, please.<\/td><td>Comum, por favor.<\/td><\/tr><tr><td>Cash or card?<\/td><td>Dinheiro ou cartão?<\/td><\/tr><\/table><p><b>fill<\/b> = encher. <b>full<\/b> = cheio. <span class='ex'>Fill it up<\/span> é o pedaço inteiro: memorize assim, não palavra por palavra.<\/p><p>Se quiser pouco: <span class='ex'>Twenty dollars, please<\/span> (vinte dólares) – e você mesmo bombeia.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 9 · 2/2", "titulo": "Combustível, bomba e pagamento", "html": "<table><tr><td>regular<\/td><td>comum (a mais barata)<\/td><\/tr><tr><td>plus / premium<\/td><td>aditivada / podium<\/td><\/tr><tr><td>diesel<\/td><td>diesel<\/td><\/tr><tr><td>pump<\/td><td>bomba<\/td><\/tr><\/table><p>O atendente diz o número: <span class='ex'>Pump number four<\/span> (bomba quatro). E pergunta como você paga: <span class='ex'>Cash or card?<\/span><\/p><p>Você responde só a palavra: <b>Card, please<\/b> ou <b>Cash, please<\/b>. <b>cash<\/b> é dinheiro em espécie; <b>card<\/b> é cartão.<\/p><p>Se não entendeu o valor: <span class='ex'>How much is it?<\/span> – você já sabe essa da semana 1.<\/p>"}, {"tipo": "leitura", "titulo": "At the gas station", "texto": "I need gas. — Hi. Fill it up? — Yes, please. Regular. — Okay. Cash or card? — Card, please. — Pump number four. — Thank you.", "glossario": [["gas", "gasolina"], ["fill it up", "encher o tanque"], ["regular", "gasolina comum"], ["pump", "bomba de combustível"], ["cash", "dinheiro em espécie"], ["card", "cartão"], ["full", "cheio"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que o cliente quer?", "opcoes": ["Encher o tanque", "Lavar o carro", "Trocar o óleo"], "certa": 0, "explica": "'Fill it up' é encher o tanque.", "audio": "Fill it up, please."}, {"tipo": "escolha", "pergunta": "Ouça: o que o caixa está perguntando?", "opcoes": ["Como você paga", "Quantos litros", "Qual é a bomba"], "certa": 0, "explica": "'Cash or card?' pergunta a forma de pagamento.", "audio": "Cash or card?"}, {"tipo": "escolha", "pergunta": "___ it up, please.", "opcoes": ["Fill", "Full", "Fell"], "certa": 0, "explica": "O verbo é fill (encher); full é o adjetivo cheio."}, {"tipo": "escolha", "pergunta": "I ___ gas.", "opcoes": ["need", "needs", "need to"], "certa": 0, "explica": "Com I o verbo vai limpo: I need."}, {"tipo": "montar", "pergunta": "Encha o tanque, por favor.", "resposta": "Fill it up please", "extras": ["full", "do", "gas"]}, {"tipo": "montar", "pergunta": "Dinheiro ou cartão?", "resposta": "Cash or card", "extras": ["and", "money", "pump"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["gas", "gasolina"], ["pump", "bomba"], ["cash", "dinheiro em espécie"], ["card", "cartão"], ["full", "cheio"]]}, {"tipo": "ouvir", "texto": "Twenty dollars of regular, please."}, {"tipo": "falar", "texto": "Fill it up, please. Regular.", "traducao": "Encha o tanque, por favor. Comum."}], "semana": 2}, {"id": "RO-10", "titulo": "Horas e dias: at 8, on Monday", "missao": "Fora do app: olhe a agenda de amanhã e diga em voz alta a hora e o dia de cada compromisso ('at nine', 'on Monday') — 5 minutos.", "itens": [{"tipo": "dica", "rotulo": "Lição 10 · 1/2", "titulo": "Que horas são", "html": "<p>Pergunta fixa: <b>What time is it?<\/b> (que horas são?). Resposta com <b>o'clock<\/b> (em ponto) ou só o número:<\/p><table><tr><td>It's eight.<\/td><td>São oito.<\/td><\/tr><tr><td>It's eight o'clock.<\/td><td>São oito em ponto.<\/td><\/tr><tr><td>It's eight thirty.<\/td><td>São oito e meia.<\/td><\/tr><tr><td>It's nine fifteen.<\/td><td>São nove e quinze.<\/td><\/tr><\/table><p>Americano fala a hora em número direto: 8:30 = <b>eight thirty<\/b>. <b>half past<\/b> também existe, mas comece pelo número.<\/p><p>Antes da hora, sempre <b>at<\/b>: <span class='ex'>at eight<\/span> · <span class='ex'>at nine thirty<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 10 · 2/2", "titulo": "Os dias e a regra do at / on", "html": "<p>Dias da semana, com maiúscula em inglês:<\/p><table><tr><td>Monday · Tuesday · Wednesday<\/td><td>segunda · terça · quarta<\/td><\/tr><tr><td>Thursday · Friday<\/td><td>quinta · sexta<\/td><\/tr><tr><td>Saturday · Sunday<\/td><td>sábado · domingo<\/td><\/tr><\/table><p>Três preposições, três usos:<\/p><table><tr><td><b>at<\/b> 8<\/td><td>hora<\/td><\/tr><tr><td><b>on<\/b> Monday<\/td><td>dia<\/td><\/tr><tr><td><b>next week<\/b><\/td><td>semana que vem (sem preposição)<\/td><\/tr><\/table><p>Pedaços prontos: <span class='ex'>See you tomorrow<\/span> · <span class='ex'>See you on Monday<\/span> · <span class='ex'>next week<\/span>.<\/p>"}, {"tipo": "leitura", "titulo": "The meeting", "texto": "Hi. What time is the meeting? — At nine o'clock. — Today? — No, on Monday. Next week. — Okay. See you tomorrow. — See you.", "glossario": [["meeting", "reunião"], ["o'clock", "em ponto"], ["today", "hoje"], ["tomorrow", "amanhã"], ["next week", "semana que vem"], ["on Monday", "na segunda-feira"]]}, {"tipo": "escolha", "pergunta": "Ouça: que horas são?", "opcoes": ["Oito", "Oito e meia", "Nove"], "certa": 0, "explica": "'Eight o'clock' são oito em ponto.", "audio": "It's eight o'clock."}, {"tipo": "escolha", "pergunta": "Ouça: quando é a aula?", "opcoes": ["Na segunda", "Na terça", "Na sexta"], "certa": 0, "explica": "'On Monday' é na segunda-feira.", "audio": "The class is on Monday."}, {"tipo": "escolha", "pergunta": "The meeting is ___ Monday.", "opcoes": ["on", "in", "at"], "certa": 0, "explica": "Dia da semana pede on."}, {"tipo": "escolha", "pergunta": "I start work ___ eight.", "opcoes": ["at", "on", "in"], "certa": 0, "explica": "Hora pede at."}, {"tipo": "montar", "pergunta": "Que horas são?", "resposta": "What time is it", "extras": ["hour", "when", "the"]}, {"tipo": "montar", "pergunta": "A reunião é na segunda-feira.", "resposta": "The meeting is on Monday", "extras": ["in", "at", "today"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["meeting", "reunião"], ["today", "hoje"], ["tomorrow", "amanhã"], ["next week", "semana que vem"], ["Monday", "segunda-feira"]]}, {"tipo": "ouvir", "texto": "It's eight o'clock."}, {"tipo": "falar", "texto": "What time is the meeting? It's at nine.", "traducao": "Que horas é a reunião? É às nove."}], "semana": 2}, {"id": "RO-11", "titulo": "DMV e documentos: I have an appointment", "missao": "Fora do app: separe passaporte e um comprovante de endereço numa pasta e diga em voz alta 'Here is my passport' — 5 minutos.", "itens": [{"tipo": "dica", "rotulo": "Lição 11 · 1/2", "titulo": "Na fila do DMV", "html": "<p>DMV é o órgão do documento de motorista. Toda conversa começa igual:<\/p><table><tr><td>I have an appointment.<\/td><td>Tenho hora marcada.<\/td><\/tr><tr><td>I need a driver's license.<\/td><td>Preciso da carteira de motorista.<\/td><\/tr><tr><td>Here is my passport.<\/td><td>Aqui está meu passaporte.<\/td><\/tr><\/table><p>Som: <b>license<\/b> soa /ˈlaɪsəns/ – o <i>c<\/i> é um <i>s<\/i>. E <b>appointment<\/b> /əˈpɔɪntmənt/, com o fim quase engolido.<\/p><p><b>Here is<\/b> é o pedaço de entregar qualquer coisa em balcão: <span class='ex'>Here is my form<\/span> · <span class='ex'>Here is my card<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 11 · 2/2", "titulo": "As três ordens do balcão", "html": "<p>O atendente fala pouco e em ordem. Aprenda como som:<\/p><table><tr><td>Take a number, please.<\/td><td>Pegue uma senha.<\/td><\/tr><tr><td>Fill out this form.<\/td><td>Preencha este formulário.<\/td><\/tr><tr><td>Sign here.<\/td><td>Assine aqui.<\/td><\/tr><\/table><p><b>fill out<\/b> é o verbo preencher – não é <i>write<\/i>. <b>sign<\/b> soa /saɪn/, o <i>g<\/i> é mudo.<\/p><p>Se travar, uma frase salva: <span class='ex'>Can you repeat that, please?<\/span> Você já tem essa da semana 1.<\/p>"}, {"tipo": "leitura", "titulo": "At the DMV", "texto": "Hi. I have an appointment. — Name? — Rodolfo Matos. Here is my passport. — Thank you. Fill out this form. Sign here. — Okay. — Take a number, please.", "glossario": [["appointment", "hora marcada"], ["driver's license", "carteira de motorista"], ["passport", "passaporte"], ["form", "formulário"], ["fill out", "preencher"], ["sign", "assinar"], ["take a number", "pegar uma senha"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele tem?", "opcoes": ["Hora marcada", "Um formulário", "Uma senha"], "certa": 0, "explica": "'I have an appointment' é ter hora marcada.", "audio": "I have an appointment."}, {"tipo": "escolha", "pergunta": "Ouça: o que o atendente pede?", "opcoes": ["Preencher o formulário", "Assinar aqui", "Esperar a senha"], "certa": 0, "explica": "'Fill out this form' é preencher o formulário.", "audio": "Fill out this form."}, {"tipo": "escolha", "pergunta": "___ is my passport.", "opcoes": ["Here", "Hear", "This here"], "certa": 0, "explica": "O pedaço é Here is… = aqui está."}, {"tipo": "escolha", "pergunta": "Please fill ___ this form.", "opcoes": ["out", "in", "up"], "certa": 0, "explica": "Preencher é sempre fill out."}, {"tipo": "montar", "pergunta": "Eu tenho hora marcada.", "resposta": "I have an appointment", "extras": ["a", "has", "time"]}, {"tipo": "montar", "pergunta": "Aqui está meu passaporte.", "resposta": "Here is my passport", "extras": ["are", "the", "I"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["appointment", "hora marcada"], ["passport", "passaporte"], ["driver's license", "carteira de motorista"], ["form", "formulário"], ["sign", "assinar"]]}, {"tipo": "ouvir", "texto": "Take a number, please."}, {"tipo": "falar", "texto": "I have an appointment. Here is my passport.", "traducao": "Tenho hora marcada. Aqui está meu passaporte."}], "semana": 2}, {"id": "RO-12", "titulo": "Telefone: This is Rodolfo", "missao": "Fora do app: grave no celular um áudio de 20 segundos deixando um recado em inglês ('This is Rodolfo. Please call me back.') e ouça.", "itens": [{"tipo": "dica", "rotulo": "Lição 12 · 1/2", "titulo": "Ao telefone, não é I am", "html": "<p>No telefone, americano não diz <i>I am Rodolfo<\/i>. Diz o pedaço:<\/p><p><b>This is Rodolfo.<\/b> (aqui é o Rodolfo)<\/p><p>As outras três frases que resolvem a ligação:<\/p><table><tr><td>Is Maria there?<\/td><td>A Maria está?<\/td><\/tr><tr><td>Hold on, please.<\/td><td>Espere um instante.<\/td><\/tr><tr><td>Sorry, wrong number.<\/td><td>Desculpe, número errado.<\/td><\/tr><\/table><p><b>hold on<\/b> soa /hold on/, corrido: /ˈholdɔn/. Sem tela, é a frase mais comum do telefone.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 12 · 2/2", "titulo": "Deixar recado", "html": "<p>Quando a pessoa não está, duas frases bastam:<\/p><table><tr><td>Can I leave a message?<\/td><td>Posso deixar um recado?<\/td><\/tr><tr><td>I'll call back later.<\/td><td>Eu ligo de volta depois.<\/td><\/tr><\/table><p><b>call<\/b> = ligar · <b>call back<\/b> = retornar a ligação · <b>message<\/b> = recado.<\/p><p>No fim, os fechos: <span class='ex'>Thank you. Bye.<\/span> · <span class='ex'>See you. Bye.<\/span> – o <i>bye<\/i> brasileiro é o mesmo.<\/p>"}, {"tipo": "leitura", "titulo": "A phone call", "texto": "Hello? — Hi. This is Rodolfo. — Hi, Rodolfo. — Is Maria there? — No. She's at work. — Can I leave a message? — Sure. — Thank you. Bye.", "glossario": [["This is…", "aqui é… (ao telefone)"], ["message", "recado"], ["call", "ligar"], ["call back", "ligar de volta"], ["work", "trabalho"], ["bye", "tchau"]]}, {"tipo": "escolha", "pergunta": "Ouça: quem está ligando?", "opcoes": ["Rodolfo", "Maria", "A secretária"], "certa": 0, "explica": "'This is Rodolfo' é o Rodolfo se apresentando.", "audio": "This is Rodolfo."}, {"tipo": "escolha", "pergunta": "Ouça: o que ele quer?", "opcoes": ["Deixar um recado", "Falar com a Maria", "Ligar de volta"], "certa": 0, "explica": "'Leave a message' é deixar um recado.", "audio": "Can I leave a message?"}, {"tipo": "escolha", "pergunta": "Ao telefone: ___ is Rodolfo.", "opcoes": ["This", "I", "Here"], "certa": 0, "explica": "No telefone a apresentação é This is…"}, {"tipo": "escolha", "pergunta": "Can I ___ a message?", "opcoes": ["leave", "let", "live"], "certa": 0, "explica": "O pedaço é leave a message."}, {"tipo": "montar", "pergunta": "Posso deixar um recado?", "resposta": "Can I leave a message", "extras": ["let", "say", "the"]}, {"tipo": "montar", "pergunta": "Ela está no trabalho.", "resposta": "She is at work", "extras": ["in", "on", "the"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["message", "recado"], ["call", "ligar"], ["work", "trabalho"], ["hello", "alô"], ["bye", "tchau"]]}, {"tipo": "ouvir", "texto": "Can I leave a message?"}, {"tipo": "falar", "texto": "Hello. This is Rodolfo. Can I leave a message?", "traducao": "Alô. Aqui é o Rodolfo. Posso deixar um recado?"}], "semana": 2}, {"id": "RO-13", "titulo": "Revisão da semana 2", "missao": "Fora do app: sem olhar o celular, diga as 6 frases da semana em voz alta e anote num papel as que você esqueceu — 10 minutos.", "itens": [{"tipo": "dica", "rotulo": "Lição 13 · 1/2", "titulo": "As seis frases da semana", "html": "<p>Rua, carro, hora, balcão e telefone cabem em seis frases:<\/p><table><tr><td>How do I get to the bank?<\/td><td>Como chego ao banco?<\/td><\/tr><tr><td>Turn left at the light.<\/td><td>Vire à esquerda no semáforo.<\/td><\/tr><tr><td>Fill it up, please.<\/td><td>Encha o tanque, por favor.<\/td><\/tr><tr><td>The class is on Monday.<\/td><td>A aula é na segunda.<\/td><\/tr><tr><td>I have an appointment.<\/td><td>Tenho hora marcada.<\/td><\/tr><tr><td>Can I leave a message?<\/td><td>Posso deixar um recado?<\/td><\/tr><\/table><p>Leia em voz alta duas vezes. O ouvido precisa ouvir o que a boca já sabe.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 13 · 2/2", "titulo": "Os três erros da semana", "html": "<table><tr><td><s>in Monday<\/s> → <b>on Monday<\/b><\/td><td>dia pede on<\/td><\/tr><tr><td><s>on 8<\/s> → <b>at 8<\/b><\/td><td>hora pede at<\/td><\/tr><tr><td><s>I am Rodolfo<\/s> → <b>This is Rodolfo<\/b><\/td><td>ao telefone, This is<\/td><\/tr><\/table><p>E amanhã vem notícia. Adianto quatro palavras que você vai ver nas manchetes: <b>weather<\/b> (tempo) · <b>storm<\/b> (tempestade) · <b>price<\/b> (preço) · <b>city<\/b> (cidade).<\/p>"}, {"tipo": "leitura", "titulo": "One morning", "texto": "I need gas. — Fill it up? — Yes, please. Regular. — Cash or card? — Card, please. — How do I get to the DMV? — Go straight. Turn left at the light. — Is it far? — Two blocks. — What time is it? — It's eight. — I have an appointment at nine. — Good. See you.", "glossario": [["fill it up", "encher o tanque"], ["go straight", "siga em frente"], ["turn left", "vire à esquerda"], ["two blocks", "duas quadras"], ["appointment", "hora marcada"], ["cash", "dinheiro em espécie"]]}, {"tipo": "escolha", "pergunta": "Ouça: para onde ele manda virar?", "opcoes": ["À direita", "À esquerda", "Em frente"], "certa": 0, "explica": "'Turn right' é virar à direita.", "audio": "Turn right at the light."}, {"tipo": "escolha", "pergunta": "Ouça: que horas é o compromisso?", "opcoes": ["Nove", "Oito", "Dez"], "certa": 0, "explica": "Ele diz 'at nine' – às nove.", "audio": "I have an appointment at nine."}, {"tipo": "escolha", "pergunta": "The meeting is ___ Monday.", "opcoes": ["on", "at", "in"], "certa": 0, "explica": "Dia da semana pede on."}, {"tipo": "escolha", "pergunta": "___ is my passport.", "opcoes": ["Here", "Hear", "It"], "certa": 0, "explica": "Entregando na mão: Here is my passport."}, {"tipo": "montar", "pergunta": "Como chego ao posto?", "resposta": "How do I get to the gas station", "extras": ["where", "does", "in"]}, {"tipo": "montar", "pergunta": "Encha o tanque, por favor.", "resposta": "Fill it up please", "extras": ["full", "do", "the"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["straight", "em frente"], ["cash", "dinheiro em espécie"], ["appointment", "hora marcada"], ["message", "recado"], ["Monday", "segunda-feira"]]}, {"tipo": "ouvir", "texto": "Fill it up, please."}, {"tipo": "falar", "texto": "I have an appointment at nine. Can I leave a message?", "traducao": "Tenho hora marcada às nove. Posso deixar um recado?"}], "semana": 2}, {"id": "RO-14", "titulo": "Notícias simples: as 10 palavras da manchete", "missao": "Fora do app: abra learningenglish.voanews.com no celular e ouça 5 minutos de 'News Words'; anote 3 palavras que reconheceu.", "itens": [{"tipo": "dica", "rotulo": "Lição 14 · 1/2", "titulo": "As dez palavras que abrem o noticiário", "html": "<p>Manchete americana usa palavra curta e concreta. Estas dez aparecem toda semana:<\/p><table><tr><td>weather<\/td><td>tempo, clima<\/td><\/tr><tr><td>storm<\/td><td>tempestade<\/td><\/tr><tr><td>flood<\/td><td>enchente, alagamento<\/td><\/tr><tr><td>price<\/td><td>preço<\/td><\/tr><tr><td>gas<\/td><td>gasolina<\/td><\/tr><tr><td>job<\/td><td>emprego<\/td><\/tr><tr><td>school<\/td><td>escola<\/td><\/tr><tr><td>city<\/td><td>cidade<\/td><\/tr><tr><td>police<\/td><td>polícia<\/td><\/tr><tr><td>health<\/td><td>saúde<\/td><\/tr><\/table><p>Som: <b>flood<\/b> soa /flad/ – o <i>oo<\/i> é um <i>a<\/i> curto, como em <i>blood<\/i>. <b>health<\/b> soa /helθ/, com língua entre os dentes no fim.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 14 · 2/2", "titulo": "Como se lê uma manchete", "html": "<p>Três marcas da manchete, e você já lê metade:<\/p><p><b>1.<\/b> Verbo no presente, sem auxiliar: <span class='ex'>City opens school<\/span> (a cidade abre escola).<br><b>2.<\/b> Palavra pequena no lugar de duas: <span class='ex'>Gas price high<\/span>.<br><b>3.<\/b> Sem artigo: <span class='ex'>Police help city<\/span>.<\/p><p>Os três moldes para reconhecer na hora:<\/p><table><tr><td>A big storm today.<\/td><td>Tempestade forte hoje.<\/td><\/tr><tr><td>The gas price is high.<\/td><td>O preço da gasolina está alto.<\/td><\/tr><tr><td>New jobs at the school.<\/td><td>Novos empregos na escola.<\/td><\/tr><\/table><p>Ouça o podcast <b>VOA Learning English – News Words<\/b>: fala devagar e usa exatamente estas palavras.<\/p>"}, {"tipo": "leitura", "titulo": "Today's news", "texto": "Today's news. Weather: a big storm today. Rain and wind. Flood: water on the city roads. Price: the gas price is high. Job: new jobs at the school. Health: the city opens a clinic. Police: police help on Main Street.", "glossario": [["weather", "tempo, clima"], ["storm", "tempestade"], ["flood", "enchente, alagamento"], ["price", "preço"], ["job", "emprego"], ["health", "saúde"]]}, {"tipo": "escolha", "pergunta": "Ouça: como está o preço da gasolina?", "opcoes": ["Alto", "Baixo", "Igual"], "certa": 0, "explica": "'Price is high' – o preço está alto.", "audio": "The gas price is high."}, {"tipo": "escolha", "pergunta": "Ouça: o que vem hoje?", "opcoes": ["Uma tempestade", "Uma enchente", "Sol"], "certa": 0, "explica": "'A big storm today' – tempestade forte hoje.", "audio": "A big storm today."}, {"tipo": "escolha", "pergunta": "Manchete: 'Water on the roads' é sinal de ___.", "opcoes": ["flood", "job", "school"], "certa": 0, "explica": "Água na rua é flood, enchente."}, {"tipo": "escolha", "pergunta": "The ___ opens a new school.", "opcoes": ["city", "country", "street"], "certa": 0, "explica": "city = cidade, a palavra da manchete."}, {"tipo": "montar", "pergunta": "O preço da gasolina está alto.", "resposta": "The gas price is high", "extras": ["are", "cheap", "of"]}, {"tipo": "montar", "pergunta": "Novos empregos na escola.", "resposta": "New jobs at the school", "extras": ["in", "job", "a"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["weather", "tempo, clima"], ["flood", "enchente"], ["price", "preço"], ["storm", "tempestade"], ["job", "emprego"], ["health", "saúde"]]}, {"tipo": "ouvir", "texto": "The gas price is high."}, {"tipo": "falar", "texto": "A big storm today. Water on the city roads.", "traducao": "Tempestade forte hoje. Água nas ruas da cidade."}], "semana": 2}, {"id": "RO-15", "titulo": "Médico e farmácia", "missao": "Fora do app: no caminho, repita em voz alta 'I have a headache' e 'How often do I take it?' três vezes cada, como se estivesse no balcão da farmácia.", "itens": [{"tipo": "dica", "rotulo": "Lição 15 · 1/2", "titulo": "Dois verbos: have e need", "html": "<p>No consultório e na farmácia você precisa de dois verbos só: <b>have<\/b> (ter) e <b>need<\/b> (precisar).<\/p><table><tr><td>I <b>have<\/b> a headache.<\/td><td>Estou com dor de cabeça.<\/td><\/tr><tr><td>I <b>have<\/b> a fever.<\/td><td>Estou com febre.<\/td><\/tr><tr><td>I <b>need<\/b> a doctor.<\/td><td>Preciso de um médico.<\/td><\/tr><tr><td>I <b>need<\/b> something for pain.<\/td><td>Preciso de algo para a dor.<\/td><\/tr><\/table><p>Sintoma em inglês vai com <b>have<\/b>, nunca com o verbo ser: <span class='ex'>I am headache<\/span> está errado. É <span class='ex'>I have a headache<\/span>.<\/p><p>Pronúncia: <b>headache<\/b> é /ˈhɛdeɪk/ — “rré-deik”. O <i>ch<\/i> soa como <b>k<\/b>. Igual em <span class='ex'>backache<\/span> (dor nas costas) e <span class='ex'>stomachache<\/span> (dor de barriga).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 15 · 2/2", "titulo": "How often…? — de quanto em quanto tempo", "html": "<p><b>How often…?<\/b> quer dizer “com que frequência?”. Na farmácia é a pergunta do remédio.<\/p><table><tr><td>How often do I take it?<\/td><td>De quanto em quanto tempo eu tomo?<\/td><\/tr><tr><td>Twice a day.<\/td><td>Duas vezes ao dia.<\/td><\/tr><tr><td>Three times a day.<\/td><td>Três vezes ao dia.<\/td><\/tr><tr><td>Take it with food.<\/td><td>Tome junto com a comida.<\/td><\/tr><\/table><p>Você só precisa decorar a pergunta pronta. A resposta vem em número: <span class='ex'>once<\/span> (uma vez), <span class='ex'>twice<\/span> (duas), <span class='ex'>three times<\/span> (três).<\/p><p>Se for o farmacêutico perguntando, ele diz <span class='ex'>How often do you take it?<\/span> — é a mesma pergunta, com <b>you<\/b> no lugar de <b>I<\/b>.<\/p>"}, {"tipo": "leitura", "titulo": "At the pharmacy", "texto": "Hi. How can I help you? — I have a headache. — Do you have a fever? — No. Just a headache. — Take this. Two pills. — How often do I take it? — Twice a day. Take it with food. — Thank you.", "glossario": [["How can I help you?", "Como posso ajudar você?"], ["headache", "dor de cabeça"], ["fever", "febre"], ["pills", "comprimidos"], ["How often", "com que frequência"], ["twice a day", "duas vezes ao dia"], ["with food", "junto com a comida"], ["just", "só, apenas"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele tem?", "opcoes": ["Dor de cabeça", "Febre", "Dor de barriga"], "certa": 0, "explica": "Ele diz “I have a headache”: dor de cabeça.", "audio": "I have a headache."}, {"tipo": "escolha", "pergunta": "Ouça: quantas vezes ao dia?", "opcoes": ["Duas vezes", "Uma vez", "Três vezes"], "certa": 0, "explica": "“Twice” é duas vezes; “once” é uma vez.", "audio": "Take it twice a day."}, {"tipo": "escolha", "pergunta": "I ___ a headache.", "opcoes": ["have", "am", "has"], "certa": 0, "explica": "Sintoma pede o verbo have; com I, a forma é have."}, {"tipo": "escolha", "pergunta": "How often ___ I take it?", "opcoes": ["do", "am", "is"], "certa": 0, "explica": "Pergunta no presente com I usa do: how often do I…?"}, {"tipo": "montar", "pergunta": "Estou com dor de cabeça.", "resposta": "I have a headache", "extras": ["am", "fever", "the"]}, {"tipo": "montar", "pergunta": "Eu preciso de algo para a dor.", "resposta": "I need something for pain", "extras": ["have", "the", "doctor"]}, {"tipo": "pares", "pares": [["headache", "dor de cabeça"], ["fever", "febre"], ["pills", "comprimidos"], ["twice a day", "duas vezes ao dia"], ["with food", "junto com a comida"], ["something for pain", "algo para a dor"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "I need something for pain."}, {"tipo": "falar", "texto": "I have a headache. I need a doctor.", "traducao": "Estou com dor de cabeça. Preciso de um médico."}], "semana": 3}, {"id": "RO-16", "titulo": "Banco e contas", "missao": "Fora do app: abra o mapa do celular, ache um banco perto de casa e anote o horário de funcionamento — é a primeira coisa que você vai conferir lá.", "itens": [{"tipo": "dica", "rotulo": "Lição 16 · 1/2", "titulo": "I want to open an account", "html": "<p>Abrir conta começa com uma frase: <b>I want to open an account.<\/b> = “Eu quero abrir uma conta.”<\/p><table><tr><td>I want to open an account.<\/td><td>Quero abrir uma conta.<\/td><\/tr><tr><td>checking account<\/td><td>conta corrente<\/td><\/tr><tr><td>savings account<\/td><td>poupança<\/td><\/tr><tr><td>Here is my passport.<\/td><td>Aqui está meu passaporte.<\/td><\/tr><\/table><p>A fórmula é <b>I want to<\/b> + verbo: <span class='ex'>I want to pay<\/span> (quero pagar), <span class='ex'>I want to close the account<\/span> (quero fechar a conta).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 16 · 2/2", "titulo": "How much is the fee?", "html": "<p><b>fee<\/b> é a taxa que o banco cobra. A pergunta é sempre a mesma:<\/p><p><b>How much is the fee?<\/b> — “Quanto é a taxa?” Pronúncia: <b>fee<\/b> é /fiː/, um “fi” comprido, sem “ei”.<\/p><table><tr><td>There is a fee.<\/td><td>Tem uma taxa.<\/td><\/tr><tr><td>Five dollars a month.<\/td><td>Cinco dólares por mês.<\/td><\/tr><tr><td>It's free.<\/td><td>É de graça.<\/td><\/tr><\/table><p>Se a resposta vier rápida, use a frase da semana 1: <span class='ex'>Slowly, please.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "At the bank", "texto": "Good morning. I want to open an account. — Checking or savings? — Checking, please. — Do you have an ID? — Yes. Here is my passport. — OK. How much is the fee? — Five dollars a month. — Fine. Thank you.", "glossario": [["open an account", "abrir uma conta"], ["checking / savings", "corrente / poupança"], ["ID", "documento com foto"], ["Here is", "aqui está"], ["fee", "taxa"], ["a month", "por mês"], ["Fine", "certo, tudo bem"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele quer fazer?", "opcoes": ["Abrir uma conta", "Fechar a conta", "Pagar uma conta"], "certa": 0, "explica": "Ele diz “open an account”: abrir uma conta.", "audio": "I want to open an account."}, {"tipo": "escolha", "pergunta": "Ouça: quanto é por mês?", "opcoes": ["Cinco dólares", "Quinze dólares", "Cinquenta dólares"], "certa": 0, "explica": "Ele diz “five dollars a month”: cinco dólares por mês.", "audio": "Five dollars a month."}, {"tipo": "escolha", "pergunta": "I want ___ open an account.", "opcoes": ["to", "for", "in"], "certa": 0, "explica": "Depois de want, o verbo vem com to: want to open."}, {"tipo": "escolha", "pergunta": "How much ___ the fee?", "opcoes": ["is", "are", "do"], "certa": 0, "explica": "Fee está no singular, então o verbo é is."}, {"tipo": "montar", "pergunta": "Eu quero abrir uma conta.", "resposta": "I want to open an account", "extras": ["the", "fee", "how"]}, {"tipo": "montar", "pergunta": "Quanto é a taxa?", "resposta": "How much is the fee", "extras": ["are", "do", "account"]}, {"tipo": "pares", "pares": [["checking account", "conta corrente"], ["savings account", "poupança"], ["fee", "taxa"], ["passport", "passaporte"], ["a month", "por mês"], ["free", "de graça"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "Here is my passport."}, {"tipo": "falar", "texto": "I want to open a checking account. How much is the fee?", "traducao": "Quero abrir uma conta corrente. Quanto é a taxa?"}], "semana": 3}, {"id": "RO-17", "titulo": "Casa e aluguel", "missao": "Fora do app: na sua casa, aponte para a pia, o vaso e o chuveiro e diga o nome de cada um em inglês em voz alta, três vezes.", "itens": [{"tipo": "dica", "rotulo": "Lição 17 · 1/2", "titulo": "Dizer o que está quebrado", "html": "<p>Toda reclamação de casa tem a mesma forma: <b>The<\/b> + coisa + <b>is<\/b> + problema.<\/p><table><tr><td>The sink is leaking.<\/td><td>A pia está vazando.<\/td><\/tr><tr><td>The toilet is broken.<\/td><td>O vaso está quebrado.<\/td><\/tr><tr><td>The shower is not working.<\/td><td>O chuveiro não está funcionando.<\/td><\/tr><\/table><p>Três problemas resolvem quase tudo: <span class='ex'>leaking<\/span> (vazando), <span class='ex'>broken<\/span> (quebrado), <span class='ex'>not working<\/span> (não funciona).<\/p><p>Pronúncia: <b>leaking<\/b> é /ˈliːkɪŋ/ — “li-kin”, com i comprido. Igual em <span class='ex'>leak<\/span> e <span class='ex'>key<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 17 · 2/2", "titulo": "Marcar a visita", "html": "<p>Quem conserta é o <b>landlord<\/b> (dono do imóvel); você é o <b>tenant<\/b> (inquilino).<\/p><table><tr><td>Can you come tomorrow?<\/td><td>Você pode vir amanhã?<\/td><\/tr><tr><td>Can you come today?<\/td><td>Você pode vir hoje?<\/td><\/tr><tr><td>What time?<\/td><td>A que horas?<\/td><\/tr><tr><td>I'm home after six.<\/td><td>Estou em casa depois das seis.<\/td><\/tr><\/table><p><b>Can you…?<\/b> é o pedido educado e serve para tudo: <span class='ex'>Can you call me?<\/span>, <span class='ex'>Can you help me?<\/span><\/p>"}, {"tipo": "leitura", "titulo": "The leaking sink", "texto": "Hello, this is Rodolfo. I'm the tenant in 4B. — Hi, Rodolfo. What's the problem? — The sink is leaking. — Oh, no. I can come tomorrow. — Great. What time? — Ten in the morning. — OK. I'm home. Thank you.", "glossario": [["tenant", "inquilino"], ["What's the problem?", "Qual é o problema?"], ["sink", "pia"], ["leaking", "vazando"], ["What time?", "A que horas?"], ["I'm home", "estou em casa"], ["tomorrow", "amanhã"]]}, {"tipo": "escolha", "pergunta": "Ouça: qual é o problema?", "opcoes": ["A pia está vazando", "O vaso está quebrado", "O chuveiro não funciona"], "certa": 0, "explica": "Ele diz “sink is leaking”: a pia está vazando.", "audio": "The sink is leaking."}, {"tipo": "escolha", "pergunta": "Ouça: quando ele pode ir?", "opcoes": ["Amanhã de manhã", "Hoje à noite", "Na segunda"], "certa": 0, "explica": "Ele diz “tomorrow morning”: amanhã de manhã.", "audio": "I can come tomorrow morning."}, {"tipo": "escolha", "pergunta": "The sink ___ leaking.", "opcoes": ["is", "are", "am"], "certa": 0, "explica": "Uma coisa no singular pede is."}, {"tipo": "escolha", "pergunta": "___ you come tomorrow?", "opcoes": ["Can", "Do", "Are"], "certa": 0, "explica": "Para pedir uma visita, a frase começa com can."}, {"tipo": "montar", "pergunta": "A pia está vazando.", "resposta": "The sink is leaking", "extras": ["are", "leak", "toilet"]}, {"tipo": "montar", "pergunta": "Você pode vir amanhã?", "resposta": "Can you come tomorrow", "extras": ["do", "today", "are"]}, {"tipo": "pares", "pares": [["sink", "pia"], ["toilet", "vaso sanitário"], ["leaking", "vazando"], ["broken", "quebrado"], ["tenant", "inquilino"], ["tomorrow", "amanhã"]], "pergunta": "Ligue a palavra à tradução"}, {"tipo": "ouvir", "texto": "The toilet is broken."}, {"tipo": "falar", "texto": "The sink is leaking. Can you come tomorrow?", "traducao": "A pia está vazando. Você pode vir amanhã?"}], "semana": 3}, {"id": "RO-18", "titulo": "Escola das meninas", "missao": "Fora do app: escreva os nomes das suas filhas num papel e, ao lado de cada um, a frase “I'm ___'s father”. Leia as duas em voz alta cinco vezes.", "itens": [{"tipo": "dica", "rotulo": "Lição 18 · 1/2", "titulo": "I'm Sofia's father", "html": "<p>O <b>'s<\/b> marca o dono. Para se apresentar na escola, basta:<\/p><p><b>I'm Sofia's father.<\/b> = “Sou o pai da Sofia.”<\/p><table><tr><td>Sofia's father<\/td><td>o pai da Sofia<\/td><\/tr><tr><td>my daughter's teacher<\/td><td>a professora da minha filha<\/td><\/tr><tr><td>my daughter<\/td><td>minha filha<\/td><\/tr><tr><td>my son<\/td><td>meu filho<\/td><\/tr><\/table><p>O <b>'s<\/b> vem depois do nome de quem tem: <span class='ex'>Sofia's father<\/span>, e não “the father of Sofia”.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 18 · 2/2", "titulo": "As palavras da escola", "html": "<table><tr><td>parent-teacher conference<\/td><td>reunião de pais e professores<\/td><\/tr><tr><td>third grade<\/td><td>terceiro ano<\/td><\/tr><tr><td>homework<\/td><td>lição de casa<\/td><\/tr><tr><td>reading<\/td><td>leitura<\/td><\/tr><tr><td>the school office<\/td><td>a secretaria da escola<\/td><\/tr><\/table><p>A frase que abre a conversa: <b>How is she doing?<\/b> = “Como ela está indo?” A resposta costuma ser <span class='ex'>She is doing well<\/span> (está indo bem) ou <span class='ex'>She needs help with reading<\/span> (precisa de ajuda com leitura).<\/p><p>Se não entender a resposta, você já sabe o que fazer: <span class='ex'>Can you repeat that, please?<\/span><\/p>"}, {"tipo": "leitura", "titulo": "Parent-teacher conference", "texto": "Hi, I'm Rodolfo. I'm Sofia's father. — Nice to meet you. I'm Mrs. Clark. I teach third grade. — How is Sofia doing? — She is doing well. She needs help with reading. — OK. Can I have a copy? — Sure. Here you are.", "glossario": [["I'm Sofia's father", "sou o pai da Sofia"], ["third grade", "terceiro ano"], ["How is she doing?", "como ela está indo?"], ["doing well", "indo bem"], ["needs help with reading", "precisa de ajuda com leitura"], ["a copy", "uma cópia"], ["Here you are", "aqui está"]]}, {"tipo": "escolha", "pergunta": "Ouça: quem ele é?", "opcoes": ["O pai da Sofia", "O professor da Sofia", "O vizinho da Sofia"], "certa": 0, "explica": "Ele diz “I'm Sofia's father”: o pai da Sofia.", "audio": "I'm Sofia's father."}, {"tipo": "escolha", "pergunta": "Ouça: com o que ela precisa de ajuda?", "opcoes": ["Leitura", "Matemática", "Lição de casa"], "certa": 0, "explica": "Ele diz “help with reading”: ajuda com leitura.", "audio": "She needs
