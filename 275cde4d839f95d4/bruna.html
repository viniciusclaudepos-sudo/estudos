<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Inglês da Bruna</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--ink:#1d2330;--mut:#6b7280;--line:#e6e1d6;--acc:#1d4ed8;--acc2:#7c9be8;
--ok:#2f9e5b;--okbg:#e7f6ec;--err:#d64545;--errbg:#fdeaea;--tile:#fff;--sh:0 2px 0 var(--line)}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eef0f4;--mut:#9aa3b2;--line:#2c3340;
--okbg:#163323;--errbg:#3a1b1b;--tile:#222835}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
.app{max-width:680px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px 0}
.wrap{padding:0 0 40px}
header.topo{padding:16px 0 6px;display:flex;align-items:center;gap:12px}
header.topo .nome{font-weight:800;letter-spacing:.01em}
header.topo .volta{margin-left:auto;border:0;background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer}
.tag{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-bottom:6px}
h1{font-size:26px;line-height:1.25;margin:6px 0 10px}
h2{font-size:20px;margin:26px 0 10px}
h3{font-size:17px;margin:18px 0 6px}
p{margin:0 0 12px}
.lead{font-size:18px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh);margin:0 0 14px}
.card b{color:var(--acc)}
.grid{display:grid;gap:12px}
@media(min-width:560px){.grid.two{grid-template-columns:1fr 1fr}}
.kv{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv .k{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);min-width:96px}
.kv .v{font-weight:600}
ul.lista{margin:0 0 12px;padding-left:20px}
ul.lista li{margin:5px 0}
table{width:100%;border-collapse:collapse;font-size:15px;margin:6px 0 12px}
td,th{padding:8px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border-top:0}
.ex{color:var(--mut);font-style:italic}
.prog{display:flex;align-items:center;gap:12px;margin:8px 0 2px}
.anel{--p:0;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
 background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--line) 0);position:relative}
.anel::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--card)}
.anel span{position:relative;z-index:1;font-weight:800;font-size:14px}
.semana{margin:22px 0 8px;display:flex;align-items:baseline;gap:8px}
.semana h2{margin:0;font-size:18px}
.semana .n{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.licao{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);
 border-bottom-width:3px;border-radius:16px;padding:13px 14px;margin-bottom:9px;font:inherit;color:inherit;cursor:pointer}
.licao:active{transform:translateY(1px)}
.licao .bol{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;
 background:color-mix(in srgb,var(--acc) 12%,var(--tile));color:var(--acc)}
.licao.feita .bol{background:var(--okbg);color:var(--ok)}
.licao .t{font-weight:700;line-height:1.3;display:block}
.licao .s{font-size:13px;color:var(--mut);margin-top:2px;display:block}
.licao.feita .t{text-decoration:none}
.licoes{margin:0}
@media(min-width:900px){
 .app{max-width:780px}
 .licoes{display:grid;grid-template-columns:1fr 1fr;gap:9px}
 .licao{margin-bottom:0;height:100%}
 h1{font-size:30px}
 .lead{font-size:19px}
 td,th{padding:9px 8px}
}
footer.rodape{margin:30px 0 10px;font-size:13px;color:var(--mut);text-align:center}
/* player */
header.pl{display:flex;align-items:center;gap:12px;padding:14px 0 8px}
.x{border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:99px;transition:width .4s}
.xp{font-weight:700;color:var(--acc);min-width:58px;text-align:right}
main#main{flex:1;padding:12px 0 24px}
.dica{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px 8px;box-shadow:var(--sh)}
.dica p,.dica li{margin:0 0 10px}.dica b{color:var(--acc)}
.dica table{width:100%;border-collapse:collapse;margin:6px 0 12px;font-size:15px}
.dica td{padding:7px 6px;border-top:1px solid var(--line)}.dica td:first-child{font-weight:600}
.opts{display:grid;gap:10px}
.opt,.tile,.pair{background:var(--tile);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;
font:inherit;color:inherit;text-align:left;cursor:pointer;transition:transform .05s}
.opt:active,.tile:active,.pair:active{transform:translateY(2px)}
.opt.sel,.pair.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--tile))}
.pair.done{opacity:.35;pointer-events:none;border-color:var(--ok)}
.pair.bad{border-color:var(--err);animation:sh .3s}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.frase{font-size:20px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.som{border:0;background:var(--acc);color:#fff;border-radius:12px;width:46px;height:46px;font-size:20px;cursor:pointer;flex:none}
.som.lento{background:var(--acc2);font-size:15px}
.linha{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:18px}
.banco{display:flex;flex-wrap:wrap;gap:8px}
.tile{padding:9px 13px}.tile.usado{visibility:hidden}
textarea{width:100%;min-height:96px;font:inherit;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--tile);color:var(--ink);resize:vertical}
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pares div{display:grid;gap:10px;align-content:start}
.mic{display:block;margin:18px auto;width:96px;height:96px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--acc) 60%,#000)}
.mic.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px color-mix(in srgb,var(--acc) 25%,transparent)}}
.ouvi{text-align:center;color:var(--mut);min-height:24px}
footer#foot{position:sticky;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));margin:0 -16px;background:var(--bg);border-top:1px solid var(--line)}
footer#foot.ok{background:var(--okbg);border-color:transparent}footer#foot.err{background:var(--errbg);border-color:transparent}
.fb{display:none;margin-bottom:12px}.fb b{font-size:18px}.fb p{margin:4px 0 0;font-size:15px}
footer#foot.ok .fb,footer#foot.err .fb{display:block}footer#foot.ok .fb b{color:var(--ok)}footer#foot.err .fb b{color:var(--err)}
.btn{width:100%;border:0;border-radius:16px;padding:15px;font:700 17px/1 inherit;letter-spacing:.04em;text-transform:uppercase;color:#fff;
background:var(--acc);box-shadow:0 4px 0 color-mix(in srgb,var(--acc) 60%,#000);cursor:pointer}
.btn:disabled{background:var(--line);color:var(--mut);box-shadow:none;cursor:default}
footer#foot.ok .btn{background:var(--ok);box-shadow:0 4px 0 #1f6e3f}footer#foot.err .btn{background:var(--err);box-shadow:0 4px 0 #9b2c2c}
.sec{background:none;border:0;color:var(--mut);width:100%;margin-top:10px;font:inherit;cursor:pointer;text-decoration:underline}
.fim{text-align:center;padding-top:12px}.fim .big{font-size:64px;margin:6px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stats div{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 6px}
.stats b{display:block;font-size:24px;color:var(--acc)}.stats span{font-size:13px;color:var(--mut)}
.erros{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15px}
.erros li{margin:6px 0}
.missao{text-align:left;background:color-mix(in srgb,var(--acc) 8%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 30%,var(--line));border-radius:16px;padding:14px 16px;margin-top:16px;font-size:15px}
#semjs{padding:30px;text-align:center}
[hidden]{display:none!important}
</style></head><body>
<div id="semjs">Abra este arquivo no navegador (Safari ou Chrome) para fazer as lições.</div>
<div class="app" id="app" hidden>
  <div id="home" class="wrap"></div>
  <div id="player" hidden>
    <header class="pl"><button class="x" id="sair" aria-label="Voltar">✕</button><div class="bar"><i id="prog"></i></div><div class="xp" id="xp">0 XP</div></header>
    <main id="main"></main>
    <footer id="foot">
      <div class="fb" id="fb"></div>
      <button class="btn" id="go" disabled>Verificar</button>
      <button class="sec" id="pular" hidden>Não posso falar agora</button>
    </footer>
  </div>
</div>
<script>
const CURSO = {"aluno": {"nome": "Bruna", "subtitulo": "Plano de inglês · 12 semanas", "voz": "en-US", "chave": "bruna", "assinatura": "Santana Melo · outubro de 2026"}, "plano": {"titulo": "Entender rápido, falar em blocos", "lead": "O seu questionário mostra uma coisa clara: você lê e escreve bem, entende quando pode reler — e trava quando o americano fala no ritmo dele. Na academia, você contou, o problema não foi a palavra: foi a rapidez. Não é falta de vocabulário. É velocidade e tradução ao mesmo tempo.", "secoes": [{"titulo": "Onde você está hoje", "html": "\n<table>\n<tr><th>O que você respondeu<\/th><th>O que isso significa<\/th><\/tr>\n<tr><td>3 a 5 anos de estudo, nenhuma prova de nível<\/td><td>Base de curso: você reconhece a estrutura, mas nunca mediu o que sabe.<\/td><\/tr>\n<tr><td>3/5 em escuta, fala, pronúncia, vocabulário e gramática; 4/5 em escrita e leitura<\/td><td>Perfil clássico <b>A2+/B1<\/b>: o olho vai na frente, o ouvido fica para trás.<\/td><\/tr>\n<tr><td>“Penso em português e traduzo na cabeça”<\/td><td>É o gargalo central. Traduzir custa de 1 a 2 segundos por frase — o tempo exato em que a conversa passa por você.<\/td><\/tr>\n<tr><td>Vergonha de errar: <b>nada<\/b><\/td><td>Raro, e é o seu maior ativo. Quem não tem medo de errar chega antes.<\/td><\/tr>\n<tr><td>Menos de 10% do dia falando inglês<\/td><td>Ainda não há pressão de imersão: o plano precisa criar a exposição que a vida ainda não criou.<\/td><\/tr>\n<tr><td>“Aula só de gramática não rola. O ideal é mudar o padrão de pensamento para associação.”<\/td><td>Você já sabia o diagnóstico. O plano segue exatamente essa tese.<\/td><\/tr>\n<\/table>"}, {"titulo": "A tese do plano", "html": "\n<p>Você não precisa de mais gramática. Precisa de três coisas, nesta ordem:<\/p>\n<ul class=\"lista\">\n<li><b>Ouvido.<\/b> Reconhecer o inglês falado como ele é de verdade: palavras coladas (<span class=\"ex\">an_apple<\/span>), letras que somem (<span class=\"ex\">I don't know<\/span> → <span class=\"ex\">I dunno<\/span>) e o ritmo que corta as sílabas fracas.<\/li>\n<li><b>Bloco pronto.<\/b> Ter na boca pedaços inteiros de frase — <span class=\"ex\">How's it going?<\/span>, <span class=\"ex\">I'm not sure, but…<\/span> — para não montar palavra por palavra.<\/li>\n<li><b>Situação real.<\/b> Usar o bloco na mesma semana, na escola das meninas, com a vizinha, na academia, no banco, na igreja.<\/li>\n<\/ul>\n<p>É a mudança de padrão que você pediu: <b>associação em vez de tradução<\/b>. Cada lição entrega o trio — situação → bloco → som — e o exercício de fala fecha o circuito.<\/p>"}, {"titulo": "Sua hora por dia", "html": "\n<table>\n<tr><th>Momento<\/th><th>Tempo<\/th><th>O que fazer<\/th><\/tr>\n<tr><td><b>Cedo<\/b>, antes de todos acordarem<\/td><td>20 min<\/td><td>A lição do dia no app. É o único bloco que exige tela e cabeça descansada.<\/td><\/tr>\n<tr><td>Na <b>casa<\/b> ou na <b>academia<\/b><\/td><td>15 min<\/td><td>Só ouvir: o áudio da lição e o podcast do dia. Sem tela, sem legenda na primeira passada.<\/td><\/tr>\n<tr><td><b>Noite<\/b>, depois que elas dormem<\/td><td>15 min<\/td><td>Falar: repita os blocos do dia com a IA por voz (ChatGPT ou Claude no modo voz) e peça correção no fim.<\/td><\/tr>\n<tr><td>Antes de dormir<\/td><td>5 min<\/td><td>Reveja os pares e a lista de erros que o app mostra no fim da lição.<\/td><\/tr>\n<tr><td><b>Fim de semana<\/b><\/td><td>40 min<\/td><td>Uma cena de série de 22 min com legenda em inglês (nunca em português) e a lição de revisão de domingo.<\/td><\/tr>\n<\/table>\n<p class=\"ex\">A hora não precisa ser corrida. Quatro blocos curtos no dia rendem mais que uma hora sentada à noite.<\/p>"}, {"titulo": "As quatro semanas", "html": "\n<table>\n<tr><th>Semana<\/th><th>Foco<\/th><th>O que sai no fim dela<\/th><\/tr>\n<tr><td><b>1<\/b><\/td><td>Ouvir no ritmo dos nativos<\/td><td>Você reconhece palavras coladas e reduções, faz small talk com vizinho e entra na escola sem travar no balcão.<\/td><\/tr>\n<tr><td><b>2<\/b><\/td><td>Falar em blocos<\/td><td>Opinião sem traduzir, passado dos verbos do dia, as vogais que denunciam o brasileiro, conversa na academia e convite de amizade.<\/td><\/tr>\n<tr><td><b>3<\/b><\/td><td>Resolver a vida<\/td><td>Banco, farmácia, médico por telefone, reunião de pais, casa e aluguel, documentos no guichê.<\/td><\/tr>\n<tr><td><b>4<\/b><\/td><td>Sua voz<\/td><td>Igreja e comunidade, falar das meninas, vocabulário emocional, gírias seguras, cinco minutos de conversa sem travar.<\/td><\/tr>\n<\/table>"}, {"titulo": "O que ouvir fora do app", "html": "\n<ul class=\"lista\">\n<li><b>Podcast:<\/b> comece pelo <i>Espresso English<\/i> (episódios de 5 a 10 min, fala clara) e migre para o <i>All Ears English<\/i> (conversa natural entre duas americanas, 15 a 20 min).<\/li>\n<li><b>Pronúncia:<\/b> canal <i>Rachel's English<\/i> no YouTube — os vídeos de vogal e de ritmo, um por dia na semana 2.<\/li>\n<li><b>Notícia falada devagar:<\/b> VOA Learning English, para o ouvido descansar.<\/li>\n<li><b>Série:<\/b> uma comédia de 22 min, legenda em inglês na primeira passada, sem legenda na segunda.<\/li>\n<\/ul>\n<p>Regra única: <b>primeira passada sempre sem ler<\/b>. Se não pegar, ouça de novo com a tartaruga antes de olhar o texto.<\/p>"}, {"titulo": "Professor: a partir da semana 5", "html": "\n<p>Você disse que topa pagar, e faz sentido — mas não agora. As quatro primeiras semanas são de ouvido e bloco, e é isso que um professor não faz por você. A partir da <b>semana 5<\/b>, uma aula de 50 minutos por semana:<\/p>\n<ul class=\"lista\">\n<li><b>Critério:<\/b> conversação, não gramática. Nativo ou nível C2, que corrija <i>por escrito no fim<\/i> e não interrompa a fala.<\/li>\n<li><b>O que levar:<\/b> a lista de erros que o app mostrou na semana. A aula é para praticar o que falhou, não para seguir livro.<\/li>\n<li><b>Onde:<\/b> plataformas de aula particular (iTalki, Preply) têm professores de conversação; confira a faixa de preço na própria plataforma antes de fechar.<\/li>\n<\/ul>\n<p>Se a grana apertar, a IA por voz cobre a maior parte do que a aula faria nesta fase.<\/p>"}, {"titulo": "Como você sabe que está funcionando", "html": "\n<ul class=\"lista\">\n<li><b>Semana 4 (checkpoint):<\/b> grave 2 minutos falando de um assunto seu, sem roteiro. Guarde o áudio.<\/li>\n<li><b>Semana 8:<\/b> ouça a gravação da semana 4. A diferença de naturalidade é a medida mais honesta que existe.<\/li>\n<li><b>No dia a dia:<\/b> três sinais de que a tradução está caindo — você responde antes de pensar, entende uma frase inteira de série sem legenda, e não precisa pedir “sorry?” na academia.<\/li>\n<li><b>Meta de 3 meses:<\/b> sustentar 5 minutos de conversa com um americano e entender conversa em velocidade normal, mesmo quando perde uma palavra.<\/li>\n<\/ul>"}, {"titulo": "Quando atrasar", "html": "\n<ul class=\"lista\">\n<li><b>Regra dos 10 minutos:<\/b> dia corrido, faça só a lição do app. Não tente compensar a hora inteira.<\/li>\n<li><b>A lição não se acumula:<\/b> siga pelo dia do calendário e deixe a atrasada para o fim de semana.<\/li>\n<li><b>Nunca dois dias sem ouvir.<\/b> O ouvido é a primeira coisa que enferruja.<\/li>\n<\/ul>"}]}, "semanas": [{"titulo": "Ouvir no ritmo dos nativos", "foco": "O inglês falado rápido: palavras coladas, letras que somem e o primeiro contato com a escola."}, {"titulo": "Falar em blocos", "foco": "Opinião, passado, vogais e ritmo, academia e amizade."}, {"titulo": "Resolver a vida", "foco": "Banco, farmácia, telefone, reunião de pais, casa e documentos."}, {"titulo": "Sua voz", "foco": "Igreja, maternidade, sentimentos, gírias e cinco minutos de conversa."}], "licoes": [{"id": "BR-01", "titulo": "Ligação entre palavras (linking) e a queda do -t", "missao": "No carro, ouça 10 minutos de um podcast americano e anote 3 pedaços que você ouviu emendados, sem traduzir.", "itens": [{"tipo": "dica", "rotulo": "Lição 1 · 1/2", "titulo": "A palavra não termina: ela emenda", "html": "<p>O inglês americano não solta palavra por palavra. A palavra que termina em consoante cola na que começa em vogal, e o ouvido brasileiro espera dois pedaços e recebe um só.<\/p><p><span class='ex'>an apple<\/span> soa /əˈnæpəl/ — \"anápou\". <span class='ex'>get up<\/span> soa /ɡɛˈɾʌp/ — \"gueráp\". <span class='ex'>turn it off<\/span> soa /ˈtɜrnɪˈɾɔf/ — \"têrni-róf\".<\/p><p>Regra prática: conte as <b>vogais fortes<\/b>, não as palavras. Cada vogal forte é uma batida; o resto é cola.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 1 · 2/2", "titulo": "A queda do -t", "html": "<p>O <b>t<\/b> entre duas vogais vira um <b>d<\/b> fraco: <span class='ex'>water<\/span> /ˈwɔɾɚ/ — \"uórer\"; <span class='ex'>a lot of<\/span> /əˈlɑɾəv/ — \"aláróv\".<\/p><p>No fim da palavra, antes de consoante, o <b>t<\/b> muitas vezes some: <span class='ex'>just a minute<\/span> → \"jus' a minute\"; <span class='ex'>next week<\/span> → \"nex' week\".<\/p><p>Não é preguiça nem fala errada: é o padrão americano. Ouvir assim é o que destrava a velocidade.<\/p>"}, {"tipo": "leitura", "titulo": "At the gym", "texto": "Hey, good morning! — Morning! How's it going? — Pretty good. I just moved here. — Nice! Where are you from? — Brazil. — Oh, nice. Do you work out here every day? — Not every day. I get up early and come before the kids wake up. — That's smart. Can you turn it off when you're done? The machine stays on. — Sure, no problem.", "glossario": [["How's it going?", "Tudo bem?"], ["I just moved here", "Acabei de me mudar para cá"], ["work out", "treinar, malhar"], ["get up", "levantar da cama"], ["turn it off", "desligar"], ["before the kids wake up", "antes de as crianças acordarem"], ["no problem", "sem problema"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa pede?", "opcoes": ["Desligar a máquina", "Ligar a máquina", "Trocar de aparelho"], "certa": 0, "explica": "turn it off = desligar; 'turn it' emenda e o -t quase some.", "audio": "Can you turn it off?"}, {"tipo": "escolha", "pergunta": "Ouça: que horas ela levantou?", "opcoes": ["Seis", "Sete", "Dez"], "certa": 0, "explica": "'got up at' emenda em /ɡɑˈɾʌpət/ e soa quase uma palavra só.", "audio": "I got up at six."}, {"tipo": "escolha", "pergunta": "Como um americano diz 'I want to go' na conversa?", "opcoes": ["I wanna go", "I want go", "I wanting go"], "certa": 0, "explica": "Na fala rápida, 'want to' vira wanna; na escrita formal fica 'want to'."}, {"tipo": "escolha", "pergunta": "Em 'water', o -t soa como…", "opcoes": ["Um d fraco", "Um t forte de 'tatu'", "Nada, desaparece"], "certa": 0, "explica": "Entre duas vogais o t vira um d fraco: /ˈwɔɾɚ/."}, {"tipo": "montar", "pergunta": "Eu levanto às seis.", "resposta": "I get up at six", "extras": ["on", "in", "do"]}, {"tipo": "montar", "pergunta": "Você pode desligar?", "resposta": "Can you turn it off", "extras": ["on", "in", "does"]}, {"tipo": "pares", "pergunta": "Ligue o pedaço ao sentido", "pares": [["an apple", "uma maçã"], ["get up", "levantar"], ["turn it off", "desligar"], ["a lot of", "muito, muitos"], ["water", "água"]]}, {"tipo": "ouvir", "texto": "I got up early today."}, {"tipo": "falar", "texto": "Could you turn it down a little?", "traducao": "Você poderia abaixar um pouco?"}], "semana": 1}, {"id": "BR-02", "titulo": "Reduções da fala rápida: whaddya, d'you, kinda", "missao": "Mande um áudio de 1 minuto para uma vizinha usando 'd'you wanna' pelo menos uma vez.", "itens": [{"tipo": "dica", "rotulo": "Lição 2 · 1/2", "titulo": "What do you vira whaddya", "html": "<p>Uma das perguntas mais comuns do inglês falado encolhe até virar uma palavra: <span class='ex'>What do you want?<\/span> → <b>Whaddya want?<\/b> /ˈwʌɾəjə/ — \"uád-ia\".<\/p><p><span class='ex'>What do you think?<\/span> → <b>Whaddya think?<\/b> /ˈwʌɾəjə ˈθɪŋk/. <span class='ex'>What do you do?<\/span> → <b>Whaddya do?<\/b><\/p><p>Quando vem 'what are you', vira <b>whatcha<\/b>: <span class='ex'>What are you doing?<\/span> → <b>Whatcha doing?<\/b> Não escreva assim; escute e reconheça.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 2 · 2/2", "titulo": "d'you, kinda, gotta", "html": "<p><b>Do you<\/b> vira <b>d'you<\/b> /dʒə/ — \"dja\": <span class='ex'>D'you wanna go?<\/span> <span class='ex'>D'you have a minute?<\/span><\/p><p><b>kind of<\/b> vira <b>kinda<\/b> /ˈkaɪndə/ — \"cainda\", no sentido de \"meio\": <span class='ex'>It's kinda cold.<\/span> E <b>got to<\/b> vira <b>gotta<\/b>: <span class='ex'>I gotta go.<\/span><\/p><p>Regra de ouro: entenda na escuta, não use na escrita.<\/p>"}, {"tipo": "leitura", "titulo": "Talking over the fence", "texto": "Hey, Bruna! Whaddya doing? — Just cleaning the garage. — D'you wanna come over for coffee later? — I'd love to. What time? — Around four. — Sounds good. Is it kinda cold outside? — Yeah, a little. Bring a jacket. — Okay, see you at four.", "glossario": [["Whaddya doing?", "O que você está fazendo?"], ["come over", "ir na casa de alguém"], ["I'd love to", "Eu adoraria"], ["around four", "por volta das quatro"], ["kinda cold", "meio frio"], ["sounds good", "combinado, parece bom"], ["bring a jacket", "leve um casaco"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele quer saber?", "opcoes": ["O que ela quer fazer hoje", "Onde ela mora", "Que horas são"], "certa": 0, "explica": "Whaddya = what do you; a pergunta é sobre o que ela quer fazer.", "audio": "Whaddya wanna do today?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ele está fazendo?", "opcoes": ["Convidando para um café", "Pedindo a conta", "Reclamando do café"], "certa": 0, "explica": "d'you = do you; 'grab some coffee' é convite para tomar um café.", "audio": "D'you wanna grab some coffee?"}, {"tipo": "escolha", "pergunta": "O que 'kinda' quer dizer?", "opcoes": ["Meio, um pouco", "Gentil", "Criança"], "certa": 0, "explica": "kinda é 'kind of', no sentido de 'meio': it's kinda cold."}, {"tipo": "escolha", "pergunta": "Na fala, 'What are you doing?' soa como…", "opcoes": ["Whatcha doing?", "What do doing?", "What you doing?"], "certa": 0, "explica": "What + are + you encolhem para whatcha."}, {"tipo": "montar", "pergunta": "O que você acha?", "resposta": "What do you think", "extras": ["does", "thing", "are"], "aceitas": ["Whaddya think"]}, {"tipo": "montar", "pergunta": "Você quer tomar um café?", "resposta": "Do you wanna grab a coffee", "extras": ["does", "some", "want"]}, {"tipo": "pares", "pergunta": "Ligue a forma escrita à forma falada", "pares": [["What do you", "Whaddya"], ["Do you", "D'you"], ["kind of", "kinda"], ["want to", "wanna"], ["got to", "gotta"]]}, {"tipo": "ouvir", "texto": "D'you wanna come with us?"}, {"tipo": "falar", "texto": "Hey, d'you wanna grab a coffee later?", "traducao": "Ei, você quer tomar um café mais tarde?"}], "semana": 1}, {"id": "BR-03", "titulo": "Small talk de vizinho: How's it going? e How about you?", "missao": "Hoje, cumprimente um vizinho com 'How's it going?' e devolva a pergunta com 'How about you?'.", "itens": [{"tipo": "dica", "rotulo": "Lição 3 · 1/2", "titulo": "How's it going?", "html": "<p>O cumprimento mais comum entre vizinhos não é 'How are you?'. É <b>How's it going?<\/b> /haʊzɪtˈɡoʊɪn/ — \"rauzit gôuin\".<\/p><p>Respostas prontas: <span class='ex'>Pretty good.<\/span> <span class='ex'>Not bad.<\/span> <span class='ex'>Can't complain.<\/span> <span class='ex'>Hangin' in there.<\/span><\/p><p>Ninguém está pedindo relatório: uma resposta de três palavras basta.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 3 · 2/2", "titulo": "Devolver a pergunta", "html": "<p>Quem só responde encerra a conversa. Devolva com <b>How about you?<\/b> ou <b>What about you?<\/b>: <span class='ex'>Pretty good, how about you?<\/span><\/p><p>Para abrir e fechar: <span class='ex'>Good to see you.<\/span> <span class='ex'>See you around.<\/span> <span class='ex'>Have a good one.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "At the mailbox", "texto": "Hey, good morning! How's it going? — Pretty good, how about you? — Not bad, can't complain. Busy week with the kids. — Tell me about it. School starts early here. — Yeah, we're still figuring it out. — Hang in there. See you around! — See you!", "glossario": [["How's it going?", "Tudo bem?"], ["Pretty good", "Bem, tudo bem"], ["Can't complain", "Não posso reclamar"], ["Tell me about it", "Nem me fale; concordo"], ["still figuring it out", "ainda se ajustando a isso"], ["Hang in there", "Aguenta firme"], ["See you around", "Até mais"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa está fazendo?", "opcoes": ["Cumprimentando", "Se despedindo", "Pedindo desculpa"], "certa": 0, "explica": "'How's it going?' é cumprimento, não despedida.", "audio": "Hey, how's it going today?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ela faz depois de responder?", "opcoes": ["Devolve a pergunta", "Muda de assunto", "Vai embora"], "certa": 0, "explica": "'how about you?' devolve a pergunta e mantém a conversa.", "audio": "Pretty good, how about you?"}, {"tipo": "escolha", "pergunta": "Alguém diz 'How's it going?'. Qual resposta mantém a conversa viva?", "opcoes": ["Pretty good, how about you?", "I am fine, thank you, and you?", "Yes."], "certa": 0, "explica": "Resposta curta mais a pergunta devolvida; a frase de livro didático soa dura."}, {"tipo": "escolha", "pergunta": "'See you around' quer dizer…", "opcoes": ["Até mais, nos vemos por aí", "Estou te vendo dar a volta", "Vejo você em volta"], "certa": 0, "explica": "É a despedida leve do dia a dia, não uma descrição de movimento."}, {"tipo": "montar", "pergunta": "Nada mal, e você?", "resposta": "Not bad, how about you", "extras": ["what", "good", "to"]}, {"tipo": "montar", "pergunta": "Bom te ver de novo.", "resposta": "Good to see you again", "extras": ["watch", "meet", "for"]}, {"tipo": "pares", "pergunta": "Ligue o cumprimento ao sentido", "pares": [["How's it going?", "Tudo bem?"], ["Pretty good", "Bem, tudo bem"], ["Not bad", "Nada mal"], ["How about you?", "E você?"], ["See you around", "Até mais"]]}, {"tipo": "ouvir", "texto": "Not bad, how about you?"}, {"tipo": "falar", "texto": "Hey, how's it going? Good to see you.", "traducao": "Ei, tudo bem? Bom te ver."}], "semana": 1}, {"id": "BR-04", "titulo": "Perguntas abertas que puxam conversa", "missao": "Na academia, faça uma pergunta aberta para alguém: 'How long have you been working out here?'", "itens": [{"tipo": "dica", "rotulo": "Lição 4 · 1/2", "titulo": "A pergunta que puxa conversa", "html": "<p>Pergunta fechada morre em sim ou não. Pergunta aberta dá assunto: <b>What do you think about…?<\/b><\/p><p><span class='ex'>What do you think about this neighborhood?<\/span> <span class='ex'>What do you think about the school?<\/span> Na fala rápida: <b>Whaddya think about…?<\/b><\/p><p>Prima dela: <span class='ex'>How do you like it here?<\/span> — \"O que você está achando daqui?\"<\/p>"}, {"tipo": "dica", "rotulo": "Lição 4 · 2/2", "titulo": "How long have you…?", "html": "<p>Para tempo que começou antes e continua até agora: <b>How long have you lived here?<\/b> /haʊ ˈlɔŋ həv jə/ — \"raulóng hâviú\".<\/p><p>Resposta com <b>for<\/b> (duração) ou <b>since<\/b> (marco): <span class='ex'>For two years.<\/span> <span class='ex'>Since 2024.<\/span><\/p><p>Evite 'How long do you live here?': soa como se a mudança fosse temporária.<\/p>"}, {"tipo": "leitura", "titulo": "At school pickup", "texto": "Hi! Are you new here? — Yeah, we moved in August. — Welcome! How long have you lived here? — For two months. My daughters go to this school. — Oh, nice. How do you like it here so far? — I like it. People are friendly. What do you think about the teachers? — Honestly, they're great. Very patient. — Good to know. Thanks!", "glossario": [["moved in", "nos mudamos para cá"], ["How long have you lived here?", "Há quanto tempo você mora aqui?"], ["so far", "até agora"], ["How do you like it here?", "O que você está achando daqui?"], ["friendly", "simpático, acolhedor"], ["patient", "paciente"], ["Good to know", "Bom saber"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ele quer saber?", "opcoes": ["Há quanto tempo ela mora ali", "Onde ela mora", "Se ela gosta da casa"], "certa": 0, "explica": "'How long have you lived' pergunta duração, não lugar.", "audio": "How long have you lived here?"}, {"tipo": "escolha", "pergunta": "Ouça: sobre o que ele pergunta?", "opcoes": ["A opinião dela sobre a escola", "O horário da escola", "O nome da escola"], "certa": 0, "explica": "'What do you think about' pede opinião, não informação prática.", "audio": "What do you think about the school?"}, {"tipo": "escolha", "pergunta": "Resposta certa para 'How long have you lived here?'", "opcoes": ["For two months", "Two months ago", "In two months"], "certa": 0, "explica": "'for' marca duração; 'ago' é passado acabado e 'in' é futuro."}, {"tipo": "escolha", "pergunta": "'How do you like it here?' significa…", "opcoes": ["O que você está achando daqui?", "Como você veio para cá?", "Há quanto tempo você está aqui?"], "certa": 0, "explica": "É convite para opinar sobre o lugar, não pergunta de trajeto nem de tempo."}, {"tipo": "montar", "pergunta": "Há quanto tempo você mora aqui?", "resposta": "How long have you lived here", "extras": ["do", "much", "living"]}, {"tipo": "montar", "pergunta": "O que você acha da escola?", "resposta": "What do you think about the school", "extras": ["on", "does", "thinking"]}, {"tipo": "pares", "pergunta": "Ligue a pergunta ao sentido", "pares": [["How long have you…?", "Há quanto tempo você…?"], ["What do you think about…?", "O que você acha de…?"], ["How do you like it here?", "O que está achando daqui?"], ["For two years", "Há dois anos"], ["Since 2024", "Desde 2024"]]}, {"tipo": "ouvir", "texto": "How do you like it here?"}, {"tipo": "falar", "texto": "How long have you been in this neighborhood?", "traducao": "Há quanto tempo você está neste bairro?"}], "semana": 1}, {"id": "BR-05", "titulo": "Falar do agora x do sempre, sem gramatiquês", "missao": "Grave 1 minuto no celular: três coisas que você está fazendo agora e três que você faz todo dia.", "itens": [{"tipo": "dica", "rotulo": "Lição 5 · 1/2", "titulo": "A foto do momento", "html": "<p>O que está acontecendo neste instante: <b>am / is / are + verbo com -ing<\/b>.<\/p><p><span class='ex'>I'm waiting for the bus.<\/span> <span class='ex'>She's talking to the teacher.<\/span><\/p><p>Marcadores que denunciam o agora: <span class='ex'>right now<\/span>, <span class='ex'>today<\/span>, <span class='ex'>this week<\/span>. É a foto do momento.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 5 · 2/2", "titulo": "O filme inteiro", "html": "<p>O que é hábito, rotina ou verdade: verbo simples, sem -ing. <span class='ex'>I work out every morning.<\/span> <span class='ex'>She goes to school here.<\/span><\/p><p>Marcadores: <span class='ex'>every day<\/span>, <span class='ex'>usually<\/span>, <span class='ex'>always<\/span>, <span class='ex'>on Mondays<\/span>.<\/p><p>Contraste: <span class='ex'>I work from home<\/span> (sempre) x <span class='ex'>I'm working from home today<\/span> (só hoje).<\/p>"}, {"tipo": "leitura", "titulo": "A voice message", "texto": "Hey, it's Bruna. I'm calling because I'm waiting for the girls at school. I usually pick them up at three, but today the teacher is talking to me about the field trip. I'm standing in the front office right now. I'll call you back in ten minutes. Bye!", "glossario": [["I'm calling because…", "Estou ligando porque…"], ["pick them up", "buscá-las"], ["field trip", "passeio escolar"], ["front office", "secretaria da escola"], ["right now", "agora mesmo"], ["call you back", "retornar a ligação"], ["usually", "normalmente"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ela está fazendo agora?", "opcoes": ["Esperando o ônibus", "Pegando o ônibus", "Perdendo o ônibus"], "certa": 0, "explica": "'I'm waiting' é ação em curso neste momento.", "audio": "I'm waiting for the bus."}, {"tipo": "escolha", "pergunta": "Ouça: quando isso acontece?", "opcoes": ["Agora", "Todo dia", "Nunca"], "certa": 0, "explica": "O -ing com 'now' indica ação acontecendo no momento da fala.", "audio": "I'm picking up the kids now."}, {"tipo": "escolha", "pergunta": "Todo dia eu treino. →", "opcoes": ["I work out every day", "I'm working out every day", "I working out every day"], "certa": 0, "explica": "Hábito marcado por 'every day' pede verbo simples: work out."}, {"tipo": "escolha", "pergunta": "Agora ela está falando com a professora. →", "opcoes": ["She's talking to the teacher now", "She talks to the teacher now", "She talking to the teacher now"], "certa": 0, "explica": "Ação de agora leva is + -ing: she's talking."}, {"tipo": "montar", "pergunta": "Estou esperando minhas filhas.", "resposta": "I'm waiting for my daughters", "extras": ["wait", "at", "her"]}, {"tipo": "montar", "pergunta": "Ela estuda aqui.", "resposta": "She goes to school here", "extras": ["going", "at", "the"]}, {"tipo": "pares", "pergunta": "Ligue o agora ao sempre", "pares": [["I'm waiting", "Estou esperando (agora)"], ["I wait", "Eu espero (sempre)"], ["every day", "todo dia"], ["right now", "agora mesmo"], ["She goes", "Ela vai (rotina)"]]}, {"tipo": "ouvir", "texto": "I'm waiting for my kids."}, {"tipo": "falar", "texto": "I'm at the gym right now. I'll call you back.", "traducao": "Estou na academia agora. Te ligo de volta."}], "semana": 1}, {"id": "BR-06", "titulo": "Revisão da semana 1 — escuta rápida e sombra (shadowing)", "missao": "Faça 5 minutos de sombra: 30 segundos de um podcast, repetindo junto 5 vezes, sem pausar.", "itens": [{"tipo": "dica", "rotulo": "Lição 6 · 1/2", "titulo": "O que é sombra", "html": "<p>Sombra (shadowing) é tocar o áudio e repetir <b>junto<\/b>, sem pausar, imitando ritmo e melodia — mesmo sem entender tudo.<\/p><p>Passos: 1) ouça uma vez inteiro; 2) volte 30 segundos e repita junto; 3) repita 5 vezes o mesmo trecho; 4) só então isole a frase difícil.<\/p><p>Não é decorar: é colar o seu ouvido no ritmo do nativo.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 6 · 2/2", "titulo": "Escuta rápida", "html": "<p>Escuta rápida não é traduzir: é pegar o tema e dois detalhes. Travou numa palavra? Larga e segue — o contexto devolve.<\/p><p>Meta da semana: reconhecer <span class='ex'>How's it going?<\/span>, <span class='ex'>whaddya<\/span>, <span class='ex'>get up<\/span> e <span class='ex'>How long have you…?<\/span> sem traduzir na cabeça.<\/p>"}, {"tipo": "leitura", "titulo": "A quick catch-up", "texto": "Hey, how's it going? — Pretty good! I'm waiting for my daughter. — How long have you been waiting? — Ten minutes. She's at soccer practice. — Nice. Whaddya think about the new coach? — He's kinda strict, but good. — Yeah, I heard that too. — Gotta go, she's coming. See you around!", "glossario": [["catch-up", "conversa rápida para se atualizar"], ["soccer practice", "treino de futebol"], ["coach", "treinador"], ["strict", "rigoroso, exigente"], ["I heard that too", "também ouvi isso"], ["Gotta go", "Tenho que ir"], ["kinda", "meio, um pouco"]]}, {"tipo": "escolha", "pergunta": "Ouça: sobre quem ele pergunta?", "opcoes": ["O treinador novo", "O professor novo", "O vizinho novo"], "certa": 0, "explica": "coach é treinador, no esporte; professor na escola é teacher.", "audio": "Whaddya think about the new coach?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ele quer saber?", "opcoes": ["Há quanto tempo ela espera", "Onde ela espera", "Com quem ela espera"], "certa": 0, "explica": "'How long have you been waiting' mede duração até agora.", "audio": "How long have you been waiting?"}, {"tipo": "escolha", "pergunta": "Qual resposta devolve a pergunta e mantém a conversa?", "opcoes": ["Not bad, how about you?", "Fine.", "I don't know."], "certa": 0, "explica": "Responde e devolve; as outras duas fecham a conversa."}, {"tipo": "escolha", "pergunta": "'I gotta go' quer dizer…", "opcoes": ["Tenho que ir", "Eu peguei", "Eu vou pegar"], "certa": 0, "explica": "gotta é a forma falada de 'got to', que aqui significa 'tenho que'."}, {"tipo": "montar", "pergunta": "Eu levanto e tomo café.", "resposta": "I get up and have coffee", "extras": ["drink", "at", "wake"]}, {"tipo": "montar", "pergunta": "O que você acha disso?", "resposta": "What do you think about it", "extras": ["on", "does", "thinks"], "aceitas": ["Whaddya think about it"]}, {"tipo": "pares", "pergunta": "Revisão: ligue o pedaço ao sentido", "pares": [["How's it going?", "Tudo bem?"], ["Whaddya think?", "O que você acha?"], ["get up", "levantar"], ["kinda", "meio, um pouco"], ["How long have you…?", "Há quanto tempo…?"]]}, {"tipo": "ouvir", "texto": "Gotta go, see you around!"}, {"tipo": "falar", "texto": "Hey, how's it going? I'm waiting for my kids, how about you?", "traducao": "Ei, tudo bem? Estou esperando minhas filhas, e você?"}], "semana": 1}, {"id": "BR-07", "titulo": "Escola das meninas: front office, bilhete e a teacher", "missao": "Na escola, use uma frase com o front office ou a teacher: 'I'm here to pick up…' ou 'She'll be absent today.'", "itens": [{"tipo": "dica", "rotulo": "Lição 7 · 1/2", "titulo": "No front office", "html": "<p>A secretaria da escola é o <b>front office<\/b>. Diga o essencial em três pedaços: quem você é, para que veio, sobre quem.<\/p><p><span class='ex'>Hi, I'm Bruna, Ana's mom.<\/span> <span class='ex'>I'm here to pick up my daughter.<\/span> <span class='ex'>I'm here to drop off her lunch.<\/span><\/p><p>Vocabulário: <b>pick up<\/b> (buscar), <b>drop off<\/b> (deixar), <b>absent<\/b> (ausente), <b>principal<\/b> (diretor).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 7 · 2/2", "titulo": "O bilhete e o recado", "html": "<p>Aviso curto de falta: <span class='ex'>Ana will be absent today. She has a doctor's appointment.<\/span> Na fala: <span class='ex'>She'll be absent today.<\/span><\/p><p><b>mom<\/b> /mɑm/ é mãe nos EUA; <b>mum<\/b> é britânico. E <b>pick up<\/b> emenda: /ˈpɪkʌp/ — \"picáp\".<\/p>"}, {"tipo": "leitura", "titulo": "At the front office", "texto": "Hi, good morning. Can I help you? — Hi, I'm Bruna, Ana's mom. I'm here to pick her up. — Sure. Let me check. She's in room 12. Do you have your ID? — Yes, here it is. — Thank you. Also, she'll be absent on Friday. — Okay, do you have a note? — Yes, I'll send an email to the teacher. — Perfect. Have a good one!", "glossario": [["front office", "secretaria da escola"], ["pick her up", "buscá-la"], ["Let me check", "Deixa eu verificar"], ["ID", "documento com foto"], ["absent", "ausente, faltando"], ["note", "bilhete, comunicado escrito"], ["Have a good one!", "Bom dia; até logo (informal)"]]}, {"tipo": "escolha", "pergunta": "Ouça: para que ela está ali?", "opcoes": ["Buscar a filha", "Matricular a filha", "Falar com a diretora"], "certa": 0, "explica": "'I'm here to pick up' diz o motivo da visita: buscar a filha.", "audio": "I'm here to pick up my daughter."}, {"tipo": "escolha", "pergunta": "Ouça: o que vai acontecer na sexta?", "opcoes": ["A menina vai faltar", "A menina vai chegar tarde", "A menina vai ao médico na escola"], "certa": 0, "explica": "absent quer dizer ausente, fora da escola naquele dia.", "audio": "She'll be absent on Friday."}, {"tipo": "escolha", "pergunta": "Como dizer 'Sou a mãe da Ana'?", "opcoes": ["I'm Ana's mom", "I'm the mom of Ana", "I have Ana"], "certa": 0, "explica": "O possessivo com 's é o jeito natural: Ana's mom."}, {"tipo": "escolha", "pergunta": "'She'll be absent today' quer dizer…", "opcoes": ["Ela vai faltar hoje", "Ela está atrasada hoje", "Ela vai sair mais cedo"], "certa": 0, "explica": "be absent é faltar; atraso seria 'she'll be late'."}, {"tipo": "montar", "pergunta": "Vim buscar minha filha.", "resposta": "I'm here to pick up my daughter", "extras": ["for", "take", "son"]}, {"tipo": "montar", "pergunta": "Ela vai faltar hoje.", "resposta": "She'll be absent today", "extras": ["miss", "is", "at"]}, {"tipo": "pares", "pergunta": "Ligue a palavra da escola ao sentido", "pares": [["front office", "secretaria"], ["pick up", "buscar"], ["drop off", "deixar"], ["absent", "ausente"], ["teacher", "professora"]]}, {"tipo": "ouvir", "texto": "My daughter is absent today."}, {"tipo": "falar", "texto": "Hi, I'm Bruna, Ana's mom. I'm here to pick her up.", "traducao": "Oi, sou a Bruna, mãe da Ana. Vim buscá-la."}], "semana": 1}, {"id": "BR-08", "titulo": "Chunks de opinião: I feel like…, To be honest…, I'm not sure, but…", "missao": "Grave um áudio de 1 minuto no WhatsApp dando sua opinião sobre a cidade, usando 'to be honest' e 'I feel like'.", "itens": [{"tipo": "dica", "rotulo": "Lição 8 · 1/2", "titulo": "Opinião em blocos prontos", "html": "<p>Nativo não monta opinião palavra por palavra: ele pesca um bloco pronto e encaixa. Estes cinco resolvem quase toda conversa:<\/p><table><tr><td><b>To be honest…<\/b><\/td><td>pra ser sincera<\/td><\/tr><tr><td><b>I feel like…<\/b><\/td><td>eu sinto que, eu acho que<\/td><\/tr><tr><td><b>I'm not sure, but…<\/b><\/td><td>não tenho certeza, mas…<\/td><\/tr><tr><td><b>The thing is…<\/b><\/td><td>o negócio é que…<\/td><\/tr><tr><td><b>I could be wrong, but…<\/b><\/td><td>posso estar errada, mas…<\/td><\/tr><\/table><p>Duas com o bloco no começo: <span class='ex'>To be honest, I love it here.<\/span> <span class='ex'>I feel like the school is great.<\/span><\/p><p>Aprenda o bloco com a vírgula junto: na hora de falar, ele sai inteiro, sem você pensar.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 8 · 2/2", "titulo": "O que vem depois do bloco", "html": "<p>Depois de <b>I feel like<\/b> vem frase completa, com sujeito e verbo: <span class='ex'>I feel like this town is quiet<\/span> (e não <i>I feel like quiet town<\/i>).<\/p><p><b>To be honest,<\/b> e <b>I'm not sure, but<\/b> abrem a frase e pedem uma pausa curta depois.<\/p><p>Na escuta os blocos voam: <b>to be honest<\/b> soa /tə bi ˈɑnəst/ — o <i>h<\/i> quase desaparece. Dois exemplos: <span class='ex'>To be honest, I'm tired.<\/span> · <span class='ex'>To be honest, it's fine.<\/span><\/p><p>E <b>I feel like<\/b> soa /aɪ ˈfiːl laɪk/, tudo grudado, sem pausa entre as três palavras.<\/p>"}, {"tipo": "leitura", "titulo": "How do you like it here?", "texto": "Jenna: So, how do you like it here so far? — Bruna: To be honest, I love it. The neighborhood is really quiet. — Jenna: Right? I feel like it's a great place for kids. — Bruna: I'm not sure, but I think the school is good too. My girls love it. — Jenna: The thing is, it gets pretty cold in January. — Bruna: I could be wrong, but I don't think it's that bad. I kind of like the cold.", "glossario": [["so far", "até agora"], ["to be honest", "pra ser sincera"], ["I feel like", "eu sinto que, eu acho que"], ["right?", "né? (pedindo concordância)"], ["the thing is", "o negócio é que"], ["pretty cold", "bem frio"], ["I could be wrong", "posso estar errada"], ["kind of", "meio, mais ou menos"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ela acha da cidade?", "opcoes": ["Que é tranquila", "Que é barulhenta", "Que é pequena demais"], "certa": 0, "explica": "'quiet' é tranquila, silenciosa; o bloco 'I feel like' abre a opinião.", "audio": "I feel like this town is quiet."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela sente daqui?", "opcoes": ["Ama morar aqui", "Quer ir embora", "Não tem opinião"], "certa": 0, "explica": "'I love it here' é amar o lugar; 'to be honest' só avisa que vem opinião sincera.", "audio": "To be honest, I love it here."}, {"tipo": "escolha", "pergunta": "I feel like ___.", "opcoes": ["the neighborhood is really quiet", "really quiet neighborhood", "that the neighborhood quiet"], "certa": 0, "explica": "Depois de 'I feel like' vem frase completa: sujeito + verbo."}, {"tipo": "escolha", "pergunta": "I'm not sure, ___ I think the school is great.", "opcoes": ["but", "and", "that"], "certa": 0, "explica": "'I'm not sure, but…' é o bloco que suaviza a opinião antes de dizer o que você acha."}, {"tipo": "montar", "pergunta": "Na minha opinião, a escola é ótima.", "resposta": "In my opinion the school is great", "extras": ["of", "are", "my"]}, {"tipo": "montar", "pergunta": "Pra ser sincera, eu amo morar aqui.", "resposta": "To be honest I love living here", "extras": ["loving", "am", "for"]}, {"tipo": "pares", "pergunta": "Ligue o bloco à tradução", "pares": [["To be honest", "pra ser sincera"], ["I feel like", "eu sinto que"], ["I'm not sure", "não tenho certeza"], ["The thing is", "o negócio é que"], ["So far", "até agora"]]}, {"tipo": "ouvir", "texto": "I feel like it's a great place."}, {"tipo": "falar", "texto": "To be honest, I feel like this neighborhood is great for kids.", "traducao": "Pra ser sincera, eu sinto que este bairro é ótimo para crianças."}], "semana": 2}, {"id": "BR-09", "titulo": "Contar o que aconteceu: passado dos verbos frequentes (went, had, got, saw)", "missao": "Grave um áudio de 1 minuto contando o seu fim de semana: três frases no passado com went, had, got ou saw.", "itens": [{"tipo": "dica", "rotulo": "Lição 9 · 1/2", "titulo": "Os cinco verbos do dia a dia", "html": "<p>Para contar o que aconteceu, cinco verbos resolvem quase tudo — e todos são irregulares:<\/p><table><tr><td><b>go → went<\/b><\/td><td>foi<\/td><\/tr><tr><td><b>have → had<\/b><\/td><td>teve, tinha<\/td><\/tr><tr><td><b>get → got<\/b><\/td><td>pegou, ficou<\/td><\/tr><tr><td><b>see → saw<\/b><\/td><td>viu<\/td><\/tr><tr><td><b>do → did<\/b><\/td><td>fez<\/td><\/tr><\/table><p>Não existe <i>goed<\/i> nem <i>seed<\/i>: decore em bloco, como palavra nova.<\/p><p><span class='ex'>I went to the store.<\/span> <span class='ex'>We had a picnic.<\/span> <span class='ex'>She saw a deer.<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 9 · 2/2", "titulo": "Negar, perguntar e o que já marca passado", "html": "<p>Com <b>did<\/b>, o verbo volta ao presente: <span class='ex'>I didn't go<\/span> (nunca <i>didn't went<\/i>) · <span class='ex'>Did you see it?<\/span><\/p><p>Palavras que já anunciam passado: <b>yesterday, last night, last week, this morning, on Saturday<\/b>.<\/p><p>Som: <b>was<\/b> é /wʌz/ e <b>were<\/b> é /wɜr/. Dois exemplos: <span class='ex'>It was fun.<\/span> · <span class='ex'>We were late.<\/span><\/p><p>Atenção: <b>said<\/b> soa /sɛd/, não 'seide'.<\/p>"}, {"tipo": "leitura", "titulo": "How was your weekend?", "texto": "Bruna: Guess what? We went to the park on Saturday. — Ana: Nice! Was it busy? — Bruna: Not bad. The girls saw a deer by the lake, and Mia got so excited. — Ana: Oh, I love that. Did you have a picnic? — Bruna: We did. Then it got cold, so we went home early. — Ana: Smart. Did you do anything on Sunday? — Bruna: Not much. We stayed home and had a quiet day.", "glossario": [["guess what", "adivinha"], ["busy", "movimentado, cheio"], ["deer", "cervo, veado"], ["by the lake", "à beira do lago"], ["so excited", "tão animada"], ["picnic", "piquenique"], ["early", "cedo"], ["not much", "nada demais"]]}, {"tipo": "escolha", "pergunta": "Ouça: onde eles foram no sábado?", "opcoes": ["Ao parque", "À escola", "À casa da Ana"], "certa": 0, "explica": "'went to the park' é o passado de 'go to the park': foram ao parque.", "audio": "We went to the park on Saturday."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela viu?", "opcoes": ["Um cervo", "Um pato", "Um carro"], "certa": 0, "explica": "'saw' é o passado de 'see' (viu); 'deer' é cervo.", "audio": "She saw a deer by the lake."}, {"tipo": "escolha", "pergunta": "Yesterday we ___ to the store.", "opcoes": ["went", "goed", "gone"], "certa": 0, "explica": "'go' é irregular: o passado é 'went', nunca 'goed'."}, {"tipo": "escolha", "pergunta": "I ___ see the trainer yesterday.", "opcoes": ["didn't", "don't", "not"], "certa": 0, "explica": "Passado negativo é 'didn't' + verbo no presente: didn't see."}, {"tipo": "montar", "pergunta": "Nós fomos ao parque no sábado.", "resposta": "We went to the park on Saturday", "extras": ["go", "in", "were"]}, {"tipo": "montar", "pergunta": "Eu não vi o treinador hoje.", "resposta": "I didn't see the trainer today", "extras": ["saw", "don't", "no"]}, {"tipo": "pares", "pergunta": "Ligue o presente ao passado", "pares": [["go", "went"], ["have", "had"], ["get", "got"], ["see", "saw"], ["do", "did"]]}, {"tipo": "ouvir", "texto": "We had a picnic by the lake."}, {"tipo": "falar", "texto": "We went to the park, and the girls saw a deer.", "traducao": "Nós fomos ao parque, e as meninas viram um cervo."}], "semana": 2}, {"id": "BR-10", "titulo": "Pronúncia: as vogais que denunciam o brasileiro (/æ/, /ʌ/, /ɜr/) e o ritmo", "missao": "Grave 30 segundos dizendo 'bad, but, bird, work' e depois 'My first day at work was not bad'; ouça e compare com o app.", "itens": [{"tipo": "dica", "rotulo": "Lição 10 · 1/2", "titulo": "/æ/ e /ʌ/: o 'a' aberto e o 'â' seco", "html": "<p><b>/æ/<\/b> é o <i>a<\/i> de <b>cat<\/b>: boca bem aberta, língua para a frente e para baixo. Não é o nosso 'é'.<\/p><p>Dois exemplos: <span class='ex'>bad<\/span> /bæd/ · <span class='ex'>man<\/span> /mæn/. Se sair 'béd', você disse <b>bed<\/b> (cama).<\/p><p><b>/ʌ/<\/b> é um 'â' curto e seco, boca relaxada, quase sem abrir: <span class='ex'>but<\/span> /bʌt/ · <span class='ex'>up<\/span> /ʌp/.<\/p><p>Contraste que muda o sentido: <span class='ex'>cut<\/span> /kʌt/ × <span class='ex'>cat<\/span> /kæt/; <span class='ex'>man<\/span> /mæn/ × <span class='ex'>men<\/span> /mɛn/.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 10 · 2/2", "titulo": "/ɜr/ e a batida da frase", "html": "<p><b>/ɜr/<\/b> é 'âr' com a língua puxada para trás. Dois exemplos: <span class='ex'>work<\/span> /wɜrk/ · <span class='ex'>first<\/span> /fɜrst/. Nada de 'uórk' nem 'fírst' — e <b>bird<\/b> é /bɜrd/, não 'bírd'.<\/p><p>O inglês bate <b>uma sílaba forte por bloco<\/b>: a tônica estica, o resto encolhe. <span class='ex'>I got up early for work<\/span> soa /aɪ ɡɑt ˈʌp ˈɜrli fər ˈwɜrk/ — 'for' vira /fər/.<\/p><p>Treine batendo palma só na sílaba forte: <span class='ex'>I GOT up EARly for WORK.<\/span> · <span class='ex'>The GIRL at the FRONT desk was NICE.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "The first day at work", "texto": "Ana: How was your first day at work? — Bruna: Not bad. I got up early and went there. — Ana: Was it busy? — Bruna: A little. The girl at the front desk was really nice. — Ana: Good. Did you have lunch? — Bruna: Yes, but it was bad. Next time I'll bring my own.", "glossario": [["not bad", "nada mal"], ["got up", "levantei, acordei"], ["busy", "movimentado"], ["front desk", "recepção"], ["nice", "simpática, agradável"], ["lunch", "almoço"], ["next time", "da próxima vez"], ["my own", "o meu (feito por mim)"]]}, {"tipo": "escolha", "pergunta": "Ouça: como era a moça da recepção?", "opcoes": ["Simpática", "Grosseira", "Apressada"], "certa": 0, "explica": "'nice' é simpática; 'front desk' é a recepção.", "audio": "The girl at the front desk was nice."}, {"tipo": "escolha", "pergunta": "Ouça: por que ela acordou cedo?", "opcoes": ["Por causa do trabalho", "Por causa da academia", "Por causa das meninas"], "certa": 0, "explica": "'got up early for work' é levantar cedo por causa do trabalho.", "audio": "I got up early for work."}, {"tipo": "escolha", "pergunta": "Qual palavra tem o som /æ/ de 'cat'?", "opcoes": ["bad", "but", "work"], "certa": 0, "explica": "bad é /bæd/; but é /bʌt/ e work é /wɜrk/."}, {"tipo": "escolha", "pergunta": "Qual palavra tem o som /ɜr/?", "opcoes": ["first", "fat", "fun"], "certa": 0, "explica": "first é /fɜrst/; fat é /fæt/ e fun é /fʌn/."}, {"tipo": "montar", "pergunta": "Meu primeiro dia de trabalho não foi ruim.", "resposta": "My first day at work was not bad", "extras": ["in", "were", "a"]}, {"tipo": "montar", "pergunta": "Ela acordou cedo para o trabalho.", "resposta": "She got up early for work", "extras": ["get", "in", "school"]}, {"tipo": "pares", "pergunta": "Ligue a palavra à tradução", "pares": [["cat", "gato"], ["cut", "cortar"], ["bird", "pássaro"], ["work", "trabalho"], ["man", "homem"]]}, {"tipo": "ouvir", "texto": "I had a bad day at work."}, {"tipo": "falar", "texto": "My first day at work was not bad. The girl at the front desk was nice.", "traducao": "Meu primeiro dia de trabalho não foi ruim. A moça da recepção foi simpática."}], "semana": 2}, {"id": "BR-11", "titulo": "Pronúncia: -ed final, plural em -s e a batida da frase", "missao": "Grave 30 segundos lendo 'worked, played, needed, books, girls' e depois conte o seu sábado em três frases no passado.", "itens": [{"tipo": "dica", "rotulo": "Lição 11 · 1/2", "titulo": "-ed tem três sons, nunca 'ed'", "html": "<p>O <b>-ed<\/b> do passado não é o 'ed' de 'pede'. Ele copia o som que vem antes:<\/p><table><tr><td><b>/t/<\/b><\/td><td>depois de som surdo: <b>worked<\/b> /wɜrkt/, <b>watched<\/b> /wɑtʃt/<\/td><\/tr><tr><td><b>/d/<\/b><\/td><td>depois de som com voz: <b>played<\/b> /pleɪd/, <b>lived<\/b> /lɪvd/<\/td><\/tr><tr><td><b>/ɪd/<\/b><\/td><td>só depois de t e d: <b>needed<\/b> /ˈnidɪd/, <b>wanted<\/b> /ˈwɑntɪd/<\/td><\/tr><\/table><p>Regra de bolso: terminou surdo, sai /t/; terminou com voz, sai /d/; só t e d ganham a sílaba extra.<\/p><p>Na frase: <span class='ex'>We worked all day.<\/span> <span class='ex'>They played outside.<\/span> <span class='ex'>She needed help.<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 11 · 2/2", "titulo": "Plural em -s e a batida da frase", "html": "<p>Mesma lógica no plural: <span class='ex'>books<\/span> /bʊks/ (/s/) · <span class='ex'>girls<\/span> /ɡɜrlz/ (/z/) · <span class='ex'>classes<\/span> /ˈklæsɪz/ (/ɪz/ depois de s, sh, ch, x).<\/p><p>E a batida: palavras de conteúdo (substantivo, verbo, adjetivo) ficam fortes; as gramaticais (the, a, to, for, and) encolhem. <span class='ex'>We WATCHED the DUCKS and WALKED HOME.<\/span><\/p><p>Duas para treinar em voz alta: <span class='ex'>The KIDS NEEDed WAter.<\/span> · <span class='ex'>We PLAYED for an HOUR.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "Saturday at the park", "texto": "Saturday was busy. The girls woke up early, and we went to the park. We played for an hour and watched the ducks. Then we walked home. The neighbors' kids joined us, and we needed water, so we stopped at the store. The bottles were cold, and the kids loved it.", "glossario": [["busy", "movimentado"], ["woke up", "acordaram"], ["played", "brincamos"], ["watched", "olhamos, assistimos"], ["ducks", "patos"], ["neighbors", "vizinhos"], ["stopped at the store", "paramos no mercado"], ["bottles", "garrafas"]]}, {"tipo": "escolha", "pergunta": "Ouça: como eles voltaram para casa?", "opcoes": ["A pé", "De carro", "De ônibus"], "certa": 0, "explica": "'walked home' é voltar a pé; o -ed de 'walked' tem som /t/.", "audio": "We walked home after the park."}, {"tipo": "escolha", "pergunta": "Ouça: o que as crianças precisavam?", "opcoes": ["Água", "Comida", "Sapatos"], "certa": 0, "explica": "'needed water' é precisavam de água; 'needed' tem -ed com som /ɪd/.", "audio": "The kids needed water."}, {"tipo": "escolha", "pergunta": "Qual palavra termina com som /ɪd/?", "opcoes": ["needed", "walked", "played"], "certa": 0, "explica": "-ed depois de t ou d ganha sílaba: needed /ˈnidɪd/."}, {"tipo": "escolha", "pergunta": "O plural de 'class' termina com som…", "opcoes": ["/ɪz/", "/s/", "/z/"], "certa": 0, "explica": "Depois de s, sh, ch, x o plural leva /ɪz/: classes /ˈklæsɪz/."}, {"tipo": "montar", "pergunta": "Nós brincamos no parque por uma hora.", "resposta": "We played in the park for an hour", "extras": ["play", "on", "a"]}, {"tipo": "montar", "pergunta": "As crianças precisavam de água.", "resposta": "The kids needed water", "extras": ["need", "in", "the"]}, {"tipo": "pares", "pergunta": "Ligue a palavra ao som do fim", "pares": [["walked", "som /t/"], ["played", "som /d/"], ["needed", "som /ɪd/"], ["books", "som /s/"], ["girls", "som /z/"]]}, {"tipo": "ouvir", "texto": "We watched the ducks and walked home."}, {"tipo": "falar", "texto": "We played for an hour and then walked home.", "traducao": "Nós brincamos por uma hora e depois voltamos a pé."}], "semana": 2}, {"id": "BR-12", "titulo": "Academia: equipamento, instrução do treinador, Can I get a spot?", "missao": "Na próxima ida à academia, peça 'Can I get a spot?' de verdade e grave 30 segundos contando como foi.", "itens": [{"tipo": "dica", "rotulo": "Lição 12 · 1/2", "titulo": "O nome do que está na sua frente", "html": "<p>Sem o nome do equipamento, você trava. Estes seis bastam:<\/p><table><tr><td><b>treadmill<\/b><\/td><td>esteira<\/td><\/tr><tr><td><b>weights<\/b><\/td><td>pesos<\/td><\/tr><tr><td><b>dumbbell<\/b><\/td><td>halter<\/td><\/tr><tr><td><b>bench<\/b><\/td><td>banco<\/td><\/tr><tr><td><b>mat<\/b><\/td><td>colchonete<\/td><\/tr><tr><td><b>locker room<\/b><\/td><td>vestiário<\/td><\/tr><\/table><p>Com isso, meia frase resolve: <span class='ex'>Is this machine free?<\/span> · <span class='ex'>Where are the dumbbells?<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 12 · 2/2", "titulo": "O 'spot' e a fala do treinador", "html": "<p><b>Can I get a spot?<\/b> quer dizer: pode ficar de olho em mim, me dar segurança no exercício pesado? É o pedido mais comum da academia americana.<\/p><p>Outras prontas: <span class='ex'>Can you show me how this works?<\/span> · <span class='ex'>How many sets do you have left?<\/span> · <span class='ex'>I'm done with this one.<\/span><\/p><p>O treinador responde curto: <span class='ex'>Keep your back straight.<\/span> <span class='ex'>Go slow on the way down.<\/span> <span class='ex'>Three sets of ten.<\/span><\/p><p>Som: <b>can I<\/b> gruda e vira /kənaɪ/. Dois exemplos: <span class='ex'>Can I get a spot?<\/span> /kənaɪ ɡɛt ə ˈspɑt/ · <span class='ex'>Can I ask you something?<\/span><\/p>"}, {"tipo": "leitura", "titulo": "At the gym", "texto": "Bruna: Excuse me, is this machine free? — Trainer: Yeah, it's all yours. Need a hand? — Bruna: Kind of. Can you show me how it works? — Trainer: Sure. Sit down, keep your back straight, and go slow on the way down. — Bruna: Got it. How many sets should I do? — Trainer: Three sets of ten. If you go heavy, ask me for a spot. — Bruna: Thanks. Can I get a spot on the bench later? — Trainer: Any time.", "glossario": [["free", "livre, desocupado"], ["need a hand", "precisa de ajuda"], ["how it works", "como funciona"], ["keep your back straight", "mantenha as costas retas"], ["go slow", "vá devagar"], ["sets", "séries"], ["heavy", "pesado"], ["spot", "ajuda de segurança no exercício"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ela quer saber?", "opcoes": ["Se o aparelho está livre", "Quanto custa", "Se está quebrado"], "certa": 0, "explica": "'free' aqui é livre, desocupado — não é 'grátis' nem 'de graça'.", "audio": "Is this machine free?"}, {"tipo": "escolha", "pergunta": "Ouça: o que o treinador pede?", "opcoes": ["Manter as costas retas", "Correr mais rápido", "Soltar o peso"], "certa": 0, "explica": "'keep your back straight' é a instrução clássica de postura.", "audio": "Keep your back straight."}, {"tipo": "escolha", "pergunta": "___ I get a spot, please?", "opcoes": ["Can", "Do", "Am"], "certa": 0, "explica": "Pedido com 'can': Can I get a spot?"}, {"tipo": "escolha", "pergunta": "How many ___ do you have left?", "opcoes": ["sets", "set", "rep"], "certa": 0, "explica": "'How many' pede plural: sets. 'rep' é repetição, que não é o que a frase pede aqui."}, {"tipo": "montar", "pergunta": "Você pode me mostrar como isso funciona?", "resposta": "Can you show me how this works", "extras": ["do", "what", "working"]}, {"tipo": "montar", "pergunta": "Pode me dar uma ajuda no banco?", "resposta": "Can I get a spot on the bench", "extras": ["do", "in", "give"]}, {"tipo": "pares", "pergunta": "Ligue o equipamento ao nome em português", "pares": [["treadmill", "esteira"], ["dumbbell", "halter"], ["bench", "banco"], ["locker room", "vestiário"], ["set", "série"]]}, {"tipo": "ouvir", "texto": "Three sets of ten. Go slow."}, {"tipo": "falar", "texto": "Is this machine free? Can you show me how it works?", "traducao": "Este aparelho está livre? Você pode me mostrar como funciona?"}], "semana": 2}, {"id": "BR-13", "titulo": "Revisão da semana 2 — sombra de diálogo + erros que voltaram", "missao": "Faça a sombra de 30 segundos em cima do áudio do diálogo da lição: três rodadas, sem pausar.", "itens": [{"tipo": "dica", "rotulo": "Lição 13 · 1/2", "titulo": "O que voltou esta semana", "html": "<p>Hoje não há ponto novo: tudo aqui saiu das lições 8 a 12. Errou? Volte à lição do item.<\/p><table><tr><td>opinião<\/td><td>To be honest… · I feel like… · I'm not sure, but…<\/td><\/tr><tr><td>passado<\/td><td>went · had · got · saw · didn't + verbo<\/td><\/tr><tr><td>vogais<\/td><td>/æ/ bad · /ʌ/ but · /ɜr/ work<\/td><\/tr><tr><td>-ed e plural<\/td><td>worked /t/ · played /d/ · needed /ɪd/ · girls /z/<\/td><\/tr><tr><td>academia<\/td><td>sets · bench · Can I get a spot?<\/td><\/tr><\/table><p>Com três itens da semana numa frase só: <span class='ex'>To be honest, I went to the gym and needed a spot.<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 13 · 2/2", "titulo": "Como fazer sombra", "html": "<p><b>Sombra (shadowing)<\/b>: toque o áudio e repita <b>junto<\/b>, em cima da voz, sem pausar. Não é repetir depois — é falar ao mesmo tempo.<\/p><p>Três rodadas: 1) só ouvir; 2) falar junto imitando a melodia; 3) falar junto sem olhar o texto.<\/p><p>Não entendeu uma palavra? Deixe passar e continue. O alvo é o ritmo, não a tradução.<\/p><p>Duas frases da semana para a sombra: <span class='ex'>To be honest, I feel like it's great.<\/span> · <span class='ex'>I needed a spot on the bench.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "How was your week?", "texto": "Jenna: How was your week? — Bruna: Busy. I went to the gym three times, and I had my first training session. — Jenna: Nice! To be honest, I feel like the gym here is pretty good. — Bruna: I'm not sure, but I think so too. The trainer showed me the machines, and I got a spot on the bench. — Jenna: Did you like it? — Bruna: I loved it. The only thing is, my back hurts a little. I could be wrong, but I think I went too heavy.", "glossario": [["training session", "treino com personal"], ["pretty good", "bem bom"], ["I think so too", "também acho"], ["showed me", "me mostrou"], ["hurts", "dói"], ["too heavy", "pesado demais"], ["the only thing is", "o único problema é"]]}, {"tipo": "escolha", "pergunta": "Ouça: quantas vezes ela foi à academia?", "opcoes": ["Três", "Duas", "Uma"], "certa": 0, "explica": "'three times' é três vezes; 'went' é o passado de 'go'.", "audio": "I went to the gym three times."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela acha da academia?", "opcoes": ["Acha ótima", "Acha ruim", "Não sabe"], "certa": 0, "explica": "'I feel like it's great' é a opinião; 'to be honest' só anuncia que vem opinião sincera.", "audio": "To be honest, I feel like it's great."}, {"tipo": "escolha", "pergunta": "I ___ to the gym yesterday.", "opcoes": ["went", "goed", "gone"], "certa": 0, "explica": "'go' é irregular: passado é 'went'."}, {"tipo": "escolha", "pergunta": "Qual palavra tem o som /æ/?", "opcoes": ["back", "book", "bird"], "certa": 0, "explica": "back é /bæk/; book é /bʊk/ e bird é /bɜrd/."}, {"tipo": "montar", "pergunta": "Pra ser sincera, eu fui à academia três vezes.", "resposta": "To be honest I went to the gym three times", "extras": ["go", "in", "am"]}, {"tipo": "montar", "pergunta": "Eu precisei de ajuda no banco.", "resposta": "I needed a spot on the bench", "extras": ["need", "in", "at"]}, {"tipo": "pares", "pergunta": "Ligue a expressão da semana ao sentido", "pares": [["went", "foi"], ["had", "teve"], ["needed", "precisou"], ["To be honest", "pra ser sincera"], ["Can I get a spot?", "pode me dar uma ajuda?"]]}, {"tipo": "ouvir", "texto": "I needed a spot on the bench."}, {"tipo": "falar", "texto": "To be honest, I feel like the gym here is pretty good.", "traducao": "Pra ser sincera, eu acho que a academia daqui é bem boa."}], "semana": 2}, {"id": "BR-14", "titulo": "Amizade: convidar, aceitar, recusar sem ofender, marcar café", "missao": "Convide uma vizinha para um café em inglês esta semana e grave 30 segundos contando o que ela respondeu.", "itens": [{"tipo": "dica", "rotulo": "Lição 14 · 1/2", "titulo": "Convidar: pergunta macia", "html": "<p>Convite americano quase nunca é ordem; é pergunta com saída. Os blocos:<\/p><table><tr><td><b>Do you wanna grab a coffee?<\/b><\/td><td>quer tomar um café?<\/td><\/tr><tr><td><b>Are you free on Friday?<\/b><\/td><td>você está livre na sexta?<\/td><\/tr><tr><td><b>We're having people over.<\/b><\/td><td>vai ter gente lá em casa.<\/td><\/tr><tr><td><b>You should come!<\/b><\/td><td>você tinha que vir!<\/td><\/tr><tr><td><b>Let me know if you're in.<\/b><\/td><td>me avisa se você topa.<\/td><\/tr><\/table><p><b>grab a coffee<\/b> é tomar um café rápido; <b>hang out<\/b> é sair, ficar junto, sem programa fixo.<\/p><p><b>wanna<\/b> é a fala de <i>want to<\/i> (a redução da lição 2) e sai sempre assim no convite.<\/p><p>Na conversa: <span class='ex'>Are you free on Friday?<\/span> <span class='ex'>Let me know if you're in.<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 14 · 2/2", "titulo": "Aceitar e recusar sem ofender", "html": "<p>Aceitar: <span class='ex'>I'd love to.<\/span> <span class='ex'>Count me in.<\/span> <span class='ex'>Sounds great.<\/span><\/p><p>Recusar: nunca um 'no' seco. Sempre motivo + um 'depois': <span class='ex'>I wish I could, but I have the girls that night.<\/span> <span class='ex'>Rain check?<\/span> (deixa pra próxima?)<\/p><p>Som: <b>I'd love to<\/b> soa /aɪd ˈlʌv tə/ — o 'd' quase some e o 'to' vira /tə/. Dois exemplos: <span class='ex'>I'd love to go.<\/span> · <span class='ex'>I'd love to try.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "Coffee on Friday", "texto": "Jenna: Hey, a few of us are getting coffee on Friday morning. Do you wanna come? — Bruna: I'd love to. What time? — Jenna: Around nine, after drop-off. — Bruna: Perfect. The girls are in school by then. — Jenna: Great. And on Saturday, we're having people over. Nothing fancy, just burgers. — Bruna: I wish I could, but Rodolfo works Saturday. Rain check? — Jenna: Of course. Next time, then.", "glossario": [["a few of us", "alguns de nós"], ["drop-off", "deixar as crianças na escola"], ["by then", "até lá"], ["people over", "gente em casa"], ["nothing fancy", "nada chique"], ["rain check", "deixa pra próxima"], ["of course", "claro"]]}, {"tipo": "escolha", "pergunta": "Ouça: para o que ela está convidando?", "opcoes": ["Tomar um café", "Almoçar", "Correr no parque"], "certa": 0, "explica": "'grab a coffee' é o convite de café; 'wanna' é 'want to' na fala.", "audio": "Do you wanna grab a coffee?"}, {"tipo": "escolha", "pergunta": "Ouça: o que ela está fazendo?", "opcoes": ["Recusando com gentileza", "Aceitando o convite", "Reclamando do convite"], "certa": 0, "explica": "'I wish I could, but…' é a recusa educada: lamenta e dá o motivo.", "audio": "I wish I could, but I can't."}, {"tipo": "escolha", "pergunta": "___ you free on Friday?", "opcoes": ["Are", "Do", "Is"], "certa": 0, "explica": "Com adjetivo (free) a pergunta usa to be: Are you free?"}, {"tipo": "escolha", "pergunta": "Qual recusa soa natural para um americano?", "opcoes": ["I wish I could, but I have the girls.", "No.", "I can't. Bye."], "certa": 0, "explica": "Recusa americana vem com motivo e convite para a próxima; 'no' seco fecha a porta."}, {"tipo": "montar", "pergunta": "Você quer tomar um café na sexta?", "resposta": "Do you wanna grab a coffee on Friday", "extras": ["are", "in", "took"]}, {"tipo": "montar", "pergunta": "Eu adoraria, mas não posso.", "resposta": "I'd love to but I can't", "extras": ["will", "don't", "am"]}, {"tipo": "pares", "pergunta": "Ligue a expressão ao sentido", "pares": [["grab a coffee", "tomar um café"], ["hang out", "sair juntos"], ["rain check", "deixa pra próxima"], ["people over", "gente em casa"], ["of course", "claro"]]}, {"tipo": "ouvir", "texto": "A few of us are getting coffee."}, {"tipo": "falar", "texto": "I'd love to, but I can't this time. Rain check?", "traducao": "Eu adoraria, mas desta vez não posso. Deixa pra próxima?"}], "semana": 2}, {"id": "BR-15", "titulo": "Banco: abrir conta, cartão, I'd like to… e Could you…?", "missao": "Fora do app: abra o app do seu banco e encontre na tela as palavras checking, balance e debit; anote ao lado de cada uma o que ela quer dizer.", "itens": [{"tipo": "dica", "rotulo": "Lição 1 · 1/2", "titulo": "As três fórmulas que abrem qualquer porta", "html": "<p>Burocracia nos EUA se resolve com três aberturas. Decore como bloco, não palavra por palavra:<\/p><table><tr><td><b>I'd like to…<\/b><\/td><td>Eu gostaria de…<\/td><\/tr><tr><td><b>Could you…?<\/b><\/td><td>Você poderia…?<\/td><\/tr><tr><td><b>I'm calling about…<\/b><\/td><td>Estou ligando sobre…<\/td><\/tr><\/table><p><span class='ex'>I'd like to open a checking account.<\/span> · <span class='ex'>Could you help me with this form?<\/span> · <span class='ex'>I'm calling about my card.<\/span><\/p><p><b>I'd<\/b> é <i>I would<\/i> encolhido e soa /aɪd/ — um \"ái\" curto, com o \"d\" colando no <b>like<\/b>: <span class='ex'>I'd like to open an account<\/span> · <span class='ex'>I'd like a debit card<\/span>.<\/p><p>Nunca diga <i>I like to open<\/i>: sem o \"d\" você está dizendo que <b>gosta<\/b> de abrir conta.<\/p><p>No guichê, <i>Give me<\/i> e <i>I want<\/i> soam como ordem. <b>Could you<\/b> é o tom certo.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 1 · 2/2", "titulo": "As palavras do banco", "html": "<p>Você não precisa entender tudo o que o funcionário fala. Precisa reconhecer as palavras e pedir o que quer.<\/p><table><tr><td><b>checking account<\/b><\/td><td>conta corrente<\/td><\/tr><tr><td><b>savings account<\/b><\/td><td>conta poupança<\/td><\/tr><tr><td><b>debit card<\/b><\/td><td>cartão de débito<\/td><\/tr><tr><td><b>balance<\/b><\/td><td>saldo<\/td><\/tr><tr><td><b>routing number<\/b><\/td><td>número de roteamento do banco<\/td><\/tr><tr><td><b>teller<\/b><\/td><td>caixa (a pessoa)<\/td><\/tr><tr><td><b>withdraw<\/b><\/td><td>sacar<\/td><\/tr><tr><td><b>fee<\/b><\/td><td>tarifa<\/td><\/tr><\/table><p>Som que denuncia o brasileiro: <b>account<\/b> bate forte na segunda sílaba — /əˈkaʊnt/, \"acáunt\" — e <b>balance<\/b> é /ˈbæləns/, \"bélans\", com o \"a\" de <i>cat<\/i>.<\/p><p>Se o funcionário acelerar, não sorria sem entender. Use o bloco: <span class='ex'>Sorry, could you say that again, please?<\/span><\/p>"}, {"tipo": "leitura", "titulo": "Opening a checking account", "texto": "Good morning. What can I do for you? — Hi, I'd like to open a checking account. — Sure. Do you have your ID and your Social Security number? — Yes, I do. Here you go. — Great. Do you want a debit card too? — Yes, please. And could you tell me the monthly fee? — It's free if you keep a balance of five hundred dollars. — Okay, that works for me.", "glossario": [["checking account", "conta corrente"], ["Social Security number", "número da Previdência social americana"], ["debit card", "cartão de débito"], ["monthly fee", "tarifa mensal"], ["balance", "saldo"], ["Here you go", "Aqui está"], ["That works for me", "Para mim serve"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa quer fazer?", "opcoes": ["Abrir uma conta poupança", "Fechar a conta", "Pedir um cartão de crédito"], "certa": 0, "audio": "I'd like to open a savings account.", "explica": "savings account é a poupança; o som \"sêivings\" é a chave."}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa pede?", "opcoes": ["O saldo da conta", "Um cartão novo", "Uma transferência"], "certa": 0, "audio": "Could you check my balance, please?", "explica": "check my balance = conferir o saldo."}, {"tipo": "escolha", "pergunta": "Escolha a forma mais educada de pedir:", "opcoes": ["Could you tell me the monthly fee?", "Tell me the monthly fee.", "You tell me the fee?"], "certa": 0, "explica": "Pedido no guichê começa com Could you + verbo; as outras duas soam como ordem."}, {"tipo": "escolha", "pergunta": "I'd like ___ open a savings account.", "opcoes": ["to", "for", "of"], "certa": 0, "explica": "I'd like sempre pede to antes do verbo: I'd like to open."}, {"tipo": "montar", "pergunta": "Eu gostaria de abrir uma conta corrente.", "resposta": "I'd like to open a checking account", "extras": ["want", "make", "Could"], "aceitas": ["I would like to open a checking account"]}, {"tipo": "montar", "pergunta": "Você poderia me ajudar com isto?", "resposta": "Could you help me with this", "extras": ["Would", "helps", "for"], "aceitas": ["Could you help me with this?"]}, {"tipo": "pares", "pergunta": "Ligue a palavra do banco à tradução", "pares": [["checking account", "conta corrente"], ["savings account", "conta poupança"], ["debit card", "cartão de débito"], ["balance", "saldo"], ["teller", "caixa (a pessoa)"], ["withdraw", "sacar"]]}, {"tipo": "ouvir", "texto": "I'd like to open a checking account."}, {"tipo": "falar", "texto": "I'd like to open a checking account. Could you help me?", "traducao": "Eu gostaria de abrir uma conta corrente. Você poderia me ajudar?"}], "semana": 3}, {"id": "BR-16", "titulo": "Farmácia e médico: sintomas e marcar por telefone", "missao": "Fora do app: ligue para a farmácia e pergunte o horário de funcionamento usando \"I'm calling to…\"; se der ocupado, repita a mesma frase sem mudar nada.", "itens": [{"tipo": "dica", "rotulo": "Lição 2 · 1/2", "titulo": "Sintoma vem em pedaço pronto", "html": "<p>Em inglês, sintoma não se traduz palavra por palavra: vem colado em <b>I have a…<\/b>.<\/p><table><tr><td>I have a headache.<\/td><td>dor de cabeça<\/td><\/tr><tr><td>I have a sore throat.<\/td><td>dor de garganta<\/td><\/tr><tr><td>I have a fever.<\/td><td>febre<\/td><\/tr><tr><td>I have a cough.<\/td><td>tosse<\/td><\/tr><tr><td>I have a runny nose.<\/td><td>coriza<\/td><\/tr><tr><td>I have a stomachache.<\/td><td>dor de barriga<\/td><\/tr><\/table><p>Não diga <i>I have pain in my head<\/i>: soa tradução literal. Se dói num lugar específico, use o verbo <b>hurt<\/b>: <span class='ex'>My back hurts<\/span> · <span class='ex'>It hurts when I swallow<\/span>.<\/p><p><b>sore<\/b> é /sɔr/, \"sór\", com o mesmo som de <b>door<\/b> /dɔr/ — dor de machucado ou inflamação, não dói de cansaço.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 2 · 2/2", "titulo": "A ligação de marcar consulta em quatro falas", "html": "<p>A ligação inteira cabe em quatro blocos. Fale devagar; pausa não é vergonha.<\/p><table><tr><td>abrindo<\/td><td><b>Hi, I'm calling to make an appointment.<\/b><\/td><\/tr><tr><td>o problema<\/td><td><b>I have a sore throat and a fever.<\/b><\/td><\/tr><tr><td>aceitando<\/td><td><b>Today at three works for me.<\/b><\/td><\/tr><tr><td>fechando<\/td><td><b>I'll bring my ID and the prescription. Thank you.<\/b><\/td><\/tr><\/table><p><b>appointment<\/b> trava todo brasileiro: /əˈpɔɪnmənt/, \"apôinment\" — o \"o\" depois do \"p\" quase some. E <b>medicine<\/b> tem três sílabas na fala, não quatro: /ˈmɛdəsɪn/, \"médssin\".<\/p><p>Guarde também <span class='ex'>Do you take my insurance?<\/span> — é o que se pergunta antes de marcar.<\/p>"}, {"tipo": "leitura", "titulo": "Calling the clinic", "texto": "Good morning, Riverside Family Clinic. — Hi, I'm calling to make an appointment. I have a sore throat and a fever. — Okay. Can you come in today at three? — Yes, I can. Do you take my insurance? — What's your insurance company? — Blue Cross. — Yes, we do. Please bring your ID and your insurance card. — I will. See you at three.", "glossario": [["I'm calling to…", "Estou ligando para…"], ["make an appointment", "marcar uma consulta"], ["sore throat", "dor de garganta"], ["fever", "febre"], ["insurance", "plano de saúde"], ["Can you come in today?", "Você pode vir hoje?"], ["bring", "trazer"]]}, {"tipo": "escolha", "pergunta": "Ouça: quais sintomas a pessoa tem?", "opcoes": ["Dor de garganta e febre", "Dor de cabeça e tosse", "Dor de barriga e coriza"], "certa": 0, "audio": "I have a sore throat and a fever.", "explica": "sore throat = dor de garganta; fever = febre."}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa quer?", "opcoes": ["Marcar uma consulta", "Cancelar a consulta", "Pagar a conta"], "certa": 0, "audio": "I'd like to make an appointment.", "explica": "make an appointment = marcar horário."}, {"tipo": "escolha", "pergunta": "I have a ___.", "opcoes": ["sore throat", "throat sore", "pain throat"], "certa": 0, "explica": "O adjetivo vem antes: sore throat, não \"garganta dolorida\" traduzida."}, {"tipo": "escolha", "pergunta": "I'm calling ___ make an appointment.", "opcoes": ["to", "for", "about"], "certa": 0, "explica": "I'm calling to + verbo = estou ligando para (fazer algo)."}, {"tipo": "montar", "pergunta": "Eu tenho dor de garganta.", "resposta": "I have a sore throat", "extras": ["am", "pain", "head"], "aceitas": ["I have a sore throat."]}, {"tipo": "montar", "pergunta": "Eu gostaria de marcar uma consulta.", "resposta": "I'd like to make an appointment", "extras": ["do", "take", "Could"], "aceitas": ["I would like to make an appointment"]}, {"tipo": "pares", "pergunta": "Ligue o sintoma à tradução", "pares": [["headache", "dor de cabeça"], ["sore throat", "dor de garganta"], ["fever", "febre"], ["cough", "tosse"], ["runny nose", "coriza"], ["prescription", "receita médica"]]}, {"tipo": "ouvir", "texto": "I have a headache and a cough."}, {"tipo": "falar", "texto": "I'm calling to make an appointment. I have a fever.", "traducao": "Estou ligando para marcar uma consulta. Eu estou com febre."}], "semana": 3}, {"id": "BR-17", "titulo": "Telefone: soletrar o nome, pedir repetição, encerrar a ligação", "missao": "Fora do app: grave no celular você soletrando seu nome completo em inglês, letra por letra, três vezes; ouça e corrija a letra que sair errada.", "itens": [{"tipo": "dica", "rotulo": "Lição 3 · 1/2", "titulo": "Pedir repetição é técnica, não vergonha", "html": "<p>Americano no telefone fala rápido e sem ver sua boca. Peça repetição quantas vezes precisar — é o
