 que nativo faz também.<\/p><table><tr><td><b>Sorry, I didn't catch that.<\/b><\/td><td>Desculpe, não peguei.<\/td><\/tr><tr><td><b>Could you say that again, please?<\/b><\/td><td>Pode repetir?<\/td><\/tr><tr><td><b>Could you speak a little slower?<\/b><\/td><td>Pode falar um pouco mais devagar?<\/td><\/tr><tr><td><b>Can I have your number?<\/b><\/td><td>Pode me passar seu número?<\/td><\/tr><tr><td><b>Let me read that back to you.<\/b><\/td><td>Deixa eu repetir para você.<\/td><\/tr><\/table><p>Na fala, <b>didn't catch that<\/b> vira um só bloco: /dɪdənt ˈkætʃ ðæt/, \"díren-cátch-That\". E <b>Could you<\/b> colado soa /kʊdʒə/, \"cudja\": <span class='ex'>Could you repeat that?<\/span> · <span class='ex'>Could you spell it?<\/span><\/p><p>Número de protocolo e telefone se ditam <b>dígito por dígito<\/b>, nunca \"quinhentos e doze\". Depois confirme com <span class='ex'>Let me read that back to you.<\/span><\/p>"}, {"tipo": "dica", "rotulo": "Lição 3 · 2/2", "titulo": "Soletrar: as letras que o brasileiro troca", "html": "<p>Soletrar o nome é obrigatório em banco, escola, médico e DMV. Primeiro, a pergunta pronta: <span class='ex'>How do you spell that?<\/span><\/p><table><tr><td><b>A<\/b> /eɪ/ \"êi\"<\/td><td><b>E<\/b> /iː/ \"í\"<\/td><td><b>I<\/b> /aɪ/ \"ái\"<\/td><\/tr><tr><td><b>B<\/b> /biː/ \"bí\"<\/td><td><b>V<\/b> /viː/ \"ví\"<\/td><td><b>W<\/b> /ˈdʌbəlju/ \"dábliu\"<\/td><\/tr><tr><td><b>G<\/b> /dʒiː/ \"djí\"<\/td><td><b>J<\/b> /dʒeɪ/ \"djêi\"<\/td><td><b>Z<\/b> /ziː/ \"zí\"<\/td><\/tr><\/table><p><b>A<\/b>, <b>E<\/b> e <b>I<\/b> são o maior perigo: em inglês E é \"í\" e I é \"ái\" — o contrário do que o ouvido brasileiro espera.<\/p><p>Se a letra não passar, use a referência americana: <span class='ex'>B as in boy<\/span> · <span class='ex'>V as in Victor<\/span>.<\/p><p>Fechando a ligação: <span class='ex'>Thanks for calling<\/span> (eles) e <span class='ex'>Thank you for your help. Have a good one.<\/span> (você).<\/p>"}, {"tipo": "leitura", "titulo": "A call to the doctor's office", "texto": "Hello, this is Dr. Lee's office. — Hi, this is Bruna Almeida. I'm calling about my daughter's appointment. — Sorry, could you repeat your last name? — Sure. Almeida. A-L-M-E-I-D-A. — Got it. And your phone number? — It's five-one-two, three-four-seven, eight-nine-zero-two. — Let me read that back to you: five-one-two, three-four-seven, eight-nine-zero-two. — That's right. Thank you for your help.", "glossario": [["This is…", "Aqui é… (ao telefone)"], ["could you repeat", "você pode repetir"], ["Got it", "Entendi, anotado"], ["Let me read that back to you", "Deixa eu repetir para confirmar"], ["That's right", "Isso mesmo"], ["office", "consultório, escritório"], ["phone number", "número de telefone"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa está dizendo?", "opcoes": ["Que não entendeu e quer repetição", "Que vai desligar", "Que o número está errado"], "certa": 0, "audio": "Sorry, I didn't catch that.", "explica": "didn't catch that = não peguei o que foi dito."}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa faz?", "opcoes": ["Pede que repitam", "Dá um recado", "Cancela a consulta"], "certa": 0, "audio": "Could you repeat that, please?", "explica": "Could you repeat that, please? é o pedido de repetição."}, {"tipo": "escolha", "pergunta": "How do you ___ your name?", "opcoes": ["spell", "write", "say"], "certa": 0, "explica": "Soletrar letra por letra é spell; write é escrever à mão."}, {"tipo": "escolha", "pergunta": "Qual letra soa como \"djí\"?", "opcoes": ["G", "J", "Z"], "certa": 0, "explica": "G é /dʒiː/ (djí); J é \"djêi\" e Z é \"zí\"."}, {"tipo": "montar", "pergunta": "Você pode soletrar seu nome?", "resposta": "Could you spell your name", "extras": ["say", "letters", "Do"], "aceitas": ["Could you spell your name?"]}, {"tipo": "montar", "pergunta": "Desculpe, eu não entendi isso.", "resposta": "Sorry, I didn't catch that", "extras": ["understand", "catched", "nothing"], "aceitas": ["Sorry, I did not catch that"]}, {"tipo": "pares", "pergunta": "Ligue a fala de telefone à tradução", "pares": [["Could you repeat that?", "Você pode repetir isso?"], ["I didn't catch that", "Não entendi o que você disse"], ["Let me read that back", "Deixa eu repetir para confirmar"], ["How do you spell that?", "Como se soletra isso?"], ["Can I have your number?", "Pode me passar seu número?"], ["Thanks for calling", "Obrigado por ligar"]]}, {"tipo": "ouvir", "texto": "I didn't catch your last name."}, {"tipo": "falar", "texto": "Sorry, I didn't catch that. Could you say it again?", "traducao": "Desculpe, não entendi. Você pode dizer de novo?"}], "semana": 3}, {"id": "BR-18", "titulo": "Reunião de pais na escola (parent-teacher conference)", "missao": "Fora do app: escreva três perguntas em inglês para levar à próxima reunião de pais e leia em voz alta antes de dormir.", "itens": [{"tipo": "dica", "rotulo": "Lição 4 · 1/2", "titulo": "O vocabulário que a professora vai usar", "html": "<p>A reunião de pais se chama <b>parent-teacher conference<\/b>. Ela tem uma língua própria, e estas palavras aparecem sempre:<\/p><table><tr><td><b>report card<\/b><\/td><td>boletim<\/td><\/tr><tr><td><b>grades<\/b><\/td><td>notas<\/td><\/tr><tr><td><b>behavior<\/b><\/td><td>comportamento<\/td><\/tr><tr><td><b>homework<\/b><\/td><td>dever de casa<\/td><\/tr><tr><td><b>progress<\/b><\/td><td>progresso<\/td><\/tr><tr><td><b>reading level<\/b><\/td><td>nível de leitura<\/td><\/tr><tr><td><b>concern<\/b><\/td><td>preocupação<\/td><\/tr><\/table><p>Três frases de ouro, para levar prontas: <span class='ex'>How is she doing in class?<\/span> · <span class='ex'>Is there anything we should work on at home?<\/span> · <span class='ex'>Can you give me an example?<\/span><\/p><p>Não confunda <b>grades<\/b> (notas) com <b>degree<\/b> (diploma de faculdade). E <b>she's doing well<\/b> é o elogio padrão: \"ela está indo bem\".<\/p>"}, {"tipo": "dica", "rotulo": "Lição 4 · 2/2", "titulo": "Entender e se posicionar sem ofender", "html": "<p>A professora fala em código escolar. Se não pegou, peça o exemplo — e não acene com a cabeça sem entender.<\/p><table><tr><td><b>What do you mean by…?<\/b><\/td><td>O que você quer dizer com…?<\/td><\/tr><tr><td><b>I'm not sure I follow.<\/b><\/td><td>Não tenho certeza se entendi.<\/td><\/tr><tr><td><b>We already do that at home.<\/b><\/td><td>Isso já fazemos em casa.<\/td><\/tr><tr><td><b>We'll work on it.<\/b><\/td><td>Vamos trabalhar nisso.<\/td><\/tr><\/table><p><b>work on<\/b> é o verbo da reunião: trabalhar em, treinar. Na fala, as duas palavras grudam — <span class='ex'>work on it<\/span> soa \"uórconit\" /ˈwɜrkɑnɪt/. E <b>I'm not sure I follow<\/b> encolhe para /aɪm nɑt ʃʊr aɪ ˈfɑloʊ/, \"aim nót chur ai fálo\".<\/p><p>Concordar sem submissão: <span class='ex'>That makes sense, and at home we already…<\/span> — reconhece e acrescenta.<\/p>"}, {"tipo": "leitura", "titulo": "Parent-teacher conference", "texto": "Hi, thanks for coming. Bruna, right? — Yes. Hi, Ms. Carter. How is Emma doing in class? — She's doing well. Her reading is strong, and she's very kind with the other kids. — That's good to hear. Is there anything we should work on at home? — Yes. Her writing needs a little work. She rushes. — Okay. We'll work on that. — Great. And please keep reading with her every night. — We already do. Thank you.", "glossario": [["parent-teacher conference", "reunião de pais e professores"], ["She's doing well", "Ela está indo bem"], ["strong", "forte, bom"], ["That's good to hear", "Que bom saber"], ["work on", "trabalhar em, treinar"], ["needs a little work", "precisa melhorar um pouco"], ["rush", "fazer correndo, sem capricho"], ["keep reading", "continuar lendo"]]}, {"tipo": "escolha", "pergunta": "Ouça: como está a aluna em leitura?", "opcoes": ["Indo bem", "Com dificuldade", "Ainda não começou"], "certa": 0, "audio": "She's doing well in reading.", "explica": "doing well in reading = indo bem em leitura."}, {"tipo": "escolha", "pergunta": "Ouça: em que a menina precisa trabalhar?", "opcoes": ["Na escrita", "Na leitura", "Na matemática"], "certa": 0, "audio": "We should work on her writing.", "explica": "writing = escrita."}, {"tipo": "escolha", "pergunta": "How is she ___ in class?", "opcoes": ["doing", "making", "going"], "certa": 0, "explica": "A pergunta pronta é How is she doing in class?; \"fazendo\" aqui não é making."}, {"tipo": "escolha", "pergunta": "Is there anything we should ___ at home?", "opcoes": ["work on", "work", "make"], "certa": 0, "explica": "work on = trabalhar em algo específico; work sozinho é trabalhar em geral."}, {"tipo": "montar", "pergunta": "Como ela está indo na aula?", "resposta": "How is she doing in class", "extras": ["does", "go", "on"], "aceitas": ["How's she doing in class"]}, {"tipo": "montar", "pergunta": "Há algo em que devemos trabalhar em casa?", "resposta": "Is there anything we should work on", "extras": ["do", "make", "at"], "aceitas": ["Is there anything we should work on?"]}, {"tipo": "pares", "pergunta": "Ligue a palavra da escola à tradução", "pares": [["report card", "boletim"], ["grades", "notas"], ["behavior", "comportamento"], ["homework", "dever de casa"], ["progress", "progresso"], ["parent-teacher conference", "reunião de pais e professores"]]}, {"tipo": "ouvir", "texto": "She's doing well in math."}, {"tipo": "falar", "texto": "How is she doing in class? Is there anything we should work on at home?", "traducao": "Como ela está indo na aula? Há algo em que devemos trabalhar em casa?"}], "semana": 3}, {"id": "BR-19", "titulo": "Casa e aluguel: manutenção e agendar visita", "missao": "Fora do app: escreva no celular a frase exata que você diria hoje se o ar-condicionado quebrasse, com o número do seu apartamento dentro dela.", "itens": [{"tipo": "dica", "rotulo": "Lição 5 · 1/2", "titulo": "O que quebrou, em três modelos", "html": "<p>Manutenção se resolve dizendo <b>o que<\/b> e <b>como<\/b> está. Três modelos cobrem quase tudo:<\/p><table><tr><td><b>isn't working<\/b><\/td><td>The AC isn't working.<\/td><\/tr><tr><td><b>won't turn on<\/b><\/td><td>The heater won't turn on.<\/td><\/tr><tr><td><b>is leaking<\/b><\/td><td>The sink is leaking.<\/td><\/tr><\/table><p>Para dar detalhe: <span class='ex'>It turns on, but it doesn't get cold<\/span> · <span class='ex'>There's a leak under the sink<\/span> · <span class='ex'>The toilet keeps running<\/span>.<\/p><p>Quem conserta: <b>plumber<\/b> (encanador), <b>handyman<\/b> (faz-tudo), <b>maintenance<\/b> (a equipe do prédio).<\/p><p>Cuidado com <b>leak<\/b> /liːk/, com \"i\" longo e esticado, e <b>lick<\/b> /lɪk/, curto, que é lamber. Um som separa vazamento de vergonha.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 5 · 2/2", "titulo": "Agendar a visita", "html": "<p>Nos EUA você fala com o <b>landlord<\/b> (o dono) ou com o <b>leasing office<\/b> (a administração do prédio). O <b>lease<\/b> é o contrato.<\/p><table><tr><td>abrir<\/td><td><b>Hi, I'm calling about the AC in apartment 4B.<\/b><\/td><\/tr><tr><td>descrever<\/td><td><b>It isn't working. It doesn't get cold.<\/b><\/td><\/tr><tr><td>marcar<\/td><td><b>When can someone come by?<\/b><\/td><\/tr><tr><td>fechar<\/td><td><b>Tomorrow after five works for me. Thank you.<\/b><\/td><\/tr><\/table><p>Na fala, <b>isn't working<\/b> vira um bloco só, \"ízant uórking\" /ˈɪzənt ˈwɜrkɪŋ/, e <b>won't turn on<\/b> perde o \"t\" do meio: /woʊnt tɜrn ɑn/, \"uônt tãrn on\".<\/p><p>O número do apartamento sempre entra: é ele que faz a ligação virar serviço.<\/p>"}, {"tipo": "leitura", "titulo": "The AC isn't working", "texto": "Hello, leasing office. — Hi, this is Bruna in apartment 4B. I'm calling about the AC. It isn't working. — Oh no. Is it not cooling at all? — It turns on, but it doesn't get cold. — Okay. We can send someone tomorrow between nine and eleven. Does that work for you? — I have to leave at eight thirty. Could someone come after five? — Sure. We'll put you down for tomorrow after five. — Thank you.", "glossario": [["leasing office", "administração do prédio"], ["I'm calling about…", "Estou ligando sobre…"], ["isn't working", "não está funcionando"], ["not cooling", "não está gelando"], ["Does that work for you?", "Funciona para você?"], ["put you down for", "agendar você para"], ["between nine and eleven", "entre nove e onze"]]}, {"tipo": "escolha", "pergunta": "Ouça: qual é o problema?", "opcoes": ["O ar-condicionado não funciona", "A pia está vazando", "O aquecedor não liga"], "certa": 0, "audio": "The AC isn't working in my apartment.", "explica": "AC isn't working = o ar-condicionado não está funcionando."}, {"tipo": "escolha", "pergunta": "Ouça: quando alguém pode ir?", "opcoes": ["Amanhã de manhã", "Hoje à noite", "Só na semana que vem"], "certa": 0, "audio": "Someone can come by tomorrow morning.", "explica": "tomorrow morning = amanhã de manhã."}, {"tipo": "escolha", "pergunta": "The heater isn't ___.", "opcoes": ["working", "work", "works"], "certa": 0, "explica": "Depois de isn't o verbo vai com -ing: isn't working."}, {"tipo": "escolha", "pergunta": "There's a ___ under the sink.", "opcoes": ["leak", "leaking", "leaked"], "certa": 0, "explica": "Depois de a vem substantivo: a leak, um vazamento."}, {"tipo": "montar", "pergunta": "O ar-condicionado não está funcionando.", "resposta": "The AC isn't working", "extras": ["don't", "works", "no"], "aceitas": ["The AC is not working"]}, {"tipo": "montar", "pergunta": "Quando alguém pode passar aqui?", "resposta": "When can someone come by", "extras": ["does", "pass", "go"], "aceitas": ["When can someone come by?"]}, {"tipo": "pares", "pergunta": "Ligue a palavra da casa à tradução", "pares": [["leak", "vazamento"], ["landlord", "dono do imóvel"], ["lease", "contrato de aluguel"], ["maintenance", "manutenção"], ["plumber", "encanador"], ["come by", "passar aí"]]}, {"tipo": "ouvir", "texto": "The sink is leaking again."}, {"tipo": "falar", "texto": "Hi, I'm calling about the AC. It isn't working.", "traducao": "Oi, estou ligando sobre o ar-condicionado. Ele não está funcionando."}], "semana": 3}, {"id": "BR-20", "titulo": "Revisão da semana 3 — burocracia", "missao": "Fora do app: faça a ligação que você vem adiando — farmácia, consultório ou leasing office — e use pelo menos três fórmulas da semana.", "itens": [{"tipo": "dica", "rotulo": "Lição 6 · 1/2", "titulo": "O quadro das fórmulas", "html": "<p>Se você guardar só uma coisa desta semana, guarde este quadro. Ele resolve banco, médico, escola, casa e DMV.<\/p><table><tr><td>pedir algo<\/td><td><b>I'd like to…<\/b><\/td><td>I'd like to open an account.<\/td><\/tr><tr><td>pedir favor<\/td><td><b>Could you…?<\/b><\/td><td>Could you help me?<\/td><\/tr><tr><td>dizer o assunto<\/td><td><b>I'm calling about…<\/b><\/td><td>I'm calling about the AC.<\/td><\/tr><tr><td>não entender<\/td><td><b>Sorry, I didn't catch that.<\/b><\/td><td>Sorry, I didn't catch that.<\/td><\/tr><tr><td>confirmar dado<\/td><td><b>Let me read that back.<\/b><\/td><td>Let me read that back to you.<\/td><\/tr><tr><td>soletrar<\/td><td><b>It's B as in boy.<\/b><\/td><td>A-L-M-E-I-D-A.<\/td><\/tr><\/table><p>Repare: as seis começam por <b>I<\/b> ou <b>Could<\/b> e todas são frases inteiras decoradas. Você não monta no calor da hora — você puxa da memória.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 6 · 2/2", "titulo": "A ligação inteira em seis passos", "html": "<p>Toda ligação burocrática tem a mesma espinha. Ensaie nesta ordem:<\/p><table><tr><td>1<\/td><td>atender e se apresentar<\/td><td><b>Hi, this is Bruna Almeida.<\/b><\/td><\/tr><tr><td>2<\/td><td>dizer o assunto<\/td><td><b>I'm calling about my appointment.<\/b><\/td><\/tr><tr><td>3<\/td><td>fazer o pedido<\/td><td><b>I'd like to change it to Friday.<\/b><\/td><\/tr><tr><td>4<\/td><td>soletrar ou ditar número<\/td><td><b>A-L-M-E-I-D-A.<\/b><\/td><\/tr><tr><td>5<\/td><td>confirmar<\/td><td><b>Let me read that back to you.<\/b><\/td><\/tr><tr><td>6<\/td><td>encerrar<\/td><td><b>Thank you. Have a good one.<\/b><\/td><\/tr><\/table><p>Se travar no meio, não recomece a frase: diga <span class='ex'>Sorry, let me start again<\/span> e respire. Pausa não é erro.<\/p><p><b>Let me<\/b> encolhe para /ˈlɛmi/, \"lém-mi\": <span class='ex'>Let me check<\/span> · <span class='ex'>Let me read that back<\/span>. E <b>Have a good one<\/b> é o \"tenha um bom dia\" de todo dia nos EUA.<\/p>"}, {"tipo": "leitura", "titulo": "One call, everything together", "texto": "Good afternoon, City Pharmacy. — Hi, I'm calling about a prescription for my daughter. — What's the name? — Sofia Almeida. A-L-M-E-I-D-A. — Okay. It'll be ready at four. — Sorry, could you repeat that? — Four o'clock today. — Great. Do I need to bring anything? — Just your ID. — Let me read that back: Sofia Almeida, ready at four, bring my ID. — That's right. — Thank you. Have a good one.", "glossario": [["prescription", "receita médica"], ["It'll be ready", "Vai estar pronto"], ["Just your ID", "Só o seu documento"], ["Have a good one", "Tenha um bom dia (informal)"], ["What's the name?", "Qual é o nome?"], ["bring", "trazer"], ["That's right", "Isso mesmo"]]}, {"tipo": "escolha", "pergunta": "Ouça: sobre o que é a ligação?", "opcoes": ["Sobre uma consulta marcada", "Sobre uma conta de banco", "Sobre o aluguel"], "certa": 0, "audio": "I'm calling about my appointment.", "explica": "appointment = consulta, horário marcado."}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa vai fazer?", "opcoes": ["Repetir os dados para confirmar", "Desligar sem falar nada", "Pedir um cartão"], "certa": 0, "audio": "Let me read that back to you.", "explica": "read that back = ler de volta para conferir."}, {"tipo": "escolha", "pergunta": "Qual é o jeito mais educado de pedir que repitam?", "opcoes": ["Could you say that again?", "Say that again.", "Repeat."], "certa": 0, "explica": "Could you + verbo é o pedido educado; as outras duas soam ordem."}, {"tipo": "escolha", "pergunta": "I'm calling ___ my bill.", "opcoes": ["about", "for", "to"], "certa": 0, "explica": "I'm calling about + o assunto da ligação."}, {"tipo": "montar", "pergunta": "Estou ligando sobre minha consulta.", "resposta": "I'm calling about my appointment", "extras": ["for", "call", "to"], "aceitas": ["I am calling about my appointment"]}, {"tipo": "montar", "pergunta": "Deixa eu repetir isso para você.", "resposta": "Let me read that back to you", "extras": ["say", "again", "write"], "aceitas": ["Let me read that back to you."]}, {"tipo": "pares", "pergunta": "Ligue a fórmula ao sentido", "pares": [["I'd like to…", "Eu gostaria de…"], ["Could you…?", "Você poderia…?"], ["I'm calling about…", "Estou ligando sobre…"], ["Sorry, I didn't catch that.", "Desculpe, não entendi."], ["Let me read that back.", "Deixa eu confirmar os dados."], ["Have a good one.", "Tenha um bom dia."]]}, {"tipo": "ouvir", "texto": "I'd like to make an appointment."}, {"tipo": "falar", "texto": "I'm calling about my appointment. Could you repeat that?", "traducao": "Estou ligando sobre a minha consulta. Você pode repetir isso?"}], "semana": 3}, {"id": "BR-21", "titulo": "Documentos: DMV, SSN, formulário e o guichê", "missao": "Fora do app: leia em voz alta, em inglês, os dados da sua carteira de motorista ou do seu SSN — nome completo, data de nascimento e endereço — como se estivesse no guichê.", "itens": [{"tipo": "dica", "rotulo": "Lição 7 · 1/2", "titulo": "No guichê do DMV", "html": "<p>O <b>DMV<\/b> (Department of Motor Vehicles) é onde se tira a <b>driver's license<\/b> e o <b>state ID<\/b>. As perguntas são sempre as mesmas:<\/p><table><tr><td><b>What can I help you with?<\/b><\/td><td>Em que posso ajudar?<\/td><\/tr><tr><td><b>Do you have an appointment?<\/b><\/td><td>Você tem horário marcado?<\/td><\/tr><tr><td><b>Can I see your documents?<\/b><\/td><td>Posso ver seus documentos?<\/td><\/tr><tr><td><b>Please fill out this form.<\/b><\/td><td>Por favor, preencha este formulário.<\/td><\/tr><\/table><p>Suas respostas prontas: <span class='ex'>I'm here to renew my license.<\/span> · <span class='ex'>I'd like to apply for a state ID.<\/span> · <span class='ex'>I have an appointment at ten thirty.<\/span><\/p><p><b>renew<\/b> é renovar /rɪˈnuː/, \"rinú\" — não use <i>renovate<\/i>, que é reformar casa. E <b>license<\/b> é /ˈlaɪsəns/, \"láisens\", com o \"s\" final fraco.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 7 · 2/2", "titulo": "O formulário e a ordem americana", "html": "<p>Todo formulário americano pede os mesmos campos, nesta ordem:<\/p><table><tr><td><b>First name<\/b> / <b>Last name<\/b><\/td><td>nome / sobrenome<\/td><\/tr><tr><td><b>Middle name<\/b><\/td><td>nome do meio (no Brasil, em geral não há)<\/td><\/tr><tr><td><b>Date of birth<\/b><\/td><td>data de nascimento<\/td><\/tr><tr><td><b>Address<\/b> / <b>Apt<\/b><\/td><td>endereço / número do apartamento<\/td><\/tr><tr><td><b>ZIP code<\/b><\/td><td>CEP<\/td><\/tr><tr><td><b>SSN<\/b><\/td><td>Social Security number<\/td><\/tr><\/table><p><b>A armadilha número um:<\/b> a data é <b>mês/dia/ano<\/b>. 03/05/1990 é 5 de março de 1990, não 3 de maio. Quem preenche errado, refaz tudo.<\/p><p>Leia a data em voz alta como americano: <span class='ex'>March fifth, nineteen ninety<\/span>. O SSN se dita dígito por dígito e se soletra \"és-és-én\" /ˌɛs ɛs ˈɛn/.<\/p><p>No fim do formulário: <span class='ex'>Sign here<\/span> — assine aqui, com caneta.<\/p>"}, {"tipo": "leitura", "titulo": "At the DMV window", "texto": "Next, please. — Hi, I have an appointment at ten thirty. I'd like to renew my driver's license. — Okay. Can I see your old license and two proofs of address? — Sure. Here you go. — Thank you. Please fill out this form. Date of birth goes here, month first. — Month first, got it. And the ZIP code? — Right here. Sign at the bottom.", "glossario": [["driver's license", "carteira de motorista"], ["renew", "renovar"], ["proof of address", "comprovante de endereço"], ["fill out this form", "preencher este formulário"], ["date of birth", "data de nascimento"], ["month first", "primeiro o mês"], ["sign at the bottom", "assine embaixo"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que pedem para a pessoa?", "opcoes": ["Preencher um formulário", "Pagar uma multa", "Fazer uma foto"], "certa": 0, "audio": "Please fill out this form.", "explica": "fill out this form = preencher este formulário."}, {"tipo": "escolha", "pergunta": "Ouça: qual documento pedem?", "opcoes": ["O passaporte", "O SSN", "O comprovante de endereço"], "certa": 0, "audio": "Can I see your passport, please?", "explica": "passport = passaporte."}, {"tipo": "escolha", "pergunta": "I'm here to ___ my license.", "opcoes": ["renew", "renovate", "remake"], "certa": 0, "explica": "Renovar documento é renew; renovate é reformar imóvel."}, {"tipo": "escolha", "pergunta": "No formulário americano, 03/05/1990 quer dizer:", "opcoes": ["5 de março de 1990", "3 de maio de 1990", "março de 1990"], "certa": 0, "explica": "Nos EUA a ordem é mês/dia/ano: 03/05 é 5 de março."}, {"tipo": "montar", "pergunta": "Estou aqui para renovar minha carteira de motorista.", "resposta": "I'm here to renew my license", "extras": ["for", "renovate", "at"], "aceitas": ["I am here to renew my license"]}, {"tipo": "montar", "pergunta": "Eu preciso preencher este formulário.", "resposta": "I need to fill out this form", "extras": ["make", "write", "in"], "aceitas": ["I need to fill out this form."]}, {"tipo": "pares", "pergunta": "Ligue o documento à tradução", "pares": [["driver's license", "carteira de motorista"], ["fill out", "preencher"], ["date of birth", "data de nascimento"], ["ZIP code", "CEP"], ["SSN", "número da Previdência social"], ["appointment", "horário marcado"]]}, {"tipo": "ouvir", "texto": "I'd like to renew my license."}, {"tipo": "falar", "texto": "I have an appointment at ten thirty. I'd like to renew my license.", "traducao": "Tenho horário marcado às dez e meia. Eu gostaria de renovar minha carteira de motorista."}], "semana": 3}, {"id": "BR-22", "titulo": "Igreja e comunidade: apresentar-se, entrar num grupo, convite", "missao": "Fora do app: no próximo encontro da igreja, apresente-se a uma pessoa que você ainda não conhece com 'Hi, I'm Bruna. I'm new here.' e pergunte o nome dela.", "itens": [{"tipo": "dica", "rotulo": "Lição 22 · 1/2", "titulo": "Chegar num grupo que já existe", "html": "<p>Três frases resolvem a chegada: <span class='ex'>Hi, I'm Bruna. I'm new here.<\/span> · <span class='ex'>We just moved here from Brazil.<\/span> · <span class='ex'>A neighbor invited me.<\/span><\/p><p>Se o grupo já está conversando, entre pelo assunto, não pela porta: <span class='ex'>Sorry to jump in — I'm Bruna.<\/span><\/p><table><tr><td>I'm new here<\/td><td>é a minha primeira vez aqui<\/td><\/tr><tr><td>We're new to the area<\/td><td>acabamos de chegar na região<\/td><\/tr><tr><td>I've been coming here for a few weeks<\/td><td>frequento aqui há algumas semanas<\/td><\/tr><tr><td>My husband's name is Rodolfo<\/td><td>meu marido se chama Rodolfo<\/td><\/tr><\/table><p>Não traduza <i>frequento<\/i> ao pé da letra: ninguém diz <i>I frequent<\/i>. Diga <span class='ex'>I've been coming here<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 22 · 2/2", "titulo": "Convite: oferecer, aceitar, recusar", "html": "<p>Convite macio, sem pressão: <span class='ex'>We have a small group on Wednesday nights. You should come.<\/span><\/p><p>Aceitar: <span class='ex'>I'd love to.<\/span> · <span class='ex'>That sounds great.<\/span> · <span class='ex'>Count me in.<\/span><\/p><p>Recusar sem fechar a porta: <span class='ex'>I can't this week, but keep me posted.<\/span><\/p><p>Se o encontro for na casa de alguém, pergunte sempre antes de sair: <span class='ex'>Can I bring anything?<\/span><\/p><p>Som: <span class='ex'>would you<\/span> soa /ˈwʊdʒə/ na fala rápida — <span class='ex'>Would you like to come?<\/span> vira /ˈwʊdʒə laɪk tə kʌm/. E <span class='ex'>want to<\/span> vira /ˈwʌnə/ — <span class='ex'>Wanna come?<\/span> é bem informal, só na fala e entre conhecidos.<\/p><p><b>I'd love to<\/b> termina em <i>to<\/i> e não pede verbo depois: é a resposta inteira.<\/p>"}, {"tipo": "leitura", "titulo": "After the service", "texto": "Hi! I don't think we've met. I'm Kayla. — Hi, Kayla. I'm Bruna. I'm new here. — Welcome! How did you find out about the church? — A neighbor invited me. We just moved here from Brazil. — Oh, nice. How long have you been in town? — About three months. — Well, a few of us grab coffee after the service. Would you like to come? — I'd love to. Can I bring anything? — Just yourself. — Thanks. I was a little nervous about coming alone.", "glossario": [["I don't think we've met", "Acho que a gente ainda não se conheceu"], ["How did you find out about…", "Como você ficou sabendo de…"], ["move to", "mudar-se para"], ["in town", "na cidade, por aqui"], ["grab a coffee", "tomar um café, rápido e informal"], ["Just yourself", "Só você mesmo, não precisa trazer nada"], ["nervous", "nervosa, ansiosa"]]}, {"tipo": "escolha", "pergunta": "Ouça: como ela ficou sabendo da igreja?", "opcoes": ["Uma vizinha convidou", "Ela viu na internet", "O marido encontrou"], "certa": 0, "audio": "A neighbor invited me.", "explica": "A frase é 'A neighbor invited me': foi uma vizinha, não a internet nem o marido."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela responde ao convite para o café?", "opcoes": ["Aceita com prazer", "Diz que não pode", "Pede para outro dia"], "certa": 0, "audio": "I'd love to.", "explica": "'I'd love to' é aceitar com entusiasmo; recusar seria 'I can't this week'."}, {"tipo": "escolha", "pergunta": "Qual é a forma natural de dizer que você frequenta a igreja há algumas semanas?", "opcoes": ["I've been coming here for a few weeks.", "I frequent here for a few weeks.", "I am coming here since a few weeks."], "certa": 0, "explica": "Frequência se diz com 'I've been coming here' e 'for'; 'I frequent' não se usa na fala."}, {"tipo": "escolha", "pergunta": "Alguém te convida para um grupo pequeno e você quer aceitar. O que dizer?", "opcoes": ["Count me in.", "Count me on.", "I count in."], "certa": 0, "explica": "O bloco é fixo: 'Count me in' quer dizer conta comigo."}, {"tipo": "montar", "pergunta": "Nós acabamos de nos mudar do Brasil.", "resposta": "We just moved here from Brazil", "extras": ["to", "are", "since"]}, {"tipo": "montar", "pergunta": "Posso levar alguma coisa?", "resposta": "Can I bring anything", "extras": ["take", "carry", "some"]}, {"tipo": "pares", "pergunta": "Ligue a expressão ao sentido", "pares": [["I'm new here", "É a minha primeira vez aqui"], ["How did you find out?", "Como você ficou sabendo?"], ["grab a coffee", "tomar um café"], ["I'd love to", "Eu adoraria"], ["keep me posted", "me mantenha informada"], ["Count me in", "Conta comigo"]]}, {"tipo": "ouvir", "texto": "A neighbor invited me to church."}, {"tipo": "falar", "texto": "Hi, I'm new here. My family just moved from Brazil.", "traducao": "Oi, sou nova aqui. Minha família acabou de se mudar do Brasil."}], "semana": 4}, {"id": "BR-23", "titulo": "Maternidade: falar das meninas, da rotina, da escola", "missao": "Fora do app: conte para uma pessoa em inglês quantas filhas você tem, em que série cada uma está e uma coisa que elas adoram — usando 'She's in…' sem traduzir na cabeça.", "itens": [{"tipo": "dica", "rotulo": "Lição 23 · 1/2", "titulo": "Falar das meninas sem tropeçar", "html": "<p>Comece pelo essencial: <span class='ex'>I have two girls.<\/span> <span class='ex'>They're in elementary school.<\/span><\/p><p>Idade e série pedem palavras diferentes: <span class='ex'>She's eight.<\/span> (idade com <b>is<\/b>) · <span class='ex'>She's in second grade.<\/span> (série com <b>in<\/b>).<\/p><table><tr><td>drop-off<\/td><td>levar as crianças à escola<\/td><\/tr><tr><td>pick-up<\/td><td>buscar as crianças<\/td><\/tr><tr><td>lunchbox<\/td><td>marmita<\/td><\/tr><tr><td>homework<\/td><td>lição de casa<\/td><\/tr><tr><td>playdate<\/td><td>encontro para as crianças brincarem<\/td><\/tr><tr><td>front office<\/td><td>secretaria da escola<\/td><\/tr><\/table><p>Som: <b>daughter<\/b> soa /ˈdɔɾər/ — o <i>gh<\/i> é mudo e o <i>t<\/i> vira um toque leve, como o <i>r<\/i> de careta. Exemplos: <span class='ex'>my daughter<\/span>, <span class='ex'>my two daughters<\/span>.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 23 · 2/2", "titulo": "A rotina da casa e a escola", "html": "<p>A rotina sai em blocos curtos: <span class='ex'>On school days we're up at six.<\/span> · <span class='ex'>I drop them off at 7:30.<\/span> · <span class='ex'>I pick them up in the afternoon.<\/span><\/p><p>Para o que vem acontecendo e ainda acontece: <span class='ex'>She's been a little clingy lately.<\/span> — <b>has been<\/b> + adjetivo.<\/p><p>Na escola: <span class='ex'>parent-teacher conference<\/span> (reunião de pais), <span class='ex'>a note from the teacher<\/span> (bilhete da professora), <span class='ex'>she's adjusting well<\/span> (está se adaptando bem).<\/p><p>A pergunta que sempre abre conversa entre mães: <span class='ex'>How's she adjusting?<\/span><\/p>"}, {"tipo": "leitura", "titulo": "At the playground", "texto": "Is that your little one on the swing? — Yes, that's my youngest. The other two are over there. — How old are they? — Eight and five. The little one starts kindergarten next year. — Oh, big year. How's she adjusting? — Pretty well. She's been a little clingy lately, but the teacher says she's fine. — That's normal. Mine went through the same thing. — How old is yours? — She's seven, in second grade. — Do they go to the same school? — Same school, different grades. Do you do drop-off every day? — Most days. On Fridays my husband picks them up.", "glossario": [["little one", "o pequeno, a pequena (carinhoso)"], ["youngest", "a mais nova"], ["kindergarten", "primeiro ano da escola, aos cinco anos"], ["How's she adjusting?", "Como ela está se adaptando?"], ["clingy", "grudada, carente"], ["went through the same thing", "passou pelo mesmo"], ["drop-off", "o levar as crianças à escola"], ["grades", "séries escolares"]]}, {"tipo": "escolha", "pergunta": "Ouça: quantos anos tem a filha dela?", "opcoes": ["Sete", "Cinco", "Oito"], "certa": 0, "audio": "She's seven.", "explica": "'Seven' é sete; oito seria 'eight' e cinco, 'five'."}, {"tipo": "escolha", "pergunta": "Ouça: como a menina está?", "opcoes": ["Um pouco carente e grudada", "Muito doente", "Muito independente"], "certa": 0, "audio": "She's been a little clingy lately.", "explica": "'Clingy' é carente, grudada; não tem nada a ver com doença."}, {"tipo": "escolha", "pergunta": "My daughter ___ in third grade.", "opcoes": ["is", "has", "does"], "certa": 0, "explica": "Série vem com 'is in': she's in third grade."}, {"tipo": "escolha", "pergunta": "Ela tem oito anos. → She ___ eight.", "opcoes": ["is", "has", "have"], "certa": 0, "explica": "Idade em inglês usa 'is', não 'has': she is eight."}, {"tipo": "montar", "pergunta": "Minha filha está no terceiro ano.", "resposta": "My daughter is in third grade", "extras": ["has", "on", "the"]}, {"tipo": "montar", "pergunta": "Eu levo elas às sete e meia.", "resposta": "I drop them off at seven thirty", "extras": ["pick", "to", "take"]}, {"tipo": "pares", "pergunta": "Ligue a palavra do dia a dia ao sentido", "pares": [["drop-off", "levar as crianças à escola"], ["pick-up", "buscar as crianças"], ["third grade", "terceiro ano"], ["playdate", "encontro para as crianças brincarem"], ["homework", "lição de casa"], ["clingy", "carente, grudada"]]}, {"tipo": "ouvir", "texto": "She's in second grade."}, {"tipo": "falar", "texto": "I have two girls. They're in elementary school.", "traducao": "Eu tenho duas meninas. Elas estão no fundamental."}], "semana": 4}, {"id": "BR-24", "titulo": "Sentimentos e desenvolvimento pessoal: vocabulário emocional", "missao": "Fora do app: escreva no diário, em inglês, três frases sobre a sua semana com 'I've been feeling…', 'It hit me hard' e 'I'm working on it'.", "itens": [{"tipo": "dica", "rotulo": "Lição 24 · 1/2", "titulo": "Nomear o que você sente, com precisão", "html": "<p>Três camadas de cansaço: <span class='ex'>I'm tired<\/span> (cansada) · <span class='ex'>I'm drained<\/span> (sem energia nenhuma) · <span class='ex'>I'm overwhelmed<\/span> (tem mais coisa do que eu dou conta).<\/p><p>Para o que é do coração: <span class='ex'>I'm down<\/span> (pra baixo) · <span class='ex'>I've been feeling off<\/span> (estranha, fora do eixo) · <span class='ex'>It hit me hard<\/span> (me pegou forte).<\/p><p>Ansiedade: <span class='ex'>I'm anxious about the move<\/span> é a preocupação de antes; <span class='ex'>I'm nervous<\/span> é o frio na barriga; <span class='ex'>I'm stressed out<\/span> é o dia a dia carregado.<\/p><p>Palavras do seu trabalho: <span class='ex'>That really resonated with me<\/span> (fez muito sentido pra mim) · <span class='ex'>I'm working on it<\/span> (estou trabalhando nisso) · <span class='ex'>I set a boundary<\/span> (coloquei um limite).<\/p>"}, {"tipo": "dica", "rotulo": "Lição 24 · 2/2", "titulo": "I feel x I feel like, e o for me", "html": "<p><span class='ex'>I feel tired.<\/span> (adjetivo) · <span class='ex'>I feel like I'm running all day.<\/span> (<b>feel like<\/b> + frase).<\/p><p>Erro clássico de brasileiro: <i>It's hard to me<\/i>. É sempre <span class='ex'>It's hard for me.<\/span><\/p><p>Para se abrir sem se expor demais, use o amortecedor antes: <span class='ex'>To be honest, I've been a little down.<\/span> · <span class='ex'>I don't know how to say this, but…<\/span><\/p><p>Som: <b>anxious<\/b> não é /ãʃoso/. É /ˈæŋkʃəs/, com o <i>a<\/i> de cat e o /ŋk/ de banco. Exemplos: <span class='ex'>I'm anxious<\/span>, <span class='ex'>anxiety<\/span> /æŋˈzaɪəti/.<\/p>"}, {"tipo": "leitura", "titulo": "Coffee with a friend", "texto": "How've you been? I feel like I haven't seen you in weeks. — Honestly? A little drained. The move, the girls, everything at once. — That makes sense. That's a lot. — I've been feeling off, you know? Like I'm here but my head is somewhere else. — I hear you. When we moved, it hit me hard around month three. — Month three is exactly where I am. — What's been helping? — Journaling, mostly. And I set one boundary: no phone after the girls go to bed. — Oh, that's good. — It's hard for me, but it's working. — That really resonates, actually. I might try it.", "glossario": [["How've you been?", "Como você tem estado?"], ["drained", "sem energia, esgotada"], ["That makes sense.", "Faz sentido."], ["I hear you.", "Entendo o que você está dizendo."], ["it hit me hard", "me pegou forte"], ["What's been helping?", "O que tem te ajudado?"], ["boundary", "limite pessoal"], ["It's working.", "Está funcionando."]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ela quer dizer?", "opcoes": ["Que está se sentindo estranha, fora do eixo", "Que está muito feliz", "Que está com dor de cabeça"], "certa": 0, "audio": "I've been feeling a little off.", "explica": "'Feeling off' é se sentir estranha, fora do eixo, sem ser doença."}, {"tipo": "escolha", "pergunta": "Ouça: o que aconteceu com ela?", "opcoes": ["Aquilo a pegou forte", "Foi tudo muito rápido", "Não a afetou"], "certa": 0, "audio": "It hit me hard.", "explica": "'It hit me hard' é 'me pegou forte', emocionalmente."}, {"tipo": "escolha", "pergunta": "It's hard ___ me to talk about it.", "opcoes": ["for", "to", "at"], "certa": 0, "explica": "A preposição é sempre 'for': hard for me."}, {"tipo": "escolha", "pergunta": "I feel ___ I'm running all day.", "opcoes": ["like", "as", "that"], "certa": 0, "explica": "'Feel like' + frase: I feel like I'm running all day."}, {"tipo": "montar", "pergunta": "Ultimamente eu tenho me sentido estranha.", "resposta": "I've been feeling off lately", "extras": ["am", "feel", "recently"]}, {"tipo": "montar", "pergunta": "Estou trabalhando nisso.", "resposta": "I'm working on it", "extras": ["in", "for", "work"]}, {"tipo": "pares", "pergunta": "Ligue o sentimento à tradução", "pares": [["drained", "esgotada, sem energia"], ["overwhelmed", "sobrecarregada"], ["I hear you", "entendo o que você diz"], ["boundary", "limite pessoal"], ["It hit me hard", "me pegou forte"], ["I'm working on it", "estou trabalhando nisso"]]}, {"tipo": "ouvir", "texto": "I've been feeling a little down."}, {"tipo": "falar", "texto": "To be honest, I've been a little drained. I'm working on it.", "traducao": "Pra ser sincera, eu tenho ficado um pouco sem energia. Estou trabalhando nisso."}], "semana": 4}, {"id": "BR-25", "titulo": "Gírias seguras e expressões que os nativos usam todo dia", "missao": "Fora do app: use hoje, numa conversa real, 'sounds good', 'no worries' e 'for sure', e anote em que situação cada uma caiu melhor.", "itens": [{"tipo": "dica", "rotulo": "Lição 25 · 1/2", "titulo": "Expressões que todo americano usa e nenhuma é vulgar", "html": "<p>Estas você pode usar em qualquer lugar, com qualquer pessoa:<\/p><table><tr><td>No worries.<\/td><td>sem problema<\/td><\/tr><tr><td>For sure.<\/td><td>com certeza<\/td><\/tr><tr><td>Sounds good.<\/td><td>combinado<\/td><\/tr><tr><td>I'm good.<\/td><td>estou bem, ou não, obrigada<\/td><\/tr><tr><td>My bad.<\/td><td>foi mal, culpa minha<\/td><\/tr><tr><td>No big deal.<\/td><td>não é nada demais<\/td><\/tr><tr><td>You bet.<\/td><td>imagina, com certeza<\/td><\/tr><\/table><p>Cuidado com <b>I'm good<\/b>: ofereceram algo e a pessoa diz <span class='ex'>I'm good, thanks<\/span> — isso é <b>recusa<\/b> educada, não é falar da saúde. Muita gente acaba aceitando o que não quer por não saber disso.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 25 · 2/2", "titulo": "Verbos e reações entre amigos", "html": "<p>De amizade, informais mas limpos: <span class='ex'>hang out<\/span> (passar um tempo junto, sem programa fixo) · <span class='ex'>grab a bite<\/span> (comer algo rápido) · <span class='ex'>hit me up<\/span> (me chama, me procura) · <span class='ex'>I'm down<\/span> (topo, estou dentro) · <span class='ex'>Long story short<\/span> (resumindo).<\/p><p>De qualquer registro: <span class='ex'>That's awesome!<\/span> · <span class='ex'>kind of<\/span> e <span class='ex'>sort of<\/span> (meio, mais ou menos) · <span class='ex'>Totally.<\/span><\/p><p>Regra de ouro: <span class='ex'>hit me up<\/span> e <span class='ex'>I'm down<\/span> são para amigos, não para e-mail de trabalho. Nada aqui é palavrão: se alguém usar uma palavra pesada, você não precisa repetir — solte um <span class='ex'>No way!<\/span> e a conversa continua.<\/p><p>Som: <span class='ex'>What's up?<\/span> vira /wəˈsʌp/, o <i>t<\/i> desaparece. E <span class='ex'>kind of<\/span> vira /ˈkaɪndə/. Exemplos: <span class='ex'>Hey, what's up?<\/span>, <span class='ex'>It's kind of late.<\/span><\/p>"}, {"tipo": "leitura", "titulo": "Saturday at the park", "texto": "Hey! Are you free Saturday? A few of us are hanging out at the park. — Sounds good. What time? — Around ten. Bring the girls. — They'd love that. Should I bring anything? — Just snacks if you want. No big deal. — For sure. Hey, my bad for not answering yesterday, crazy day. — No worries at all. — See you Saturday. Text me if anything changes. — You bet.", "glossario": [["hang out", "passar um tempo junto, sem programa fixo"], ["Sounds good", "combinado"], ["No big deal", "não é nada demais"], ["My bad", "foi mal, culpa minha"], ["No worries", "sem problema"], ["You bet", "imagina, com certeza"], ["Text me", "me manda mensagem"]]}, {"tipo": "escolha", "pergunta": "Ouça: ofereceram café e ela respondeu. O que ela quis dizer?", "opcoes": ["Não, obrigada", "Que está bem de saúde", "Quero sim"], "certa": 0, "audio": "I'm good, thanks.", "explica": "Numa oferta, 'I'm good' é recusa educada, não um comentário sobre a saúde."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela quer dizer?", "opcoes": ["Não é nada demais", "É um problemão", "É segredo"], "certa": 0, "audio": "It's no big deal.", "explica": "'No big deal' minimiza o problema: não foi nada."}, {"tipo": "escolha", "pergunta": "Alguém esbarra em você e diz 'My bad'. Ela está:", "opcoes": ["Pedindo desculpa de um jeito leve", "Dando uma ordem", "Fazendo um elogio"], "certa": 0, "explica": "'My bad' é desculpa rápida e leve, entre amigos."}, {"tipo": "escolha", "pergunta": "Qual destas é informal demais para um e-mail de trabalho?", "opcoes": ["Hit me up", "Sounds good", "No worries"], "certa": 0, "explica": "'Hit me up' é de amizade; as outras duas servem no trabalho."}, {"tipo": "montar", "pergunta": "Eles querem passar um tempo no parque.", "resposta": "They want to hang out at the park", "extras": ["up", "in", "make"]}, {"tipo": "montar", "pergunta": "Me manda mensagem se mudar alguma coisa.", "resposta": "Text me if anything changes", "extras": ["call", "something", "change"]}, {"tipo": "pares", "pergunta": "Ligue a gíria ao sentido", "pares": [["No worries", "sem problema"], ["My bad", "foi mal"], ["hang out", "passar um tempo junto"], ["grab a bite", "comer algo rápido"], ["I'm down", "topo, estou dentro"], ["You bet", "imagina, com certeza"]]}, {"tipo": "ouvir", "texto": "Text me if anything changes."}, {"tipo": "falar", "texto": "Sounds good. No worries, it's no big deal.", "traducao": "Combinado. Sem problema, não foi nada demais."}], "semana": 4}, {"id": "BR-26", "titulo": "Sustentar 5 minutos de conversa sem travar", "missao": "Fora do app: grave 5 minutos de conversa em inglês, sozinha ou com alguém, soltando um marcador de escuta a cada duas frases e devolvendo a pergunta três vezes; depois ouça e conte quantos marcadores você usou.", "itens": [{"tipo": "dica", "rotulo": "Lição 26 · 1/2", "titulo": "Os marcadores que fazem a conversa andar", "html": "<p>Eles não traduzem nada, só mostram que você está ali:<\/p><table><tr><td>Right?<\/td><td>né?<\/td><\/tr><tr><td>Oh really?<\/td><td>é mesmo?<\/td><\/tr><tr><td>That makes sense.<\/td><td>faz sentido<\/td><\/tr><tr><td>Got it.<\/td><td>entendi<\/td><\/tr><tr><td>No way!<\/td><td>não acredito!<\/td><\/tr><tr><td>Exactly.<\/td><td>exatamente<\/td><\/tr><tr><td>I hear you.<\/td><td>te entendo<\/td><\/tr><tr><td>Tell me more.<\/td><td>conta mais<\/td><\/tr><\/table><p>Regra prática: a cada duas frases suas, solte um marcador. Sem isso, o americano conclui que você não está entendendo — e a conversa morre.<\/p><p>Som: marcador de checagem <b>sobe<\/b> no fim. <span class='ex'>Oh really?<\/span> soa /oʊ ˈrɪli/ subindo · <span class='ex'>Right?<\/span> soa /raɪt/ subindo. Afirmação desce, pergunta sobe.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 26 · 2/2", "titulo": "Devolver a pergunta e ganhar tempo", "html": "<p>O ciclo de cinco minutos tem quatro peças: <b>responder curto<\/b>, <b>reagir<\/b>, <b>contar um detalhe<\/b>, <b>devolver<\/b>. Quem só responde morre no segundo minuto; quem devolve, fica.<\/p><p>Devolver: <span class='ex'>How about you?<\/span> · <span class='ex'>What about you?<\/span> · <span class='ex'>Have you been through that?<\/span> · <span class='ex'>What do you think?<\/span><\/p><p>Ganhar tempo sem travar: <span class='ex'>That's a good question.<\/span> · <span class='ex'>Let me think for a second.<\/span> · <span class='ex'>How do I say this…<\/span><\/p><p>Quando não entendeu: <span class='ex'>Sorry, say that again?<\/span> · <span class='ex'>I didn't catch that last part.<\/span> Pedir repetição não quebra nada; fingir que entendeu, sim.<\/p>"}, {"tipo": "leitura", "titulo": "Five minutes with a neighbor", "texto": "So how did you end up in Texas? — My husband's job. We moved in July. — Oh really? From where? — Brazil. Salvador, on the coast. — No way. I've heard it's beautiful. — It is. The food, the music, the beach. I miss it. How about you, are you from here? — Born and raised. Never lived anywhere else. — Right? I feel like everyone here knows each other. — Exactly. That's Texas for you. So, do the girls like it here? — They do. School was hard at first, but now they have friends. — That makes sense. Kids adapt faster than we do. — Tell me more about that. How long did it take for yours? — About six months, honestly.", "glossario": [["end up", "acabar indo parar em algum lugar"], ["Born and raised.", "Nasci e cresci aqui."], ["I've heard", "ouvi dizer"], ["at first", "no começo"], ["adapt", "se adaptar"], ["That's Texas for you.", "Texas é assim mesmo."], ["honestly", "sinceramente"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que a pessoa está fazendo ao dizer isso?", "opcoes": ["Pedindo mais detalhes", "Discordando", "Encerrando o assunto"], "certa": 0, "audio": "Oh really?", "explica": "'Oh really?' com a voz subindo pede mais; não é discordância."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela não conseguiu?", "opcoes": ["Entender o final da frase", "Gostar do final da frase", "Ouvir o final da frase"], "certa": 0, "audio": "I didn't catch that last part.", "explica": "'I didn't catch that' é não entendi o que foi dito, não não gostei."}, {"tipo": "escolha", "pergunta": "Alguém conta uma novidade e você quer que ela continue:", "opcoes": ["Tell me more.", "That's enough.", "Let me think."], "certa": 0, "explica": "'Tell me more' pede continuação; as outras duas fecham a conversa."}, {"tipo": "escolha", "pergunta": "Você não entendeu a última frase. O mais natural é:", "opcoes": ["Sorry, say that again?", "Repeat, please, the last sentence.", "What?", "Speak slowly."], "certa": 0, "explica": "O bloco natural é 'Sorry, say that again?'; 'Repeat, please' soa de sala de aula."}, {"tipo": "montar", "pergunta": "Faz sentido. E você, o que acha?", "resposta": "That makes sense What do you think", "extras": ["like", "Does", "made"]}, {"tipo": "montar", "pergunta": "Desculpa, repete isso?", "resposta": "Sorry say that again", "extras": ["tell", "repeat", "speak"]}, {"tipo": "pares", "pergunta": "Ligue o marcador ao sentido", "pares": [["Oh really?", "É mesmo?"], ["That makes sense", "Faz sentido"], ["Tell me more", "Conta mais"], ["I hear you", "Te entendo"], ["How about you?", "E você?"], ["I didn't catch that", "Não entendi essa parte"]]}, {"tipo": "ouvir", "texto": "Sorry, say that again?"}, {"tipo": "falar", "texto": "Oh really? That makes sense. Tell me more about it.", "traducao": "É mesmo? Faz sentido. Conta mais sobre isso."}], "semana": 4}, {"id": "BR-27", "titulo": "Revisão da semana 4 + autoavaliação", "missao": "Fora do app: leia as seis frases 'I can…' em voz alta, dê uma nota de 1 a 5 para cada uma e mande as notas no grupo.", "itens": [{"tipo": "dica", "rotulo": "Lição 27 · 1/2", "titulo": "O que ficou desta semana", "html": "<p>Semana de voz própria, cinco frentes: entrar num grupo (<span class='ex'>I'm new here<\/span>), falar das meninas (<span class='ex'>She's in third grade<\/span>), nomear sentimento (<span class='ex'>I'm drained<\/span>), gíria segura (<span class='ex'>No worries<\/span>), sustentar turno (<span class='ex'>Oh really? Tell me more.<\/span>)<\/p><p>Teste rápido: se essas cinco saem da boca sem tradução na cabeça, a semana cumpriu o papel. A que travar é a que você repete amanhã.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 27 · 2/2", "titulo": "Autoavaliação em I can", "html": "<p>Dê uma nota de 1 a 5 para cada frase. Nota honesta vale mais que nota alta: é ela que decide o que repetir.<\/p><table><tr><td>I can introduce myself to a group.<\/td><td>1 a 5<\/td><\/tr><tr><td>I can talk about my daughters and their school.<\/td><td>1 a 5<\/td><\/tr><tr><td>I can name what I'm feeling.<\/td><td>1 a 5<\/td><\/tr><tr><td>I can use no worries, my bad, for sure.<\/td><td>1 a 5<\/td><\/tr><tr><td>I can keep a conversation going for five minutes.<\/td><td>1 a 5<\/td><\/tr><tr><td>I can ask someone to repeat.<\/td><td>1 a 5<\/td><\/tr><\/table><p>Nota 1 ou 2: volte na lição correspondente antes de seguir. Nota 4 ou 5: é isso que você leva para a aula da semana 5.<\/p>"}, {"tipo": "leitura", "titulo": "After the service, again", "texto": "Bruna, right? We met after the service. — Yes! How are you? — Good, good. How are the girls settling in? — Pretty well, thanks. The older one is in third grade now, and she's made a couple of friends. — Oh, that's great. And you? How are you doing with the move? — Honestly, some days I'm drained. Other days it feels like home. — That makes sense. It took me a year. — A year? Oh really? — Yeah. But I found my people here, and that helped. — That's exactly what I'm looking for. — Well, you found one. Come to the small group on Wednesday. — I'd love to. Count me in.", "glossario": [["settling in", "se ambientando"], ["a couple of", "alguns, uns dois"], ["How are you doing with…?", "Como você está lidando com…?"], ["my people", "minhas pessoas, meu grupo"], ["That's exactly what I'm looking for", "É exatamente o que eu procuro"], ["Count me in", "conta comigo"], ["It feels like home", "parece que já é casa"]]}, {"tipo": "escolha", "pergunta": "Ouça: o que ela diz sobre os dias dela?", "opcoes": ["Alguns dias ela fica sem energia", "Ela está sempre animada", "Ela nunca fica cansada"], "certa": 0, "audio": "Honestly, some days I'm drained.", "explica": "'Some days I'm drained' é alguns dias sem energia, não todos."}, {"tipo": "escolha", "pergunta": "Ouça: o que ela fez com o convite?", "opcoes": ["Aceitou", "Recusou", "Pediu para pensar"], "certa": 0, "audio": "I'd love to. Count me in.", "explica": "'I'd love to' mais 'Count me in' é aceitar sem dúvida."}, {"tipo": "escolha", "pergunta": "Qual frase apresenta você a um grupo novo, corretamente?", "opcoes": ["I'm new here. My family just moved from Brazil.", "I new here. My family just move from Brazil.", "I'm new here. My family just moved of Brazil."], "certa": 0, "explica": "Verbo com sujeito e passado certo: 'I'm new here' e 'just moved from'."}, {"tipo": "escolha", "pergunta": "A melhor resposta para 'How are the girls settling in?' é:", "opcoes": ["They're doing great. They love their school.", "Yes, I am fine, thank you.", "The girls is fine."], "certa": 0, "explica": "A pergunta é sobre as meninas: a resposta usa 'they', não 'I'."}, {"tipo": "montar", "pergunta": "Ela está no terceiro ano e já fez amigos.", "resposta": "She's in third grade and has made friends", "extras": ["on", "have", "make"]}, {"tipo": "montar", "pergunta": "Alguns dias eu fico sem energia.", "resposta": "Some days I feel drained", "extras": ["am", "tired", "day"]}, {"tipo": "pares", "pergunta": "Ligue o que você aprendeu nesta semana", "pares": [["settling in", "se ambientando"], ["drained", "sem energia"], ["Count me in", "conta comigo"], ["Oh really?", "É mesmo?"], ["That makes sense", "Faz sentido"], ["She's in third grade", "Ela está no terceiro ano"]]}, {"tipo": "ouvir", "texto": "I'm new here, and I'd love to join the group."}, {"tipo": "falar", "texto": "Honestly, some days I'm drained, but I'm settling in.", "traducao": "Sinceramente, alguns dias eu fico sem energia, mas estou me ambientando."}], "semana": 4}, {"id": "BR-28", "titulo": "Checkpoint do bloco: fala de 2 min e o que abre a semana 5", "missao": "Fora do app: grave um áudio de 2 minutos com os quatro blocos (quem sou, por que vim, o que faço, o que quero), ouça uma vez e mande no grupo junto com as três coisas para a aula da semana 5.", "itens": [{"tipo": "dica", "rotulo": "Lição 28 · 1/2", "titulo": "O essencial das quatro semanas", "html": "<table><tr><td>Semana 1<\/td><td>ouvir no ritmo: linking (an apple, get up), reduções (whaddya, kinda), small talk<\/td><\/tr><tr><td>Semana 2<\/td><td>falar em blocos: I feel like…, To be honest…, passado (went, had, got, saw), /æ/ /ʌ/ /ɜr/<\/td><\/tr><tr><td>Semana 3<\/td><td>resolver a vida: I'd like to…, Could you…?, sintomas, telefone, escola, casa<\/td><\/tr><tr><td>Semana 4<\/td><td>voz própria: entrar em grupo, maternidade, sentimento, gíria, turnos<\/td><\/tr><\/table><p>Cada linha dessas é uma porta. A que não abre sozinha é por onde a semana 5 começa.<\/p>"}, {"tipo": "dica", "rotulo": "Lição 28 · 2/2", "titulo": "A fala de 2 minutos e a semana 5", "html": "<p>Quatro blocos, trinta segundos cada: <b>quem sou<\/b> (<span class='ex'>I'm Bruna, I'm from Brazil, I live in…<\/span>) · <b>por que vim<\/b> (<span class='ex'>We moved because…<\/span>) · <b>o que faço<\/b> (<span class='ex'>I work with…<\/span>) · <b>o que quero<\/b> (<span class='ex'>I want to…<\/span>).<\/p><p>Abrir com <span class='ex'>So, a little about me…<\/span> e fechar com <span class='ex'>That's pretty much it. What about you?<\/span><\/p><p>Semana 5: o professor entra uma vez por semana, opcional. Antes da aula, mande três coisas: o áudio deste checkpoint, duas perguntas que você quer responder melhor e o pedido <span class='ex'>Please correct me as I go.<\/span><\/p><p>Som de revisão: <span class='ex'>I've been<\/span> soa /aɪv bɪn/ — <span class='ex'>I've been working<\/span> /aɪv bɪn ˈwɜrkɪŋ/. E <span class='ex'>want to<\/span> vira /ˈwʌnə/ na fala rápida. Exemplos: <span class='ex'>I've been here for three months<\/span>, <span class='ex'>I wanna improve<\/span>.<\/p>"}, {"tipo": "leitura", "titulo": "Two minutes about me", "texto": "Hi, I'm Bruna. I'm from Brazil, Salvador, on the coast. I've been in the US for about three months now, with my husband and our two girls. We moved because of his job, and honestly, it's been a lot. The girls are in elementary school, and they're adjusting faster than I am. Back home I worked in emotional and spiritual development, helping people understand what they feel and why. That's the work I want to keep doing here. Right now my English is my main project. I understand most of what people say, but when I speak, I still translate in my head. So I'm practicing every day: listening on my way to the gym, talking to neighbors, writing a little at night. In a year, I want to work with people here, in English, without stopping to translate. That's pretty much it. What about you, what brought you here?", "glossario": [["Back home", "No meu país, lá em casa"], ["emotional and spiritual development", "desenvolvimento emocional e espiritual"], ["the work I wan
