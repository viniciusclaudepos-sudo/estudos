<style>

.tile{padding:9px 13px}.tile.usado{visibility:hidden}

.fb{display:none;margin-bottom:12px}.fb b{font-size:18px}.fb p{margin:4px 0 0;font-size:15px}

.erros li{margin:6px 0}
#semjs{padding:30px;text-align:center}

<script>

olha", "pergunta": "Qual está certa?", "opcoes": ["She usually has lunch at one.", "She has usually lunch at one."], "certa": 0, "explica": "Revisão de ontem: advérbio antes do verbo principal."}, {"tipo": "ouvir", "texto": "What time do you start work?"}, {"tipo": "ouvir", "texto": "Who do you work with?"}, {"tipo": "falar", "texto": "Where do you live? What do you do?", "traducao": "Onde você mora? Em que você trabalha?"}, {"tipo": "falar", "texto": "How do you go to work? By car.", "traducao": "Como você vai para o trabalho? De carro."}, {"tipo": "dica", "rotulo": "Lição 11 · 3/3", "titulo": "Agora, o áudio", "html": "<p>Na volta: <b>Let's Learn English, Level 1<\/b>, lição 6, da VOA Learning English. Depois, no British Council LearnEnglish (Skills › Listening › A1): <i>Meeting a new team member<\/i> e, se couber nos 20 min, <i>A voicemail message<\/i>. O que não couber passa para a próxima terça.<\/p><p>Anote no grupo as perguntas com <i>what, where, when, who<\/i> ou <i>how<\/i> que você pegou.<\/p>"}]};

function render(){
 const it=fila[pos];estado='q';F.className='';FB.innerHTML='';GO.textContent='Verificar';PU.hidden=true;pronto(false);checar=null;

 else{F.className='err';FB.innerHTML=`<b>Resposta certa:</b>${certa?`<p>${esc(certa)}</p>`:''}${nota?`<p>${esc(nota)}</p>`:''}${it.explica?`<p>${esc(it.explica)}</p>`:''}`;

function fim(){
 $('#prog').style.width='100%';const min=Math.max(1,Math.round((Date.now()-t0)/60000)),pct=Math.round(acertos/totalBase()*100);
